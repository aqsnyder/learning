# Resources for: Condensed Matter and Materials
# Edit this file, then run `python tools/build.py` to regenerate README.md, PROGRESS.md and the indexes.
# Field reference: tools/README.md

[[groups]]

[[groups.items]]
id = "introduction-to-solid-state-physics"
title = "Introduction to Solid State Physics"
authors = "Charles Kittel"
type = "book"
marks = ["core"]
description = "The classic undergraduate text: crystal structure, phonons, the free-electron Fermi gas, energy bands and semiconductor crystals, plus the chapter on dielectrics and ferroelectrics behind Practice 4. Read it after Simon, for breadth and for its problems."
access = "paid"
level = "intermediate"

[[groups.items]]
id = "the-oxford-solid-state-basics"
title = "The Oxford Solid State Basics"
authors = "Steven H. Simon"
type = "book"
marks = ["core"]
description = "A clear modern first course: the Drude and Sommerfeld models, vibrations and electrons in one-dimensional chains, tight binding, semiconductor physics and devices, and magnetism with mean-field theory. The first pass through objectives 1–3, before Kittel."
access = "paid"
level = "intermediate"

[[groups.items]]
id = "solid-state-physics"
title = "Solid State Physics"
authors = "Ashcroft & Mermin"
type = "book"
description = "The standard graduate reference, more advanced and complete than Kittel: the Drude and Sommerfeld theories and their failures (Ch. 1–2, used in Practice 2), semiclassical transport, magnetism and superconductivity."
access = "paid"
level = "advanced"

[[groups.items]]
id = "mit-8-231-physics-of-solids-i-fall-2006"
title = "MIT 8.231 Physics of Solids I (Fall 2006)"
authors = "Xiao-Gang Wen"
year = "2006"
type = "course"
access = "free"
url = "https://ocw.mit.edu/courses/8-231-physics-of-solids-i-fall-2006/"
link_text = "MIT OCW"
description = "Problem sets (the OCW site has no lecture notes or videos) from Wen's MIT course introducing the quantum theory of solids. Use them for extra practice after Simon and Kittel."
level = "advanced"
verified = 2026-10-21

[[groups.items]]
id = "modern-condensed-matter-physics"
title = "Modern Condensed Matter Physics"
authors = "Girvin & Yang"
type = "book"
description = "A modern graduate text that reaches topological phases and the quantum Hall effect; the source for Practice 1's stretch goal, the winding number of the dimerized chain."
access = "paid"
level = "advanced"

[[groups.items]]
id = "more-is-different"
title = "More Is Different: Broken Symmetry and the Nature of the Hierarchical Structure of Science"
authors = "P. W. Anderson"
year = "1972"
type = "paper"
marks = ["core"]
url = "https://doi.org/10.1126/science.177.4047.393"
link_text = "DOI (Science)"
description = "Anderson's short essay in *Science* arguing that each level of complexity has its own laws, which can't be derived in practice from the level below, with broken symmetry (crystals, superconductivity, ammonia inversion) as the mechanism. The text behind objective 5 and Practice 5."
access = "paid"
verified = 2026-10-21

[[groups.items]]
id = "the-oxford-solid-state-basics-lecture"
title = "The Oxford Solid State Basics (lecture videos, 2014)"
authors = "Steven H. Simon"
year = "2014"
type = "course"
url = "https://podcasts.ox.ac.uk/series/oxford-solid-state-basics"
link_text = "Oxford Podcasts"
description = "Simon's own lecture course on the book, recorded at Oxford and free on the university's podcast site. Watch it alongside the book as a first pass through the core material."
access = "free"
level = "intermediate"
verified = 2026-10-13

[[groups.items]]
id = "modern-semiconductor-devices-for"
title = "Modern Semiconductor Devices for Integrated Circuits"
authors = "Chenming Hu"
year = "2010"
type = "book"
url = "https://www.chu.berkeley.edu/modern-semiconductor-devices-for-integrated-circuits-chenming-calvin-hu-2010/"
link_text = "chu.berkeley.edu (free chapters)"
description = "Hu's device textbook (Pearson Prentice Hall, 2010), all eight chapters free on the author's site: carriers, drift and diffusion, pn and metal–semiconductor junctions, MOS capacitors, MOSFETs and bipolar transistors. The bridge from band theory to the devices in objective 3 and the mini-project."
access = "free"
level = "intermediate"
verified = 2026-10-21
