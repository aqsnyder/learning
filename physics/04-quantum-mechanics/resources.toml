[[groups]]

[[groups.items]]
id = "introduction-to-quantum-mechanics-3rd-ed"
title = "Introduction to Quantum Mechanics (3rd ed., 2018)"
authors = "David J. Griffiths & Darrell F. Schroeter"
year = "2018"
type = "book"
marks = ["core"]
url = "https://doi.org/10.1017/9781316995433"
link_text = "Cambridge"
description = "The standard undergraduate text, in the third edition co-authored with Schroeter: wavefunctions and the Schrödinger equation, the formalism, angular momentum and spin, perturbation theory and the WKB approximation. The section's primary textbook and the analytic reference for exercises 1 and 4."
access = "paid"
level = "intermediate"
verified = 2026-10-21

[[groups.items]]
id = "the-feynman-lectures-on-physics-vol-3"
title = "The Feynman Lectures on Physics, Volume III"
authors = "Feynman, Leighton & Sands"
year = "2013"
type = "book"
access = "free"
level = "intermediate"
marks = ["core"]
url = "https://www.feynmanlectures.caltech.edu/III_toc.html"
link_text = "Caltech (Vol. III contents)"
description = "Caltech's free online New Millennium Edition of the quantum-mechanics volume. Feynman starts from probability amplitudes and two-state systems rather than wave mechanics; Ch. 8–9 (the Hamiltonian matrix, the ammonia maser) and Ch. 11 (more two-state systems, including photon polarization) carry exercises 2 and 3."
verified = 2026-10-21

[[groups.items]]
id = "mit-8-04-quantum-physics-i"
title = "MIT 8.04 Quantum Physics I (Spring 2016)"
authors = "Barton Zwiebach"
year = "2016"
type = "course"
access = "free"
level = "intermediate"
marks = ["core"]
url = "https://ocw.mit.edu/courses/8-04-quantum-physics-i-spring-2016/"
link_text = "MIT OCW"
description = "Zwiebach's first undergraduate quantum course on MIT OpenCourseWare, with lecture videos, lecture notes, problem sets and exams: the experimental basis of quantum physics, wave mechanics, and the Schrödinger equation in one and three dimensions. Its lectures became his textbook *Mastering Quantum Mechanics* (MIT Press, 2022)."
verified = 2026-10-21

