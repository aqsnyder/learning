[[groups.items]]
id = "some-light-quantum-mechanics-3blue1brown"
title = "Some light quantum mechanics (with minutephysics)"
authors = "3Blue1Brown"
type = "video"
access = "free"
url = "https://www.youtube.com/watch?v=MzRCDLre1b4"
link_text = "YouTube"
description = "A 3Blue1Brown video made with minutephysics: polarized light introduces quantum states as vectors, measurement as projection onto a basis, and the puzzle of a third polarizer between two crossed ones, which is the setup of exercise 3. Also used in physics/07."
verified = 2026-10-13

[[groups.items]]
id = "principles-of-quantum-mechanics"
title = "Principles of Quantum Mechanics"
authors = "R. Shankar"
year = "1994"
type = "book"
url = "https://doi.org/10.1007/978-1-4757-0576-8"
link_text = "Springer"
description = "A graduate-level text that sets up the mathematics first (vector spaces and Dirac notation) and then the postulates. Turn to it when you want the formalism behind Griffiths done carefully, including the measurement postulate and the generalized uncertainty relation."
access = "paid"
level = "advanced"
verified = 2026-10-21

[[groups.items]]
id = "modern-quantum-mechanics"
title = "Modern Quantum Mechanics (3rd ed., 2020)"
authors = "J. J. Sakurai & Jim Napolitano"
year = "2020"
type = "book"
url = "https://doi.org/10.1017/9781108587280"
link_text = "Cambridge"
description = "The standard first-year graduate text, which builds the formalism from Stern–Gerlach experiments. Read its spin, angular-momentum and time-evolution chapters once Griffiths is done; exercises 2 and 3 borrow its two-state examples and its opening polarizer analogy."
access = "paid"
level = "advanced"
verified = 2026-10-21

