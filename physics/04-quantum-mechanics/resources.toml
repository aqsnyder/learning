[[groups.items]]
id = "quantum-mechanics-for-scientists-and"
title = "Quantum Mechanics for Scientists and Engineers"
authors = "David A. B. Miller"
year = "2008"
type = "book"
url = "https://doi.org/10.1017/CBO9780511813962"
link_text = "Cambridge"
description = "Written by a Stanford electrical-engineering professor for engineers and applied physicists. Use it beside or after Griffiths for the device-oriented topics (tunneling, electrons in crystals, optical absorption) that lead into semiconductors and photodetectors in Section 08."
access = "paid"
level = "intermediate"
verified = 2026-10-21
