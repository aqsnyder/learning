description = "MIT's first physics course on OpenCourseWare, with lecture videos and problem sets: space, time, mass, force, momentum, torque and angular momentum, built up toward planetary motion. Watch it beside Feynman for problem-solving technique; exercise 4 uses its oscillator material."
