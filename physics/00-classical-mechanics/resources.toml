title = "The Feynman Lectures on Physics, Volume I"
authors = "Feynman, Leighton & Sands"
year = "2013"
type = "book"
access = "free"
level = "beginner"
marks = ["core"]
url = "https://www.feynmanlectures.caltech.edu/I_toc.html"
link_text = "Caltech (Vol. I contents)"
description = "Caltech's free online New Millennium Edition of the first volume, \"mainly mechanics, radiation, and heat\". This section reads the mechanics chapters, Ch. 1–14 and 18–25; Ch. 21–25 (from the harmonic oscillator to linear systems) map directly onto circuits. Sections 01 and 02 use its optics, waves and thermodynamics chapters."
verified = 2026-10-21

[[groups.items]]
id = "classical-mechanics"
title = "Classical Mechanics"
authors = "John R. Taylor"
year = "2005"
type = "book"
marks = ["core"]
description = "The primary textbook for this section (University Science Books): Newtonian mechanics with air resistance, oscillations, the calculus of variations, Lagrangian and Hamiltonian mechanics, with graded problems. Exercises 1–5 cite its chapters."
access = "paid"
level = "intermediate"

