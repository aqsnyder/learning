id = "on-the-electrodynamics-of-moving-bodies"
title = "On the Electrodynamics of Moving Bodies"
authors = "Albert Einstein"
year = "1905"
type = "paper"
marks = ["core"]
url = "https://www.fourmilab.ch/etexts/einstein/specrel/specrel.pdf"
link_text = "English translation (Fourmilab PDF)"
description = "Einstein's 1905 special-relativity paper in English translation: it opens with the magnet-and-conductor asymmetry, defines simultaneity operationally with light signals (§1), derives the Lorentz transformation and transforms the fields. Exercise 2 is a close reading of it."
