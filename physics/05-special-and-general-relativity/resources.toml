title = "Observation of Gravitational Waves from a Binary Black Hole Merger"
authors = "B. P. Abbott et al. (LIGO Scientific & Virgo Collaborations)"
year = "2016"
type = "paper"
url = "https://doi.org/10.1103/PhysRevLett.116.061102"
link_text = "DOI"
description = "The open-access *Physical Review Letters* paper announcing GW150914, the first direct detection of gravitational waves. Read it as a precision-measurement case study: a strain of order 10⁻²¹ pulled out of interferometer noise and matched to general relativity's waveform."
