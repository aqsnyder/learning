name: check

# Structural checks on every push and pull request: links between files, section anatomy,
# tier lists, valid resource data, and generated files that are up to date.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the repo
        run: python tools/check_repo.py
