title = "BIP 325: Signet and BIP 94: Testnet 4"
authors = "Karl-Johan Alm, Anthony Towns; Fabian Jahr"
year = "2019, 2024"
type = "standard"
url = "https://github.com/bitcoin/bips/blob/master/bip-0325.mediawiki"
link_text = "BIP 325"
more_links = [{ text = "BIP 94", url = "https://github.com/bitcoin/bips/blob/master/bip-0094.mediawiki" }]
description = "Why the test networks behave differently. Signet blocks must also satisfy the network's signature \"challenge\" script, so the network is predictably rather than randomly unreliable. Testnet4 keeps proof-of-work with testnet's 20-minute minimum-difficulty exception plus a block-storm fix. Testnet3 is being phased out, and a Testnet 5 (BIP 95) is in draft."
verified = 2026-10-13

