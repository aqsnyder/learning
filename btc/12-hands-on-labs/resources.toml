description = "The lab manual for Labs 0, 1 and 5. Covers Bitcoin Core setup and `bitcoin-cli`, raw transactions, RBF/CPFP, multisig, PSBTs and hardware wallets, timelocks, Script with btcdeb, Tor/I2P, RPC from Python/Rust/Go, Core Lightning, and a regtest appendix. It was written for Bitcoin Core 22, and v30 removed legacy wallets and RPCs such as `dumpprivkey` and `importprivkey`, so expect to translate some steps. A 3.0 rewrite targets late 2026. (Moved here from Section 10.)"
