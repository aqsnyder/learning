description = "Block withholding and selfish mining: under minimal assumptions a miner with about 1/3 of the hashrate can earn more than its fair share, so the honest-majority \"51%\" framing is too optimistic. The Optech page links the original \"Majority is not Enough\" paper (Eyal & Sirer, 2013) and 2025–26 follow-ups"
verified = 2026-10-13

