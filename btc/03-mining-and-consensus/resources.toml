[[groups.items]]
id = "difficulty-adjustment-algorithm"
title = "Bitcoin Core source: src/pow.cpp (difficulty retargeting)"
authors = "Bitcoin Core contributors"
type = "docs"
label = "Source code"
access = "free"
url = "https://github.com/bitcoin/bitcoin/blob/v31.1/src/pow.cpp"
link_text = "pow.cpp (v31.1)"
description = "The consensus rule itself, in one short file: GetNextWorkRequired and CalculateNextWorkRequired measure the timespan from the first to the last block of the period (the 2015-interval off-by-one), clamp it to between a quarter and four times the target timespan, and cap the target at powLimit; a testnet4-only branch (BIP 94) bases the new target on the period's first block so the minimum-difficulty exception cannot drag it down. BIP 94's timewarp rule is a header check in validation.cpp (\"time-timewarp-attack\"). Exercise 2 must match this file bit for bit. Linked at the v31.1 tag (July 2026); unchanged on master as of October 2026."
verified = 2026-10-21

[[groups.items]]
id = "selfish-mining-and-mining-game-theory"
title = "Majority is not Enough: Bitcoin Mining is Vulnerable"
authors = "Ittay Eyal, Emin Gün Sirer"
year = "2013"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/1311.0243"
link_text = "arXiv:1311.0243"
more_links = [{ text = "Optech topic", url = "https://bitcoinops.org/en/topics/selfish-mining/" }]
description = "The selfish-mining paper: a pool that withholds blocks and publishes them strategically earns more than its share of the hashrate once that share exceeds (1−γ)/(3−2γ) — a third if it loses every tie, less if it wins some — so an honest majority is not enough. The proposed fix (random tie-breaking) raises the bar to 1/4. Exercise 5 reproduces the threshold; the Optech topic follows later work through 2026."
verified = 2026-10-21

