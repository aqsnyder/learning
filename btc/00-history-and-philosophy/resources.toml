[[groups]]
outro = '''**Also used here (tracked in its home section):** *The Bitcoin Standard* (Saifedean Ammous, 2018) ([Section 09](../09-economics-and-game-theory/README.md)) for objective 5 and exercise 5: read its chapters on early and metallic money as an Austrian-school advocacy argument whose historical claims you check, not as neutral history.'''

[[groups.items]]
id = "bitcoin-a-peer-to-peer-electronic-cash"
title = "Bitcoin: A Peer-to-Peer Electronic Cash System"
authors = "Satoshi Nakamoto"
year = "2008"
type = "paper"
access = "free"
marks = ["core", "canon"]
url = "https://bitcoin.org/bitcoin.pdf"
link_text = "bitcoin.pdf"
description = "The original design: a peer-to-peer timestamp server secured by proof-of-work, the most-work chain rule, simplified payment verification (§8) and the attacker-success calculation (§11). Read it first, and again at the end of this section. Also used in econ/10."
verified = 2026-10-21

