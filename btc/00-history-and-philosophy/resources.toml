[[groups.items]]
id = "digital-gold-bitcoin-and-the-inside"
title = "Digital Gold: Bitcoin and the Inside Story of the Misfits and Millionaires Trying to Reinvent Money"
authors = "Nathaniel Popper"
year = "2015"
type = "book"
access = "paid"
level = "beginner"
description = "A journalist's narrative history of Bitcoin's early years and the people around it; exercise 1 and the mini-project's timeline draw on it."

[[groups.items]]
id = "b-money"
title = "b-money"
authors = "Wei Dai"
year = "1998"
type = "paper"
access = "free"
marks = ["canon"]
url = "http://www.weidai.com/bmoney.txt"
link_text = "weidai.com"
more_links = [{ text = "SNI copy", url = "https://nakamotoinstitute.org/library/b-money/" }]
description = "Dai's November 1998 proposal for anonymous, distributed electronic cash, in two protocols: in the first every participant keeps a database of how much money belongs to each pseudonym; in the second a subset of participants (\"servers\") keeps the accounts and communicates over a broadcast channel. Reference [1] of the whitepaper. The Satoshi Nakamoto Institute (SNI) hosts a copy that links this original."

[[groups.items]]
id = "hashcash"
title = "Hashcash - A Denial of Service Counter-Measure"
authors = "Adam Back"
year = "2002"
type = "paper"
access = "free"
marks = ["canon"]
url = "http://www.hashcash.org/papers/hashcash.pdf"
link_text = "hashcash.org"
more_links = [{ text = "SNI copy", url = "https://nakamotoinstitute.org/library/hashcash/" }]
description = "Back's paper (dated August 1, 2002) on the hashcash proof-of-work cost function — minting a stamp by searching for a partial hash preimage — which Bitcoin's mining chains together and retargets. Reference [6] of the whitepaper; exercise 3 measures its cost-function properties."

[[groups.items]]
id = "bitcoin-a-peer-to-peer-electronic-cash-2"
title = "Bitcoin: A Peer-to-Peer Electronic Cash System (annotated/explained version)"
authors = "Satoshi Nakamoto (annotations: Fermat's Library)"
type = "website"
label = "Annotated paper"
access = "free"
marks = ["canon"]
url = "https://fermatslibrary.com/s/bitcoin"
link_text = "fermatslibrary.com"
description = "The whitepaper with Fermat's Library's margin annotations and readers' comments explaining each section; free to read (commenting needs a login). The page gives no date for the annotations. Use it alongside exercise 2."
verified = 2026-10-21

[[groups.items]]
id = "the-internet-of-money-vols-1-3"
title = "The Internet of Money (Volumes 1–3)"
authors = "Andreas M. Antonopoulos"
type = "book"
access = "paid"
level = "beginner"
url = "https://aantonop.com/books/iom/"
link_text = "aantonop.com"
description = "Antonopoulos's talks on why Bitcoin matters, edited into a series of essays in three volumes (print, ebook and audiobook). Accessible advocacy for the \"why\", not technical material. The author's pages give no publication years."
verified = 2026-10-21

[[groups.items]]
id = "satoshi-nakamoto-s-emails-and-forum"
title = "Satoshi Nakamoto's emails and forum posts"
authors = "Satoshi Nakamoto (compiled by the Satoshi Nakamoto Institute)"
year = "2008–2010"
type = "article"
label = "Email"
access = "free"
marks = ["canon"]
url = "https://satoshi.nakamotoinstitute.org/"
link_text = "satoshi.nakamotoinstitute.org"
description = "The Satoshi Nakamoto Institute's \"Complete Satoshi\": the emails (31 Oct 2008 – 13 Dec 2010, from the Cryptography Mailing List, bitcoin-list and the P2P Research List), forum posts, code and quotes — the primary record of how the design was explained and defended."
verified = 2026-10-21

[[groups.items]]
id = "the-sovereign-individual"
title = "The Sovereign Individual"
authors = "Davidson and Rees-Mogg"
year = "1997"
type = "book"
access = "paid"
level = "beginner"
description = "A 1997 forecast that information technology, digital money included, would erode the nation-state's power — speculative futurism and advocacy, not analysis; exercise 5 grades its predictions."

[[groups.items]]
id = "bitcoin-s-academic-pedigree"
title = "Bitcoin's Academic Pedigree"
authors = "Arvind Narayanan and Jeremy Clark"
year = "2017"
type = "paper"
access = "free"
marks = ["core"]
url = "https://queue.acm.org/detail.cfm?id=3136559"
link_text = "ACM Queue"
description = "Traces Bitcoin's components (e.g. linked timestamping, Merkle trees, Byzantine fault tolerance, proof-of-work) back to the 1980s–90s research they came from, arguing that Satoshi's contribution was the combination. The best bridge from this section to the technical ones"
verified = 2026-10-13

[[groups.items]]
id = "bit-gold"
title = "Bit Gold"
authors = "Nick Szabo"
year = "2005"
type = "paper"
access = "free"
url = "https://nakamotoinstitute.org/library/bit-gold/"
link_text = "nakamotoinstitute.org"
description = "Timestamped proof-of-work strings recorded in a distributed title registry — the closest pre-Bitcoin design for unforgeable digital scarcity (SNI dates it December 29, 2005)"
verified = 2026-10-13
