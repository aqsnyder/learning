[[groups.items]]
id = "mastering-the-lightning-network"
title = "Mastering the Lightning Network"
authors = "Andreas M. Antonopoulos, Olaoluwa Osuntokun, Rene Pickhardt"
year = "2021"
type = "book"
access = "free"
level = "intermediate"
marks = ["core"]
url = "https://github.com/lnbook/lnbook"
link_text = "GitHub"
description = "O'Reilly, first edition (21 December 2021), free on GitHub under CC BY-SA 4.0. Goes from node software (ch. 4: c-lightning, now Core Lightning, plus LND and Eclair, wired into one docker-compose network) through payment channels (ch. 7), HTLC routing and forwarding (chs. 8–9), onion routing, pathfinding under liquidity uncertainty (ch. 12) and payment requests (ch. 15). It predates BOLT 12 offers, splicing and simple taproot channels: see the BOLT and Optech rows."
verified = 2026-10-21

[[groups.items]]
id = "payment-channels"
title = "BOLT #2: Peer Protocol for Channel Management, and BOLT #3: Bitcoin Transaction and Script Formats"
short = "BOLT #2 and BOLT #3 — channel messages and transactions"
authors = "Lightning protocol contributors"
year = "2016–2026"
type = "standard"
access = "free"
url = "https://github.com/lightning/bolts/blob/master/03-transactions.md"
link_text = "BOLT #3"
more_links = [{ text = "BOLT #2", url = "https://github.com/lightning/bolts/blob/master/02-peer-protocol.md" }]
description = "A channel's lifecycle as implementations must build it. BOLT #2 has the messages: opening (`open_channel` … `channel_ready`), normal operation (`update_add_htlc`, `commitment_signed`, `revoke_and_ack`, with a section on choosing `cltv_expiry_delta`), splicing and closing. BOLT #3 has the exact transactions: the funding output, the commitment outputs (`to_local` with its revocation and delayed paths, `to_remote`, anchors), the offered and received HTLC scripts, key derivation and test vectors. Practices 2 and 5 decode against it."
verified = 2026-10-21

[[groups.items]]
id = "htlcs-hash-time-locked-contracts"
title = "Bitcoin Optech: Hash Time Locked Contract (HTLC) and CLTV expiry delta"
authors = "Bitcoin Optech"
type = "website"
access = "free"
url = "https://bitcoinops.org/en/topics/htlc/"
link_text = "HTLC"
more_links = [{ text = "CLTV expiry delta", url = "https://bitcoinops.org/en/topics/cltv-expiry-delta/" }]
description = "Two short topic pages, each with its primary sources and dated newsletter mentions. The HTLC page explains the hash-lock payment clause and the time-lock refund clause, and why each also needs a signature. The CLTV-expiry-delta page shows why every forwarding node sets its outgoing HTLC to expire a fixed number of blocks before its incoming one, and who loses money if that margin is too small: the arithmetic of Practice 2."
verified = 2026-10-21

[[groups.items]]
id = "channel-capacity-liquidity-and-routing"
title = "Optimally Reliable & Cheap Payment Flows on the Lightning Network"
authors = "Rene Pickhardt, Stefan Richter"
year = "2021"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/2107.05322"
link_text = "arXiv:2107.05322"
description = "Channel balances are unknown to the sender, so a payment may not fit. This paper makes the probability that it does part of route selection, uses min-cost flows to split multipart payments, and updates its estimates after each failed attempt. Mastering the Lightning Network ch. 12 cites it; read it with that chapter before the mini-project."
verified = 2026-10-21

[[groups.items]]
id = "learn-me-a-bitcoin-on-chain"
title = "Learn Me A Bitcoin: Script, Locktime and Sequence (on-chain prerequisites)"
authors = "Greg Walker"
type = "website"
access = "free"
url = "https://learnmeabitcoin.com/technical/script/"
link_text = "Script"
more_links = [{ text = "Locktime", url = "https://learnmeabitcoin.com/technical/transaction/locktime/" }, { text = "Sequence", url = "https://learnmeabitcoin.com/technical/transaction/input/sequence/" }]
description = "The site has no Lightning section (checked October 2026). These three pages cover what HTLC and commitment scripts are built from: Script itself, absolute locktime, and the sequence field's relative locktime (BIP 68). Use them to fill gaps while reading Mastering Bitcoin Ch. 14."
verified = 2026-10-21

[[groups.items]]
id = "bitcoin-optech-topics-offers-bolt-12-and"
title = "Bitcoin Optech topics: Offers (BOLT 12) and Splicing"
authors = "Bitcoin Optech"
type = "website"
access = "free"
url = "https://bitcoinops.org/en/topics/offers/"
link_text = "Offers"
more_links = [{ text = "Splicing", url = "https://bitcoinops.org/en/topics/splicing/" }]
description = "What changed after the book, with every newsletter mention. Offers (reusable payment requests): merged into the spec as BOLT 12 (Optech, October 2024), on by default in Core Lightning since November 2024, implemented in LDK and Eclair; LND was still adding BOLT 12 encoding and signing in September 2026. Splicing (resizing a channel without closing it): merged into BOLT 2 in March 2026 (BOLTs #1160, reported in Optech Newsletter #398) and implemented in Eclair, Core Lightning and LDK. Status as of October 2026."
verified = 2026-10-21

[[groups.items]]
id = "bolt-specifications-basis-of-lightning"
title = "BOLT specifications (Basis of Lightning Technology)"
authors = "Lightning protocol contributors"
year = "2016–2026"
type = "standard"
access = "free"
url = "https://github.com/lightning/bolts"
link_text = "GitHub"
description = "The interoperability specification, CC BY 4.0; BOLT #0 is the index. As of October 2026 it includes BOLT #12 offers (in the repository since September 2024), splicing in BOLT #2 (merged March 2026) and simple taproot channels as an extension BOLT (merged May 2026). BOLT #11 is the invoice format Practice 3 decodes."
verified = 2026-10-21

