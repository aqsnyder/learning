verified = 2026-10-13

[[groups.items]]
id = "andreas-antonopoulos-on-bitcoin-privacy"
title = "Bitcoin Q&A: How is Fungibility Tied to Privacy?"
authors = "Andreas M. Antonopoulos"
year = "2017"
type = "video"
access = "free"
url = "https://www.youtube.com/watch?v=VuI-8EwqIS8"
