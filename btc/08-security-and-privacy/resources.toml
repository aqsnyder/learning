[[groups.items]]
id = "bitcoin-wiki-privacy"
title = "Bitcoin Wiki: Privacy"
authors = "Bitcoin Wiki contributors"
year = "2019"
type = "website"
label = "Web Resource"
url = "https://en.bitcoin.it/wiki/Privacy"
link_text = "en.bitcoin.it"
description = "A long reference article on how Bitcoin privacy is attacked and defended. Blockchain attacks: the common-input-ownership heuristic, change-address detection, transaction-graph analysis, amount and timing correlation. Non-blockchain attacks: traffic analysis, custodial wallets, wallet-history lookups on third-party servers, eavesdropping. Defenses: avoiding address reuse, coin control, CoinJoin, PayJoin and Lightning, with case studies. Written in 2019 as a community wiki page, so check its tool and service recommendations against the 2024 CoinJoin changes noted in the CoinJoin and PayJoin row"
verified = 2026-10-13
