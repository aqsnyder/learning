[[groups.items]]
id = "the-economic-limits-of-bitcoin-and-the"
title = "The Economic Limits of Bitcoin and the Blockchain (revised as \"Trust at Scale: The Economic Limits of Cryptocurrencies and Blockchains\")"
authors = "Eric Budish"
year = "2018; 2022"
type = "paper"
access = "free"
marks = ["core"]
url = "https://www.nber.org/papers/w24717"
link_text = "NBER WP 24717"
more_links = [{ text = "*QJE* 140(1)", url = "https://doi.org/10.1093/qje/qjae033" }]
description = "The security budget as an economic constraint. Two equilibrium conditions — miners compete away their profits, and a majority attack must not pay — together imply that the recurring (\"flow\") payment to miners must be large relative to the one-off (\"stock\") benefit of attacking the chain: security is bought with what miners are paid per block, not with bitcoin's market value. The 2022 revision was published in the *Quarterly Journal of Economics* (online October 2024). The argument is contested — e.g. whether hashrate can be rented at scale, and what a successful attack does to the price and to the attacker's specialized hardware — so list where you would push back. Derive the core inequality in [econ/10's exercise 3](../../econ/10-monetary-economics-and-crypto/README.md)"
verified = 2026-10-13

[[groups.items]]
id = "on-the-instability-of-bitcoin-without"
title = "On the Instability of Bitcoin Without the Block Reward"
authors = "Miles Carlsten, Harry Kalodner, S. Matthew Weinberg, Arvind Narayanan"
year = "2016"
type = "paper"
access = "free"
marks = ["core"]
url = "https://doi.org/10.1145/2976749.2978408"
link_text = "ACM CCS 2016"
more_links = [{ text = "PDF", url = "https://www.cs.princeton.edu/~arvindn/publications/mining_CCS.pdf" }]
description = "What a fee-only future could look like. With no subsidy, a block is worth only the fees waiting in the mempool, so (1) forking a fee-rich block and leaving part of its fees unclaimed to lure other miners onto your branch can pay (\"undercutting\"); (2) miners may idle right after a block, while few fees are waiting (the \"mining gap\"); and (3) selfish mining becomes more attractive, even for miners with little hashrate. Theory plus a mining simulator. Read it after the Optech fee-sniping page; Practice 4 builds a simple version of the undercutting incentive"
verified = 2026-10-13

[[groups.items]]
id = "game-theory-of-mining"
title = "The Economics of Bitcoin Mining, or Bitcoin in the Presence of Adversaries"
authors = "Joshua A. Kroll, Ian C. Davey, Edward W. Felten"
year = "2013"
type = "paper"
access = "free"
url = "https://econinfosec.org/archive/weis2013/papers/KrollDaveyFeltenWEIS2013.pdf"
link_text = "WEIS 2013 (PDF)"
description = "Mining as a game (Workshop on the Economics of Information Security, June 2013). Following the reference implementation is a Nash equilibrium, but so are infinitely many other behaviors; a majority cartel could censor transactions and change the rules; and a \"Goldfinger\" attacker who profits from Bitcoin's destruction is deterred only while mining rewards exceed the attacker's payoff. Written just after the subsidy fell to 25 BTC, it already asks what happens as rewards decline: read it before Budish."
verified = 2026-10-21

[[groups.items]]
id = "bitcoin-optech-fee-sniping"
title = "Bitcoin Optech: Fee sniping"
authors = "Bitcoin Optech"
type = "website"
access = "free"
url = "https://bitcoinops.org/en/topics/fee-sniping/"
link_text = "bitcoinops.org"
description = "What the shrinking subsidy does to miners' incentives: once fees dominate, re-mining a lucrative previous block can beat extending the chain, one large miner's defection can cascade to smaller ones, and only a cartel that never reorgs its members would restore stability, at the cost of later censorship risk. Covers the mitigations (anti-fee-sniping nLockTime, the block weight limit); the newsletter mentions run from 2018 to 2022 and include the 2022 discussion of fee sniping and the block subsidy."
verified = 2026-10-21

[[groups.items]]
id = "statement-on-the-approval-of-spot"
title = "Statement on the Approval of Spot Bitcoin Exchange-Traded Products"
authors = "Gary Gensler (SEC Chair)"
year = "2024"
type = "article"
access = "free"
url = "https://www.sec.gov/newsroom/speeches-statements/gensler-statement-spot-bitcoin-011023"
link_text = "sec.gov"
description = "Primary source for the January 2024 approval of US spot-bitcoin ETPs — a major step toward custodial, exchange-traded ownership of bitcoin. Read for market structure (who holds the coins and through whom), including the SEC chair's own risk caveats; not an endorsement"
verified = 2026-10-13

[[groups.items]]
id = "gresham-s-law-and-thiers-law"
title = "Gresham's Law or Gresham's Fallacy?"
authors = "Arthur J. Rolnick, Warren E. Weber"
year = "1986"
type = "paper"
access = "paid"
url = "https://doi.org/10.1086/261368"
link_text = "*JPE* 94(1) (DOI)"
more_links = [{ text = "1983 staff report (DOI)", url = "https://doi.org/10.21034/sr.88" }]
description = "The classic challenge to \"bad money drives out good\" (*Journal of Political Economy* 94(1): 185–199). The authors argue that history contradicts both the simple form and the form that hinges on a legally fixed exchange rate, and propose instead that a fixed cost of using money at non-par prices, together with denomination, decides which money survives. Use it to test the institutional condition in Practice 3. The journal article is paywalled; an earlier version was a 1983 Federal Reserve Bank of Minneapolis staff report."
verified = 2026-10-21

[[groups.items]]
id = "network-effects-and-metcalfe-s-law"
title = "Are Bitcoin Bubbles Predictable? Combining a Generalized Metcalfe's Law and the LPPLS Model"
authors = "Spencer Wheatley, Didier Sornette, Tobias Huber, Max Reppen, Robert N. Gantner"
year = "2018"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/1803.05663"
link_text = "arXiv:1803.05663"
more_links = [{ text = "Critique: \"Metcalfe's Law is Wrong\" (IEEE Spectrum, 2006)", url = "https://spectrum.ieee.org/metcalfes-law-is-wrong" }]
description = "An academic attempt to give bitcoin a network-based \"fundamental value\" with a generalized Metcalfe's law and use it to diagnose bubbles: prices exceeded that value heavily at least four times (March 2018). Pair it with Briscoe, Odlyzko and Tilly's 2006 argument that a network's value grows like n log n rather than n², because most possible connections are little used. Both are models to test, as the mini-project does, not facts."
verified = 2026-10-21

[[groups.items]]
id = "the-bitcoin-standard"
title = "The Bitcoin Standard: The Decentralized Alternative to Central Banking"
authors = "Saifedean Ammous"
year = "2018"
type = "book"
access = "paid"
level = "beginner"
url = "https://newsroom.wiley.com/press-releases/press-release-details/2018/The-Bitcoin-Standard-The-Decentralized-Alternative-to-Central-Banking/default.aspx"
link_text = "Wiley (2018)"
description = "Advocacy to test, not analysis: an Austrian-school history of money that argues for bitcoin as \"sound money\" (Wiley, 2018; hardcover and ebook). Read it for the Claims Ledger: log its checkable claims with page numbers, and weigh them against the incentive economics above and the academic treatments in econ/10 and the Princeton textbook (Section 03). Also used in econ/10."
verified = 2026-10-21

[[groups.items]]
id = "the-bullish-case-for-bitcoin"
title = "The Bullish Case for Bitcoin"
authors = "Vijay Boyapati"
year = "2018"
type = "article"
access = "free"
url = "https://vijayboyapati.medium.com/the-bullish-case-for-bitcoin-6ecc8bdecc1"
link_text = "Medium"
description = "An investment thesis (March 2018, later expanded into a 2021 book): bitcoin's monetization as a store of value, from the attributes of good money to \"common misconceptions\" and \"real risks\". Advocacy: read it as an argument to test, separating its empirical claims from its predictions."
verified = 2026-10-21

[[groups.items]]
id = "stock-to-flow-model"
title = "Modeling Bitcoin Value with Scarcity"
authors = "PlanB"
year = "2019"
type = "article"
access = "free"
url = "https://medium.com/@100trillionUSD/modeling-bitcoins-value-with-scarcity-91fa0fc03e25"
link_text = "Medium"
description = "The stock-to-flow price model, a speculative price model rather than analysis: a regression of ln(market value) on ln(stock-to-flow) over 111 monthly observations (December 2009 to February 2019), reported with R² of about 95% and a prediction of roughly $55,000 per bitcoin after the May 2020 halving. Widely publicized and methodologically criticized, because it treats supply as the only driver of price; Practice 5 reproduces it and tests it out of sample. The supply schedule itself: Section 03 (Block Reward)."
verified = 2026-10-21

[[groups.items]]
id = "the-fiat-standard"
title = "The Fiat Standard: The Debt Slavery Alternative to Human Civilization"
authors = "Saifedean Ammous"
year = "2021"
type = "book"
access = "paid"
level = "beginner"
url = "https://saifedean.com/"
link_text = "saifedean.com"
description = "Ammous's critique of the fiat monetary system (2021), the companion to *The Bitcoin Standard* and equally advocacy. The author's site lists it with his other books and links to the shop that sells them. Check its historical claims against econ/10 and log them in the Claims Ledger."
verified = 2026-10-21
