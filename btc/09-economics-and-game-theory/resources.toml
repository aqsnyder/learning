id = "bitcoin-optech-fee-sniping"
title = "Bitcoin Optech: Fee sniping"
authors = "Bitcoin Optech"
type = "article"
url = "https://bitcoinops.org/en/topics/fee-sniping/"
link_text = "bitcoinops.org"
description = "The long-run \"security budget\" problem in game-theory terms: once fees dominate the shrinking subsidy, re-mining a lucrative previous block can beat honest mining, and defections can cascade toward a reorg-avoiding mining cartel. Covers mitigations (block weight limit, anti-fee-sniping locktimes) and links the 2022 subsidy debate"
verified = 2026-10-13

