[[groups]]

[[groups.items]]
id = "mastering-bitcoin-chapter-4-keys-and"
title = "Mastering Bitcoin, Chapter 4: Keys and Addresses"
authors = "Andreas M. Antonopoulos and David A. Harding"
year = "2023"
type = "book"
access = "free"
level = "intermediate"
marks = ["core"]
url = "https://github.com/bitcoinbook/bitcoinbook/blob/develop/ch04_keys.adoc"
link_text = "ch04_keys.adoc"
description = "Public key cryptography on secp256k1 and how keys become addresses: P2PK, P2PKH and Base58Check, compressed keys, P2SH (with a sidebar on P2SH collision attacks and 160-bit vs 256-bit hashes), and bech32/bech32m. 3rd edition (O'Reilly, December 2023); free on GitHub under CC BY-SA 4.0."
verified = 2026-10-21

[[groups.items]]
id = "learn-me-a-bitcoin-keys-and-addresses"
title = "Learn Me A Bitcoin: Keys"
authors = "Greg Walker"
type = "website"
access = "free"
url = "https://learnmeabitcoin.com/technical/keys/"
link_text = "learnmeabitcoin.com"
description = "Diagram-led walk-through from a private key (a random 256-bit number) to a compressed public key, HASH160, and a Base58Check (P2PKH) or bech32 (P2WPKH) address — and why addresses never appear on the blockchain itself."
verified = 2026-10-21

[[groups.items]]
