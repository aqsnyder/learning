verified = 2026-10-13

[[groups.items]]
id = "bip-173-bech32-addresses"
title = "BIP 173: Base32 address format for native v0-16 witness outputs (with BIP 350: Bech32m)"
authors = "Pieter Wuille, Greg Maxwell; Pieter Wuille (BIP 350)"
year = "2017; 2020"
type = "standard"
access = "free"
url = "https://github.com/bitcoin/bips/blob/master/bip-0173.mediawiki"
link_text = "BIP 173"
more_links = [{ text = "BIP 350", url = "https://github.com/bitcoin/bips/blob/master/bip-0350.mediawiki" }]
description = "The bech32 address spec: human-readable part, witness version and program, and a BCH checksum that guarantees detection of any error affecting at most 4 characters; its examples include the P2WPKH address exercise 3 must reproduce. BIP 350 explains bech32's insertion weakness (a final \"p\" tolerates added or removed \"q\"s) and the bech32m checksum used for Taproot (v1+) addresses."
verified = 2026-10-21
