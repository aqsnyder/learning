[[groups.items]]
id = "sha-256-hashing"
title = "FIPS 180-4: Secure Hash Standard (SHS)"
authors = "National Institute of Standards and Technology (NIST)"
year = "2015"
type = "standard"
access = "free"
url = "https://nvlpubs.nist.gov/nistpubs/fips/nist.fips.180-4.pdf"
link_text = "NIST PDF"
description = "The SHA-256 specification (August 2015): padding and parsing (§5.1.1), the 64-word message schedule and 64-round compression function (§6.2). Exercise 1 implements SHA-256 from it and checks the result against hashlib."
verified = 2026-10-21

[[groups.items]]
id = "elliptic-curve-cryptography-secp256k1"
title = "libsecp256k1"
authors = "Pieter Wuille and contributors"
year = "2013–2026"
type = "tool"
label = "Library"
access = "free"
url = "https://github.com/bitcoin-core/secp256k1"
link_text = "GitHub"
description = "The secp256k1 library Bitcoin Core uses: field arithmetic modulo 2^256 − 0x1000003D1 on the curve y² = x³ + 7, constant-time and constant-memory-access signing and key generation, RFC 6979 nonces, and modules for BIP 340 Schnorr and BIP 327 MuSig2 (v0.8.0, August 2026). Read its implementation notes after exercise 2's timing experiment; the mini-project compiles it for a microcontroller."
verified = 2026-10-21

[[groups.items]]
id = "digital-signatures-ecdsa-and-schnorr"
title = "BIP 340: Schnorr Signatures for secp256k1"
authors = "Pieter Wuille, Jonas Nick, Tim Ruffing"
year = "2020"
type = "standard"
access = "free"
url = "https://github.com/bitcoin/bips/blob/master/bip-0340.mediawiki"
link_text = "BIP 340"
more_links = [{ text = "test vectors", url = "https://github.com/bitcoin/bips/blob/master/bip-0340/test-vectors.csv" }, { text = "BIP 327 (MuSig2)", url = "https://github.com/bitcoin/bips/blob/master/bip-0327.mediawiki" }]
description = "Bitcoin's Schnorr signature scheme (Deployed with Taproot): tagged hashes, x-only public keys with an even Y coordinate, and a motivation section comparing Schnorr with ECDSA on provable security, non-malleability, linearity and batch verification. Exercise 5 implements it against the official test vectors; BIP 327 (MuSig2; Jonas Nick, Tim Ruffing, Elliott Jin, 2022) gives the key-aggregation coefficients that stop the rogue-key attack. Section 11 reads both again as Taproot specs."
verified = 2026-10-21

[[groups.items]]
id = "programming-bitcoin-chapters-1-3"
title = "Programming Bitcoin, Chapters 1–3: Finite Fields; Elliptic Curves; Elliptic Curve Cryptography"
