[[groups.items]]
id = "node-types"
title = "Bitcoin Core source: connection types (src/node/connection_types.h)"
authors = "Bitcoin Core contributors"
type = "docs"
label = "Source code"
access = "free"
url = "https://github.com/bitcoin/bitcoin/blob/v31.1/src/node/connection_types.h"
link_text = "connection_types.h (v31.1)"
description = "The documented list of every connection Bitcoin Core makes, and why: inbound, outbound full-relay, manual, feeler (test-before-evict and moving addresses from the new to the tried table), block-relay-only (against partition attacks, opened first from anchors.dat), address-fetch, and private-broadcast connections over Tor or I2P for your own transactions (new in 31.0, April 2026). The vocabulary for exercise 1's census and exercise 5's mitigations; node types (full, pruned, lightweight) are in Mastering Bitcoin ch. 10."
verified = 2026-10-21

[[groups.items]]
id = "transaction-and-block-propagation"
title = "BIP 152: Compact Block Relay (with BIPs 339 and 330)"
authors = "Matt Corallo; Suhas Daftuar (339); Gleb Naumenko, Pieter Wuille (330)"
year = "2016"
type = "standard"
access = "free"
url = "https://github.com/bitcoin/bips/blob/master/bip-0152.mediawiki"
link_text = "BIP 152"
more_links = [{ text = "BIP 339 (wtxid relay)", url = "https://github.com/bitcoin/bips/blob/master/bip-0339.mediawiki" }, { text = "BIP 330 (Erlay)", url = "https://github.com/bitcoin/bips/blob/master/bip-0330.mediawiki" }]
description = "How blocks travel fast: a compact block carries the header, short transaction IDs and a few prefilled transactions, and the receiver fetches what its mempool lacks with getblocktxn, in high- or low-bandwidth mode. BIP 339 (Deployed) announces transactions by wtxid; BIP 330's Erlay set reconciliation would cut announcement bandwidth but is still Draft and not deployed (BIPs repository, checked October 2026). Exercise 2 and the mini-project use all three."
verified = 2026-10-21

[[groups.items]]
id = "mempool-policies-and-fee-estimation"
title = "Bitcoin Core: Transaction Relay Policy docs (doc/policy, v31.1)"
authors = "Bitcoin Core contributors"
type = "docs"
access = "free"
url = "https://github.com/bitcoin/bitcoin/blob/v31.1/doc/policy/README.md"
link_text = "doc/policy (v31.1)"
more_links = [{ text = "Mempool design and limits", url = "https://github.com/bitcoin/bitcoin/blob/v31.1/doc/policy/mempool-design.md" }, { text = "Replacements", url = "https://github.com/bitcoin/bitcoin/blob/v31.1/doc/policy/mempool-replacements.md" }, { text = "Packages", url = "https://github.com/bitcoin/bitcoin/blob/v31.1/doc/policy/packages.md" }]
description = "Policy is a node's own, configurable rules for unconfirmed transactions, on top of consensus and never applied to blocks. These pages cover the cluster-mempool design and limits, the current replace-by-fee rules (signaling no longer required: full-RBF has been the default since 28.0, October 2024) and package acceptance (child-with-parents packages, TRUC). Exercise 4 maps every rejection message to them."
verified = 2026-10-21

