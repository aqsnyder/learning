# Resources for: Network and P2P Layer
# Edit this file, then run `python tools/build.py` to regenerate README.md, PROGRESS.md and the indexes.
# Field reference: tools/README.md

[[groups]]
outro = '''**Also used here (tracked in its home section):** Mempool.space ([Section 03](../03-mining-and-consensus/README.md)) for watching the live mempool, fee-rate bands and recent replacements; Learning Bitcoin from the Command Line and Lab 0 ([Section 12](../12-hands-on-labs/README.md)) and *Mastering Bitcoin* Ch. 3 ([Section 10](../10-development-and-programming/README.md)) for running your own node — start on regtest or signet; nothing teaches the network like participating in it.

**Status as of October 2026:** the latest Bitcoin Core release is 31.1 (8 July 2026); cluster mempool shipped in 31.0 (19 April 2026); Erlay (BIP 330) is still Draft and not deployed.'''

