[[groups.items]]
id = "bip-324-version-2-p2p-encrypted"
title = "BIP 324: Version 2 P2P Encrypted Transport Protocol"
authors = "Dhruv Mehta, Tim Ruffing, Jonas Schnelli, Pieter Wuille"
year = "2019"
type = "standard"
access = "free"
url = "https://github.com/bitcoin/bips/blob/master/bip-0324.mediawiki"
link_text = "BIP 324"
description = "Opportunistic, unauthenticated encryption of node-to-node traffic, with a pseudorandom bytestream, against passive eavesdropping and pattern-matching firewalls. Enabled by default since Bitcoin Core 27.0 (April 2024); Deployed in the BIPs repository (checked October 2026)."
verified = 2026-10-21

[[groups.items]]
id = "bitcoin-optech-cluster-mempool"
title = "Bitcoin Optech: Cluster mempool"
authors = "Bitcoin Optech"
type = "website"
access = "free"
url = "https://bitcoinops.org/en/topics/cluster-mempool/"
link_text = "Topic"
more_links = [{ text = "31.0 release notes", url = "https://github.com/bitcoin/bitcoin/blob/master/doc/release-notes/release-notes-31.0.md" }]
description = "Optech's topic page on the mempool redesign — related transactions grouped into clusters split into feerate-sorted chunks, so eviction and block building agree — with every newsletter mention (the latest in August 2026). It shipped in Bitcoin Core 31.0 (19 April 2026): clusters of at most 64 transactions and 101 kvB, no ancestor/descendant limits, the CPFP carve-out removed, and replacements accepted only if they improve the mempool's feerate diagram. The topic's summary still calls it a proposal (October 2026); the release notes are authoritative."
verified = 2026-10-21

[[groups.items]]
id = "bitcoin-core-development-and-transaction"
title = "Bitcoin Core development and transaction relay policy"
authors = "Bitcoin Core contributors (31 signers)"
year = "2025"
type = "article"
access = "free"
url = "https://bitcoincore.org/en/2025/06/06/relay-statement/"
link_text = "bitcoincore.org"
description = "The 2025 OP_RETURN debate from Core's side (6 June 2025): relay policy should predict what miners will mine rather than filter in-demand transactions — the rationale for Bitcoin Core 30.0's change (October 2025: default `-datacarriersize` 100,000; multiple OP_RETURN outputs). Read [Optech Newsletter #352](https://bitcoinops.org/en/newsletters/2025/05/02/) for the arguments on both sides; the consensus-level counter-proposal, [BIP 110](https://github.com/bitcoin/bips/blob/master/bip-0110.mediawiki) \"Reduced Data Temporary Softfork\" (Dec 2025), is marked Closed in the BIPs repository (checked October 2026)"
verified = 2026-10-13
