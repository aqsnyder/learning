verified = 2026-10-13

[[groups.items]]
id = "bitcoin-core-development-and-transaction"
title = "Bitcoin Core development and transaction relay policy"
authors = "Bitcoin Core contributors (31 signers)"
type = "article"
access = "free"
url = "https://bitcoincore.org/en/2025/06/06/relay-statement/"
link_text = "bitcoincore.org"
description = "The 2025 OP_RETURN debate from Core's side: relay policy should predict what miners will mine rather than filter in-demand transactions — the rationale for v30's change (default `-datacarriersize` 100,000; multiple OP_RETURN outputs). Read [Optech Newsletter #352](https://bitcoinops.org/en/newsletters/2025/05/02/) for the arguments on both sides; the consensus-level counter-proposal, [BIP 110](https://github.com/bitcoin/bips/blob/master/bip-0110.mediawiki) \"Reduced Data Temporary Softfork\" (Dec 2025), is marked Closed in the BIPs repository (checked October 2026)"
verified = 2026-10-13
