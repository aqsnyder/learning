[[groups.items]]
id = "cryptocurrency-engineering-and-design"
title = "Cryptocurrency Engineering and Design (MIT MAS.S62, Spring 2018)"
authors = "Neha Narula, Tadge Dryja"
year = "2018"
type = "course"
url = "https://ocw.mit.edu/courses/mas-s62-cryptocurrency-engineering-and-design-spring-2018/"
link_text = "MIT OCW"
description = "University course on how Bitcoin is engineered: lecture videos, notes and three problem sets (\"Hash-based Signature Schemes\", \"Mine Your Name\", \"UTXOhunt\"). The lectures run from signatures, proof of work and the UTXO model through sync and pruning, SPV and wallets, forks, fees, SegWit, Lightning, discreet log contracts, MAST/Taproot/Graftroot, CoinJoin and confidential transactions; four lectures (9, 19–21) have no video. Recorded in 2018, before Taproot activated: watch it for the design reasoning, and check current behavior against Mastering Bitcoin and the BIPs"
verified = 2026-10-13
