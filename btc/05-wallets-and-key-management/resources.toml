[[groups.items]]
id = "output-script-descriptors-bips-380387"
title = "Output Script Descriptors (BIPs 380–387)"
authors = "Pieter Wuille, Ava Chow"
year = "2021"
type = "standard"
access = "free"
marks = ["core"]
url = "https://github.com/bitcoin/bips/blob/master/bip-0380.mediawiki"
link_text = "BIP 380"
description = "The language modern wallets use to state exactly which scripts they own, e.g. `wpkh([fingerprint/84h/0h/0h]xpub…/0/*)`; BIP 380 covers general operation and BIPs 381–387 the script types (all Deployed). Bitcoin Core wallets are descriptor-only since v30.0 (October 2025) removed legacy wallets; practical guide: [Bitcoin Core descriptors doc](https://github.com/bitcoin/bitcoin/blob/master/doc/descriptors.md)"
verified = 2026-10-21

