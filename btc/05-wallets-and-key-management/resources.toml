description = "Independent vs deterministic key generation, HD derivation (BIP 32) and public child derivation, seeds and recovery codes (BIP 39) with passphrases, what else a backup must hold (nonkey data, derivation paths, output script descriptors), and an extended public key used on a web store (watch-only). 3rd edition (O'Reilly, December 2023)."
