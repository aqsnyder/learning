type = "standard"
access = "free"
url = "https://github.com/bitcoin/bips/blob/master/bip-0039.mediawiki"
link_text = "BIP 39"
description = "Entropy plus checksum → 11-bit indices → words, and mnemonic plus optional passphrase → seed with PBKDF2 (HMAC-SHA512, 2,048 iterations, salt \"mnemonic\" + passphrase). Exercises 1–2 implement and stress it."
verified = 2026-10-21

