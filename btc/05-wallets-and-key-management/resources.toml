[[groups]]
outro = '''**Also used here (tracked in its home section):** *Mastering Bitcoin* Ch. 10 ([Section 06](../06-network-and-p2p/README.md)) for full nodes vs lightweight clients, and *Mastering Bitcoin* Ch. 13 ([Section 08](../08-security-and-privacy/README.md)) for hardware signing devices, multisig, physical backups and survivability (inheritance). With Ch. 5's xpub-on-a-web-store example they cover objective 4's wallet comparison and objective 5's backup design.'''

[[groups.items]]
