description = "Ch. 6 takes a serialized transaction apart field by field (version, marker and flag, inputs, outputs, witness, lock time, coinbase, weight and vbytes, legacy serialization); ch. 7 covers Script, scripted multisignatures, P2SH, OP_RETURN, flow control, the \"Complex Script Example\" this section's mini-project builds, and Taproot and Tapscript. 3rd edition (O'Reilly, December 2023)."
