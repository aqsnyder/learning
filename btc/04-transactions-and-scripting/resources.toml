[[groups.items]]
id = "bitcoin-script"
title = "Learn Me A Bitcoin: Bitcoin Script"
authors = "Greg Walker"
type = "website"
access = "free"
url = "https://learnmeabitcoin.com/technical/script/"
link_text = "learnmeabitcoin.com"
description = "How Script runs: data is pushed onto a stack, opcodes pop and push, and an output can be spent only if a single non-zero value remains; locking scripts (ScriptPubKey) vs unlocking scripts (ScriptSig or witness), the standard script types, and a link to the full opcode list. Keep it open while you build exercise 3's interpreter."
verified = 2026-10-21

[[groups.items]]
id = "segwit-bip-141"
title = "BIP 141: Segregated Witness (Consensus layer)"
authors = "Eric Lombrozo, Johnson Lau, Pieter Wuille"
year = "2015"
type = "standard"
access = "free"
url = "https://github.com/bitcoin/bips/blob/master/bip-0141.mediawiki"
link_text = "BIP 141"
more_links = [{ text = "BIP 143", url = "https://github.com/bitcoin/bips/blob/master/bip-0143.mediawiki" }, { text = "BIP 147", url = "https://github.com/bitcoin/bips/blob/master/bip-0147.mediawiki" }]
description = "SegWit's consensus rules: the witness structure, the wtxid commitment in the coinbase, block weight (base size × 3 + total size ≤ 4,000,000) and why taking signatures out of the txid ends unintentional malleability. BIP 143 (Johnson Lau, Pieter Wuille, 2016) defines the version 0 signature hash — linear-time hashing that also commits to the amount being spent — with worked examples exercise 4 checks against; BIP 147 (Johnson Lau, 2016) is the NULLDUMMY rule in exercise 3. All three Deployed."
verified = 2026-10-21

[[groups.items]]
id = "timelocks"
title = "BIP 65: OP_CHECKLOCKTIMEVERIFY (with BIPs 68, 112 and 113)"
authors = "Peter Todd (65); Mark Friedenbach, BtcDrak, Nicolas Dorier, kinoshitajona (68); BtcDrak, Mark Friedenbach, Eric Lombrozo (112); Thomas Kerin, Mark Friedenbach (113)"
year = "2014–2015"
type = "standard"
access = "free"
url = "https://github.com/bitcoin/bips/blob/master/bip-0065.mediawiki"
link_text = "BIP 65"
more_links = [{ text = "BIP 68", url = "https://github.com/bitcoin/bips/blob/master/bip-0068.mediawiki" }, { text = "BIP 112", url = "https://github.com/bitcoin/bips/blob/master/bip-0112.mediawiki" }, { text = "BIP 113", url = "https://github.com/bitcoin/bips/blob/master/bip-0113.mediawiki" }]
description = "The timelock rules exercise 5 maps its rejections to: absolute locks in script (OP_CHECKLOCKTIMEVERIFY, BIP 65), relative lock-time in nSequence (BIP 68) and its script opcode (CHECKSEQUENCEVERIFY, BIP 112), and median time-past as the clock for time-based locks (BIP 113). All Deployed; Mastering Bitcoin chs. 6–7 explain them in prose."
verified = 2026-10-21

