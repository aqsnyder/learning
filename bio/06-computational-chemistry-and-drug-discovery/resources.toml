[[groups.items]]
id = "zinc-database-free-library-of"
title = "ZINC-22 — A Free Multi-Billion-Scale Database of Tangible Compounds for Ligand Discovery"
authors = "Tingle, B. I., Tang, K. G., Castanon, M., Gutierrez, J. J., Khurelbaatar, M., Dandarchuluun, C., Moroz, Y. S., Irwin, J. J."
year = "2023"
type = "paper"
label = "Database paper"
access = "free"
url = "https://doi.org/10.1021/acs.jcim.2c01253"
link_text = "J. Chem. Inf. Model."
more_links = [{ text = "Free full text (eScholarship)", url = "https://escholarship.org/uc/item/2tp4t4m5" }, { text = "ZINC-22 via CartBlanche", url = "https://cartblanche22.docking.org/" }]
description = "The current generation of ZINC, the free compound library this section's screens draw on: purchasable, make-on-demand chemical space has grown \"into the tens of billions of molecules\", and ZINC-22 is free to everyone through the CartBlanche interface. *J. Chem. Inf. Model.* 63:1166–1176. Replaces a row for the older ZINC site, whose \"over 230 million compounds\" predates ZINC-22"
verified = 2026-10-21

