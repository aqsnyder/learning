description = "The standard textbook for computational chemistry — covers force fields, energy minimization, molecular dynamics, Monte Carlo methods, docking, and QSAR with clear mathematical exposition. Prentice Hall/Pearson, ISBN 9780582382107; Pearson's old product page now serves an unrelated book, so this links the catalogue record"
verified = 2026-10-13

[[groups.items]]
