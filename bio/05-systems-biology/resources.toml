[[groups]]

[[groups.items]]
id = "an-introduction-to-systems-biology"
title = "An Introduction to Systems Biology: Design Principles of Biological Circuits"
authors = "Alon, U."
year = "2019"
type = "book"
label = "Textbook"
access = "paid"
level = "intermediate"
marks = ["core"]
url = "https://www.routledge.com/An-Introduction-to-Systems-Biology-Design-Principles-of-Biological-Circuits/Alon/p/book/9781439837177"
link_text = "Chapman & Hall/CRC"
description = "The gold-standard textbook — beautifully explains network motifs, robustness, feedback loops, and the engineering principles underlying biological circuits with elegant simplicity"
verified = 2026-10-13

[[groups.items]]
id = "network-motifs-simple-building-blocks-of"
title = "Network Motifs: Simple Building Blocks of Complex Networks"
authors = "Milo, R., Shen-Orr, S., Itzkovitz, S., Kashtan, N., Chklovskii, D., Alon, U."
year = "2002"
type = "paper"
access = "paid"
marks = ["core"]
url = "https://doi.org/10.1126/science.298.5594.824"
link_text = "Science"
description = "Landmark paper that identified recurring circuit patterns (feed-forward loops, bi-fans) in biological and engineered networks — foundational concept for understanding network architecture. *Science* 298:824–827"
verified = 2026-10-21

[[groups.items]]
id = "systems-biology-a-textbook-2nd-edition"
title = "Systems Biology: A Textbook (2nd Edition)"
authors = "Klipp, E., Liebermeister, W., Wierling, C., Kowald, A."
year = "2016"
type = "book"
label = "Textbook"
access = "paid"
level = "advanced"
url = "https://www.wiley.com/en-us/Systems+Biology%3A+A+Textbook%2C+2nd+Edition-p-9783527336364"
link_text = "Wiley-VCH"
more_links = [{ text = "Wiley-VCH e-book page", url = "https://wiley-vch.e-bookshelf.de/systems-biology-7702729.html?lang=dt" }]
description = "Comprehensive graduate-level textbook covering metabolic networks, signaling pathways, gene regulation, and computational modeling, with modeling software on the companion site. 2nd edition, 2016, 504 pp"
verified = 2026-10-21

[[groups.items]]
id = "network-biology-understanding-the-cell-s"
title = "Network Biology: Understanding the Cell's Functional Organization"
authors = "Barabási, A.-L. & Oltvai, Z. N."
year = "2004"
type = "paper"
access = "paid"
url = "https://doi.org/10.1038/nrg1272"
link_text = "Nature Reviews Genetics"
description = "Authoritative review connecting network science to cell biology — covers scale-free networks, network hubs, modularity, and how network topology shapes cellular function"
verified = 2026-10-13

[[groups.items]]
id = "scale-free-networks-are-rare"
title = "Scale-Free Networks Are Rare"
authors = "Broido, A. D. & Clauset, A."
year = "2019"
type = "paper"
access = "free"
url = "https://doi.org/10.1038/s41467-019-08746-5"
link_text = "Nat. Commun."
description = "The counterweight to Barabási & Oltvai: tests of nearly 1,000 social, biological, technological, transportation and information networks find strongly scale-free structure empirically rare, with log-normal distributions fitting most degree data as well as or better than power laws; a few biological and technological networks do look strongly scale-free. The critique half of Practice 6. *Nat. Commun.* 10:1017 (open access)"
verified = 2026-10-21

[[groups.items]]
id = "kegg-kyoto-encyclopedia-of-genes-and"
title = "KEGG: Kyoto Encyclopedia of Genes and Genomes"
authors = "Kanehisa, M. & Goto, S."
year = "2024"
type = "database"
access = "free"
url = "https://www.genome.jp/kegg/"
link_text = "KEGG"
description = "Curated database of metabolic pathways, signaling networks, and disease pathways — essential reference for exploring pathway maps and understanding cross-talk between biological systems"
verified = 2026-10-13

[[groups.items]]
id = "systems-biology-a-brief-overview"
title = "Systems Biology: A Brief Overview"
authors = "Kitano, H."
year = "2002"
type = "paper"
access = "paid"
url = "https://doi.org/10.1126/science.1069492"
link_text = "Science"
description = "Early and influential articulation of the systems biology vision — argues for integrating computational modeling with high-throughput experiments to understand biological robustness"
verified = 2026-10-13

[[groups.items]]
id = "a-new-approach-to-decoding-life-systems"
title = "A New Approach to Decoding Life: Systems Biology"
authors = "Ideker, T., Galitski, T., Hood, L."
year = "2001"
type = "paper"
access = "paid"
url = "https://doi.org/10.1146/annurev.genom.2.1.343"
link_text = "Annu. Rev. Genomics Hum. Genet."
description = "Foundational review laying out the systems biology roadmap — integrating genomics, proteomics, and computational models to understand cellular behavior holistically"
verified = 2026-10-13

[[groups.items]]
id = "network-motifs-in-the-transcriptional"
title = "Network Motifs in the Transcriptional Regulation Network of *Escherichia coli*"
authors = "Shen-Orr, S. S., Milo, R., Mangan, S., Alon, U."
year = "2002"
type = "paper"
access = "paid"
url = "https://doi.org/10.1038/ng881"
link_text = "Nature Genetics"
description = "Companion to the Science motifs paper — maps the complete *E. coli* transcriptional network and identifies the specific motifs (including feed-forward loops) that dominate gene regulation"
verified = 2026-10-13

[[groups.items]]
id = "regulondb"
title = "RegulonDB"
authors = "RegulonDB team, CCG–UNAM"
type = "database"
access = "free"
url = "https://regulondb.ccg.unam.mx/"
link_text = "RegulonDB"
description = "The primary database on transcriptional regulation in *E. coli* K-12, curated from original publications and supplemented by high-throughput data and computational predictions — the current network for Practice 3's motif counts (Shen-Orr et al.'s 2002 network is the historical baseline)"
verified = 2026-10-21

[[groups.items]]
id = "mit-8-591j-systems-biology-ocw"
title = "MIT 8.591J — Systems Biology (OCW)"
authors = "Gore, J."
year = "2014"
type = "course"
access = "free"
level = "advanced"
url = "https://ocw.mit.edu/courses/8-591j-systems-biology-fall-2014/"
link_text = "MIT OCW"
description = "Full MIT lecture videos and problem sets covering gene circuits, stochastic gene expression, evolution, and ecological dynamics — pairs perfectly with the Alon textbook"
verified = 2026-10-13

[[groups.items]]
id = "celldesigner-modeling-biological"
title = "CellDesigner — Modeling Biological Networks"
authors = "Systems Biology Institute"
year = "2024"
type = "tool"
label = "Software"
access = "free"
url = "https://www.celldesigner.org/"
link_text = "CellDesigner"
