verified = 2026-10-13

[[groups.items]]
id = "a-synthetic-oscillatory-network-of"
title = "A Synthetic Oscillatory Network of Transcriptional Regulators (the Repressilator)"
authors = "Elowitz, M. B. & Leibler, S."
year = "2000"
type = "paper"
access = "paid"
url = "https://doi.org/10.1038/35002125"
link_text = "Nature"
description = "Three repressors wired into a ring produced a working oscillator in *E. coli* — the proof that these design principles run in reverse, and still the canonical worked example of a biological oscillator"
verified = 2026-10-13

[[groups.items]]
id = "construction-of-a-genetic-toggle-switch"
title = "Construction of a Genetic Toggle Switch in *Escherichia coli*"
authors = "Gardner, T. S., Cantor, C. R. & Collins, J. J."
year = "2000"
type = "paper"
access = "paid"
url = "https://doi.org/10.1038/35002131"
link_text = "Nature"
description = "Published back-to-back with the repressilator — a bistable two-repressor switch with the stability analysis spelled out; the clearest entry point to bistability and hysteresis in gene circuits"
verified = 2026-10-13

[[groups.items]]
