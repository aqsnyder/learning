[[groups.items]]
id = "receptive-fields-binocular-interaction"
title = "Receptive Fields, Binocular Interaction and Functional Architecture in the Cat's Visual Cortex"
authors = "David Hubel & Torsten Wiesel"
year = "1962"
type = "paper"
access = "paid"
url = "https://doi.org/10.1113/jphysiol.1962.sp006837"
link_text = "Paper"
description = "The experiment that found orientation-selective cells in visual cortex and the columnar organisation they sit in, by moving a bar across a cat's retina and listening to single units. Practice 5 implements its central hypothesis and then finds where the linear version of it fails"
verified = 2026-10-21

