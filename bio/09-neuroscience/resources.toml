[[groups.items]]
id = "fully-integrated-silicon-probes-for-high"
title = "Fully Integrated Silicon Probes for High-Density Recording of Neural Activity (Neuropixels)"
authors = "James J. Jun, Nicholas A. Steinmetz, Joshua H. Siegle et al. (… Timothy D. Harris)"
year = "2017"
type = "paper"
access = "paid"
url = "https://doi.org/10.1038/nature24636"
