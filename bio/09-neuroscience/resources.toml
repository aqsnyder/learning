[[groups]]

[[groups.items]]
id = "theoretical-neuroscience-computational"
title = "Theoretical Neuroscience: Computational and Mathematical Modeling of Neural Systems"
authors = "Peter Dayan & L.F. Abbott"
year = "2001"
type = "book"
access = "partial"
level = "intermediate"
marks = ["core"]
url = "https://mitpress.mit.edu/9780262541855/theoretical-neuroscience/"
link_text = "Book"
more_links = [{ text = "Authors' page", url = "https://www.gatsby.ucl.ac.uk/~dayan/book/" }]
description = "The standard graduate textbook for computational neuroscience: neural encoding and decoding, adaptation and plasticity, and network models, with the derivations Practice 2, 3 and 4 lean on. The book is paid, but the authors' page carries the contents, errata and a free sample chapter (Ch. 7, on network models)"
verified = 2026-10-21

