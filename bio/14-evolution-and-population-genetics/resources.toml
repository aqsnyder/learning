[[groups]]
outro = '''
**Also relevant, listed in their home sections:** [Karczewski et al. (2020), gnomAD constraint](../02-genetics-and-genomics/README.md) — selection measured across 141,456 humans, and the input to Practice 5; [the 1000 Genomes Project](../02-genetics-and-genomics/README.md) — the allele-frequency data for Practice 2; [Durbin et al.'s phylogenetics chapters](../04-bioinformatics-and-sequence-analysis/README.md) — substitution models and tree likelihoods; [Arnold's Nobel lecture on directed evolution](../07-protein-engineering-and-design/README.md) — the same theory run deliberately, in a flask.
'''

