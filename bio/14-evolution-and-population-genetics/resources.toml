[[groups.items]]
id = "an-introduction-to-population-genetics"
title = "An Introduction to Population Genetics: Theory and Applications"
authors = "Rasmus Nielsen, Montgomery Slatkin"
year = "2013"
type = "book"
label = "Textbook"
access = "paid"
level = "intermediate"
url = "https://nhbs.com/an-introduction-to-population-genetics-book"
link_text = "Book"
description = "A compact, modern, 287-page treatment built around inference from real sequence data: drift and mutation, coalescence, population structure, demographic inference, linkage disequilibrium and mapping, selection in finite populations, the neutral theory and tests of it. The best paired reading with Coop's notes (ISBN 9781605351537)"
verified = 2026-10-13

[[groups.items]]
id = "evolutionary-rate-at-the-molecular-level"
title = "Evolutionary Rate at the Molecular Level"
authors = "Motoo Kimura"
year = "1968"
type = "paper"
marks = ["core"]
access = "paid"
url = "https://doi.org/10.1038/217624a0"
link_text = "Nature"
description = "Three pages that reorganized the field: molecular substitution rates are too high and too clock-like to be explained by selection, so most of them must be neutral. Everything downstream — the molecular clock, neutrality tests, conservation as a signal — is an argument with or about this paper. Nature 217:624–626"
verified = 2026-10-13

[[groups.items]]
id = "genealogical-trees-coalescent-theory-and"
title = "Genealogical Trees, Coalescent Theory and the Analysis of Genetic Polymorphisms"
authors = "Noah A. Rosenberg, Magnus Nordborg"
year = "2002"
type = "paper"
label = "Review"
access = "paid"
url = "https://doi.org/10.1038/nrg795"
link_text = "Nat. Rev. Genet."
description = "The clearest introduction to the coalescent for someone who wants to use it: looking backwards in time instead of forwards, what the genealogy predicts about observable polymorphism, and how demography and selection deform the tree. Nat. Rev. Genet. 3:380–390"
verified = 2026-10-13

[[groups.items]]
id = "msprime-coalescent-simulation-of"
title = "msprime — coalescent simulation of ancestry and genomic sequence"
authors = "tskit-dev"
year = "2026"
type = "tool"
access = "free"
url = "https://github.com/tskit-dev/msprime"
link_text = "GitHub"
description = "\"Simulate ARGs and genomic sequence data using population genetic models\" — the standard Python coalescent simulator (GPL-3.0), fast enough to generate chromosome-scale samples and the reason every exercise below has a ground truth to check against. Documentation at [tskit.dev/msprime](https://tskit.dev/msprime/docs/latest/)"
verified = 2026-10-13

[[groups.items]]
id = "the-dynamics-of-molecular-evolution-over"
title = "The Dynamics of Molecular Evolution over 60,000 Generations"
authors = "Benjamin H. Good, Michael J. McDonald, Jeffrey E. Barrick, Richard E. Lenski, Michael M. Desai"
year = "2017"
type = "paper"
access = "paid"
url = "https://doi.org/10.1038/nature24287"
link_text = "Nature"
description = "Population genetics as a watched experiment: whole-population sequencing of Lenski's twelve *E. coli* lines every 500 generations for 60,000 generations. Fitness gains decelerate while adaptation keeps going, competing lineages coexist far longer than simple models allow, and you can see clonal interference happen. Nature 551:45–50"
verified = 2026-10-13

[[groups.items]]
id = "iq-tree-maximum-likelihood-phylogenetic"
title = "IQ-TREE — maximum-likelihood phylogenetic inference"
authors = "L.-T. Nguyen, H. A. Schmidt, A. von Haeseler, B. Q. Minh"
year = "2015"
type = "tool"
access = "free"
url = "http://www.iqtree.org/"
link_text = "iqtree.org"
description = "Fast maximum-likelihood tree inference with model selection (ModelFinder) and ultrafast bootstrap approximation — the practical tool for Practice 4. Cite *Mol. Biol. Evol.* 32:268–274, [10.1093/molbev/msu300](https://doi.org/10.1093/molbev/msu300)"
verified = 2026-10-13
