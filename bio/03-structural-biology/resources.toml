[[groups.items]]
id = "highly-accurate-protein-structure"
title = "Highly Accurate Protein Structure Prediction with AlphaFold"
authors = "John Jumper et al. (DeepMind)"
year = "2021"
type = "paper"
access = "free"
url = "https://doi.org/10.1038/s41586-021-03819-2"
link_text = "Paper"
description = "The AlphaFold2 paper that revolutionized structure prediction — read after building structural biology foundations to appreciate its significance. Here it is the source for what pLDDT and PAE mean (Practice 5); the model itself is studied in Section 10. Also used in bio/10, ml/13 and physics/11."
verified = 2026-10-13

[[groups.items]]
id = "alphafold-protein-structure-database"
title = "AlphaFold Protein Structure Database: Massively Expanding the Structural Coverage of Protein-Sequence Space with High-Accuracy Models"
authors = "Mihaly Varadi et al. (EMBL-EBI & DeepMind)"
year = "2022"
type = "paper"
access = "free"
url = "https://academic.oup.com/nar/article/50/D1/D439/6430488"
link_text = "Nucleic Acids Research"
description = "Describes the database that now sits beside the PDB with predicted structures for essentially every known protein — and, crucially, how to read its pLDDT and PAE confidence measures before you trust a model"
verified = 2026-10-13

