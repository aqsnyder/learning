[[groups.items]]
id = "how-much-energy-is-released-in-atp"
title = "How Much Energy Is Released in ATP Hydrolysis? (Cell Biology by the Numbers)"
authors = "Ron Milo, Rob Phillips"
year = "2015"
type = "article"
label = "Vignette"
access = "free"
url = "https://book.bionumbers.org/how-much-energy-is-released-in-atp-hydrolysis/"
link_text = "Vignette"
more_links = [{ text = "Hydrophobic-effect energy scale", url = "https://book.bionumbers.org/what-is-the-energy-scale-associated-with-the-hydrophobic-effect/" }, { text = "Enzyme turnover rates", url = "https://book.bionumbers.org/how-many-reactions-do-enzymes-carry-out-each-second/" }]
description = "Puts numbers on Practice 3: under standard conditions ATP hydrolysis gives about −28 to −34 kJ/mol, but at real cellular concentrations about −47 kJ/mol (*E. coli* on glucose) to −70 kJ/mol, roughly twice as much. The two companion vignettes give the energy scale of the hydrophobic effect (objective 3) and how many reactions per second enzymes really carry out (Practice 1). From Milo & Phillips's free book, whose home is [Section 00](../00-molecular-biology-fundamentals/README.md)"
verified = 2026-10-21
