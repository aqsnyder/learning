description = "\"Baby KJ\": a bespoke base-editing therapy for one infant's CPS1 deficiency, designed, manufactured, and dosed by lipid nanoparticle within about six months — published in 2025 and, as of October 2026, still the reference case for a personalized *in vivo* CRISPR therapy. Free copy in PubMed Central (PMC12713542)"
verified = 2026-10-21
