[[groups]]

[[groups.items]]
id = "a-programmable-dual-rnaguided-dna"
title = "A Programmable Dual-RNA–Guided DNA Endonuclease in Adaptive Bacterial Immunity"
authors = "Jinek, Chylinski, Fonfara, Hauer, Doudna & Charpentier"
year = "2012"
type = "paper"
marks = ["core"]
access = "paid"
url = "https://doi.org/10.1126/science.1225829"
link_text = "Paper"
description = "The result the editing field is built on: Cas9 guided by a designed RNA cuts a chosen DNA sequence *in vitro*, which is what makes the nuclease programmable rather than fixed. Read it for the mechanism Practice 4 then designs against; a free author copy sits in PubMed Central (PMC6286148)"
verified = 2026-10-21

[[groups.items]]
id = "standards-and-guidelines-for-the"
title = "Standards and Guidelines for the Interpretation of Sequence Variants"
authors = "Richards, Aziz, Bale, Bick, Das et al. (ACMG/AMP)"
year = "2015"
type = "paper"
marks = ["core"]
access = "free"
url = "https://doi.org/10.1038/gim.2015.30"
link_text = "Paper"
description = "The ACMG/AMP framework clinical laboratories actually use: weighted evidence criteria and the rules for combining them into the five tiers from pathogenic to benign. Practice 1 applies it variant by variant and reconciles the result against an expert panel's. Free full text in PubMed Central (PMC4544753)"
verified = 2026-10-21

