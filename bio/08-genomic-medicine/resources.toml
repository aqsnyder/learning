year = "2009"
type = "paper"
access = "paid"
url = "https://doi.org/10.1038/nature08494"
link_text = "Paper"
description = "The review that set the agenda on \"missing heritability\": why the variants GWAS finds explain only a small share of the heritability of complex disease, and the candidate explanations for the rest. Practice 6 scores those predictions against where the field actually landed. Free author copy in PubMed Central (PMC2831613)"
verified = 2026-10-21

