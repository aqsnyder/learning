authors = "Nielsen, Voigt et al."
year = "2016"
type = "paper"
marks = ["core"]
access = "paid"
url = "https://doi.org/10.1126/science.aac7341"
link_text = "Science"
description = "Cello: a compiler that takes a Verilog description of a logic circuit and emits a DNA sequence implementing it in *E. coli*, with each gate characterised as an input-output transfer function in relative promoter units. The section's model of biology-as-design-automation, and the source of the gate parameters, noise margins and fan-out limits in Practice 1"
verified = 2026-10-13

