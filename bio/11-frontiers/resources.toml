[[groups]]
title = "Foundation Models for Biology"
outro = '''
Foundation models — large-scale pre-trained models fine-tuned for downstream tasks — are arriving in biology (the dual-use consequences of exactly this capability are the next subsection). Evo is a genomic foundation model trained on 2.7 million prokaryotic and phage genomes that can generate functional DNA sequences and predict fitness effects across scales from single nucleotides to entire genomes. Its successor Evo 2 (7B and 40B parameters, ~9 trillion bases spanning all domains of life, released openly) predicts the functional effects of genetic variation and generates genome-scale sequence; as of October 2026 it is the newest of the three, which is the kind of fact to re-check rather than to trust. Geneformer learns gene network biology from 30 million single-cell transcriptomes, enabling predictions about disease mechanisms. Together, these models represent a bet that biology's language can be learned directly from data — a bet Practice 5 asks you to test on one of them rather than accept.

**Also used here (tracked in its home section):** scGPT: Toward Building a Foundation Model for Single-Cell Multi-omics Using Generative AI ([Section 10](../10-ai-for-biology/README.md)) for the single-cell half of this comparison — it is the foundation model benchmarked against a PCA baseline in that section's Practice 5.
'''

