year = "2023"
type = "paper"
marks = ["core"]
url = "https://doi.org/10.1038/s41586-023-06377-x"
link_text = "Nature"
description = "The result this subsection is built on: intracortical recordings from a participant with paralysis decoded into attempted speech at roughly 62 words per minute, with the vocabulary-dependent error rates quoted above. Practice 2 converts those figures into an information rate and then into channel-count, link and power requirements for the implant"
verified = 2026-10-13

