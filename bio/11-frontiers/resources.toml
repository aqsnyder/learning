[[groups]]
title = "Brain-Computer Interfaces"
outro = '''
Brain-computer interfaces are transitioning from laboratory demonstrations to clinical reality. Hochberg's BrainGate trial first showed that a paralyzed human could control a computer cursor with thought alone. Willett et al. achieved a stunning leap in 2023 — decoding attempted speech from neural activity at 62 words per minute, 3.4 times the previous record, with a 9.1% word error rate on a 50-word vocabulary and 23.8% on a 125,000-word one. The paper's own framing is the honest one: that rate *begins to approach* natural conversation, which it puts at 160 words per minute. The company row below is here for the hardware side — high-density implantable arrays and robotic insertion — but as of October 2026 its claims sit on its own website rather than in peer-reviewed results, so date anything you take from it and keep the measured numbers coming from Willett and Hochberg.
'''

[[groups.items]]
