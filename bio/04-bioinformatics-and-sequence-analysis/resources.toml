[[groups.items]]
id = "biological-sequence-analysis"
title = "Biological Sequence Analysis: Probabilistic Models of Proteins and Nucleic Acids"
authors = "Richard Durbin, Sean R. Eddy, Anders Krogh, Graeme Mitchison"
year = "1998"
type = "book"
label = "Textbook"
access = "paid"
level = "intermediate"
marks = ["core"]
url = "https://doi.org/10.1017/CBO9780511790492"
link_text = "Cambridge University Press"
description = "The standard textbook on probabilistic methods in bioinformatics — pairwise alignment, HMMs, profile HMMs, phylogenetics and RNA structure prediction, with mathematical rigor. Cambridge University Press, 1998 (online edition 2012)"
verified = 2026-10-21

[[groups.items]]
