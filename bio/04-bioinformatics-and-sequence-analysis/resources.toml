description = "NCBI's official BLAST Help pages, with tutorials under \"Getting Help\" — how to run nucleotide and protein BLAST searches and interpret E-values and alignment scores. The searches themselves run from the [BLAST home page](https://blast.ncbi.nlm.nih.gov/Blast.cgi)"
verified = 2026-10-13

