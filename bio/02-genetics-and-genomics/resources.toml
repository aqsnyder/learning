[[groups.items]]
id = "genome-wide-association-studies"
title = "Genome-Wide Association Studies"
authors = "Emil Uffelmann, Qin Qin Huang, Nchangwi Syntia Munung, Jantina de Vries, Yukinori Okada, Alicia R. Martin, Hilary C. Martin, Tuuli Lappalainen et al. (… Danielle Posthuma)"
year = "2021"
type = "article"
label = "Primer"
access = "paid"
url = "https://doi.org/10.1038/s43586-021-00056-9"
link_text = "Nat. Rev. Methods Primers"
description = "The current standard primer on how a GWAS is designed, run and misread — study design, quality control, Manhattan and QQ plots, functional follow-up and polygenic risk scores. *Nat. Rev. Methods Primers* 1:59 (subscription); for a free alternative covering the same ground more briefly, NHGRI's [Genome-Wide Association Studies Fact Sheet](https://www.genome.gov/about-genomics/fact-sheets/Genome-Wide-Association-Studies-Fact-Sheet) is good on why an associated SNP is usually not the causal one"
verified = 2026-10-13

