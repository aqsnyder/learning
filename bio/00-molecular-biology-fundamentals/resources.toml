authors = "Erwin Schrödinger"
year = "1944, 2012"
type = "book"
access = "paid"
level = "beginner"
url = "https://www.cambridge.org/core/books/what-is-life/A7E1DCFB0E4CDD82C7F8AC85B4D19B96"
link_text = "Book"
more_links = [{ text = "Open Library record", url = "https://openlibrary.org/isbn/9781107604667" }]
description = "Prescient classic where a physicist anticipated the molecular basis of heredity before DNA's structure was known. Based on lectures given at Trinity College Dublin in February 1943 and first published in 1944; Cambridge University Press's current edition (2012, 184 pp, ISBN 9781107604667) adds *Mind and Matter* and *Autobiographical Sketches*"
