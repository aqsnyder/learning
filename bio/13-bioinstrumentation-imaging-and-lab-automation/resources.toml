**Also relevant, listed in their home sections:** [Jun et al. (2017) on Neuropixels](../09-neuroscience/README.md) — the CMOS probe, multiplexing and noise budget that define modern electrophysiology; [Goodwin, McPherson & McCombie (2016) on NGS platforms](../02-genetics-and-genomics/README.md) — read lengths and error profiles per platform; the [cryo-EM Nobel lectures and Callaway's feature](../03-structural-biology/README.md) — detectors as the unlock, and Section 03's Practice 6 for the dose budget.
'''

