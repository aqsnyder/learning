id = "nikon-s-microscopyu-the-source-for"
title = "Nikon's MicroscopyU — The Source for Microscopy Education"
authors = "Nikon Instruments"
year = "2026"
type = "website"
label = "Resource"
marks = ["core"]
url = "https://www.microscopyu.com/"
link_text = "MicroscopyU"
description = "The best free optics-for-biologists reference there is: resolution and numerical aperture, fluorescence, super-resolution, and a Digital Imaging section whose interactive tutorials on [CCD noise sources](https://www.microscopyu.com/tutorials/ccd-noise-sources) and [CCD signal-to-noise ratio](https://www.microscopyu.com/tutorials/ccd-signal-to-noise-ratio) are exactly the detector budget an instrument engineer wants. Start at [Resolution](https://www.microscopyu.com/microscopy-basics/resolution)"
verified = 2026-10-13

