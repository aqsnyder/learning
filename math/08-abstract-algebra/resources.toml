[[groups]]

[[groups.items]]
id = "a-book-of-abstract-algebra"
title = "A Book of Abstract Algebra"
authors = "Charles C. Pinter"
year = "2010"
type = "book"
access = "paid"
level = "beginner"
marks = ["core"]
url = "https://store.doverpublications.com/products/9780486474175"
link_text = "Dover"
description = "Dover edition (2010) of an accessible but rigorous text covering the topics of a typical first course in abstract algebra: it builds from concrete examples to groups, rings, fields and Galois theory. The core text for the group and ring work in Practice 1–3 and the mini-project."
verified = 2026-10-21

[[groups.items]]
id = "algebra-chapter-0"
title = "Algebra: Chapter 0"
authors = "Paolo Aluffi"
year = "2009"
type = "book"
access = "paid"
level = "advanced"
url = "https://bookstore.ams.org/gsm-104"
link_text = "AMS"
description = "Graduate text (AMS Graduate Studies in Mathematics 104) whose distinguishing feature is the early introduction of categories as a unifying theme. More demanding than Pinter; read it for the modern perspective once groups and rings are familiar, and as a bridge to Section 11."
verified = 2026-10-21

[[groups.items]]
id = "abstract-algebra-theory-and-applications"
title = "Abstract Algebra: Theory and Applications"
authors = "Thomas W. Judson"
year = "2026"
type = "book"
access = "free"
level = "beginner"
marks = ["core"]
url = "https://judsonbooks.org/abstract-algebra-theory-and-applications/"
link_text = "judsonbooks.org"
description = "Free, open-source undergraduate text (GNU Free Documentation License; 2026 edition, latest PDF dated August 2026), with Sage exercises by Robert Beezer. Groups, rings and fields with applications: cosets and Lagrange (Ch. 6), algebraic coding theory (Ch. 8), group actions and Burnside's counting theorem (Ch. 14), polynomials (Ch. 17), finite fields and polynomial codes (Ch. 22). The free core companion to Pinter and the main source for Practice 4–5 and the mini-project; the author's page has the HTML and PDF versions."
verified = 2026-10-21

[[groups.items]]
id = "visual-group-theory"
title = "Visual Group Theory"
authors = "Matthew Macauley"
type = "video-series"
access = "free"
level = "beginner"
url = "https://www.youtube.com/playlist?list=PLwV-9DG53NDxU337smpTwm6sef4x-SCLv"
link_text = "Link"
description = "University lecture series built on Nathan Carter's *Visual Group Theory* book. Cayley diagrams, symmetry groups, and group actions made visual. Excellent supplement."
verified = 2026-10-13

[[groups.items]]
id = "topics-in-algebra"
title = "Topics in Algebra"
authors = "I. N. Herstein"
year = "1975"
type = "book"
access = "paid"
level = "intermediate"
url = "https://gov.wiley.com/WileyCDA/WileyTitle/productCd-0471010901,descCd-authorInfo.html"
link_text = "Wiley"
description = "Classic undergraduate text (2nd edition, ©1975; Wiley now prints it on demand), demanding and known for hard exercises that build algebraic maturity. For when Pinter's problems feel easy."
verified = 2026-10-21

[[groups.items]]
id = "group-equivariant-convolutional-networks"
title = "Group Equivariant Convolutional Networks"
authors = "Taco Cohen, Max Welling"
year = "2016"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/1602.07576"
link_text = "Link"
description = "The paper that brought group theory into deep learning: generalizes convolution from translations to rotations and reflections so the network is equivariant by construction. Later equivariant architectures (E(n)-GNNs, SE(3)-Transformers) are in [Section 13 of the ML curriculum](../../ml/13-graphs-geometry-and-science/README.md)."
verified = 2026-10-13

[[groups.items]]
id = "algebra"
title = "Algebra"
authors = "Serge Lang"
year = "2002"
type = "book"
access = "paid"
level = "advanced"
url = "https://link.springer.com/book/10.1007/978-1-4613-0041-0"
link_text = "Springer"
description = "Graduate text and reference (revised third edition, Springer Graduate Texts in Mathematics, 2002), meant for a one-year graduate course: from basic group theory to commutative and homological algebra. A reference, not a first book."
verified = 2026-10-21

[[groups.items]]
id = "visual-group-theory-2"
title = "Visual Group Theory"
authors = "Nathan Carter"
year = "2009"
type = "book"
access = "paid"
level = "beginner"
url = "https://bookstore.ams.org/CLRM/32"
link_text = "AMS (MAA Press)"
description = "The book behind Macauley's lectures (MAA Classroom Resource Materials 32, 2009): a typical undergraduate group theory course taught visually, with more than 300 illustrations, assuming only high-school mathematics."
verified = 2026-10-21

[[groups.items]]
id = "group-explorer-3"
title = "Group Explorer 3"
authors = "Nathan Carter, Ray Ellis"
type = "tool"
access = "free"
url = "https://nathancarter.github.io/group-explorer/"
link_text = "Link"
description = "Free, open-source (LGPL-3.0) web app, nothing to install, for exploring finite groups visually: a library of all groups up to order 20 plus notable larger ones, Cayley diagrams, multiplication tables, cycle graphs, and \"sheets\" for homomorphisms. The software companion to Carter's *Visual Group Theory*; use it to check the diagrams and tables you build by hand (Practice 1)."
verified = 2026-10-13
