# Resources for: Abstract Algebra
# Edit this file, then run `python tools/build.py` to regenerate README.md, PROGRESS.md and the indexes.
# Field reference: tools/README.md

[[groups]]

[[groups.items]]
id = "a-book-of-abstract-algebra"
title = "A Book of Abstract Algebra"
authors = "Charles Pinter"
year = "2010"
type = "book"
access = "paid"
level = "beginner"
marks = ["core"]
description = "The most accessible introduction to abstract algebra. Pinter builds from concrete examples to general theory with exceptional clarity. Covers groups, rings, fields, and Galois theory. Perfect for self-study."

[[groups.items]]
id = "algebra-chapter-0"
title = "Algebra: Chapter 0"
authors = "Paolo Aluffi"
year = "2009"
type = "book"
access = "paid"
level = "advanced"
description = "A modern, sophisticated introduction using category theory from the start. More demanding than Pinter but builds powerful mathematical perspective. Excellent for those heading toward advanced mathematics."

[[groups.items]]
id = "abstract-algebra-theory-and-applications"
title = "Abstract Algebra: Theory and Applications"
authors = "Thomas Judson"
type = "book"
access = "free"
url = "http://abstract.ups.edu/"
link_text = "Link"
description = "Free, comprehensive textbook covering groups, rings, fields, and applications (coding theory, crystallography). Good alternative to Pinter."

[[groups.items]]
id = "visual-group-theory"
title = "Visual Group Theory"
authors = "Matthew Macauley"
type = "video-series"
access = "free"
url = "https://www.youtube.com/playlist?list=PLwV-9DG53NDxU337smpTwm6sef4x-SCLv"
link_text = "Link"
description = "University lecture series built on Nathan Carter's *Visual Group Theory* book. Cayley diagrams, symmetry groups, and group actions made visual. Excellent supplement."
verified = 2026-10-13

[[groups.items]]
id = "harvard-abstract-algebra"
title = "Harvard Abstract Algebra"
authors = "Benedict Gross"
type = "course"
access = "free"
url = "https://www.youtube.com/playlist?list=PLelIK3uylPMGzHBuR3hLMHrYfMqWWsmx5"
link_text = "Link"
description = "Excellent lecture series covering groups, rings, and fields with emphasis on examples and applications."

[[groups.items]]
id = "topics-in-algebra"
title = "Topics in Algebra"
authors = "I.N. Herstein"
year = "1975"
type = "book"
description = "Classic undergraduate text (2nd edition; first published 1964), demanding and with notoriously good exercises. Known for building algebraic maturity through challenging problems."

[[groups.items]]
id = "group-equivariant-convolutional-networks"
title = "Group Equivariant Convolutional Networks"
authors = "Taco Cohen, Max Welling"
year = "2016"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/1602.07576"
link_text = "Link"
description = "The paper that brought group theory into deep learning: generalizes convolution from translations to rotations and reflections so the network is equivariant by construction. Later equivariant architectures (E(n)-GNNs, SE(3)-Transformers) are in [Section 13 of the ML curriculum](../../ml/13-graphs-geometry-and-science/README.md)."
verified = 2026-10-13

[[groups.items]]
id = "algebra"
title = "Algebra"
authors = "Serge Lang"
year = "2002"
type = "book"
access = "paid"
level = "advanced"
description = "Comprehensive graduate reference covering everything from basic group theory to commutative algebra and homological algebra. The encyclopedic reference."

[[groups.items]]
id = "visual-group-theory-2"
title = "Visual Group Theory"
authors = "Nathan Carter"
year = "2009"
type = "book"
description = "Companion to the video series. Uses visual diagrams and concrete examples to make group theory intuitive before formalism."

[[groups.items]]
id = "group-explorer-3"
title = "Group Explorer 3"
authors = "Nathan Carter, Ray Ellis"
type = "tool"
access = "free"
url = "https://nathancarter.github.io/group-explorer/"
link_text = "Link"
description = "Free, open-source (LGPL-3.0) web app, nothing to install, for exploring finite groups visually: a library of all groups up to order 20 plus notable larger ones, Cayley diagrams, multiplication tables, cycle graphs, and \"sheets\" for homomorphisms. The software companion to Carter's *Visual Group Theory*; use it to check the diagrams and tables you build by hand (Practice 1)."
verified = 2026-10-13
