authors = "Gilbert Strang"
year = "2023"
type = "book"
access = "paid"
level = "beginner"
description = "Strang's textbook companion to 18.06. More computational than Axler, excellent for applications."

[[groups.items]]
id = "linear-algebra"
title = "Linear Algebra"
