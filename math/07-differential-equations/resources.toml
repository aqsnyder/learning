**Tracked in another curriculum:** Chen, Rubanova, Bettencourt & Duvenaud, *Neural Ordinary Differential Equations* (2018), is core in [physics/11](../../physics/11-physics-informed-ml-and-frontiers/README.md). Read it there for the mini-project's optional Neural ODE extension.
