title = "MIT RES.6-007 Signals and Systems"
authors = "Alan V. Oppenheim"
year = "2011"
type = "course"
level = "intermediate"
access = "free"
marks = ["core"]
url = "https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/"
