authors = "Alan V. Oppenheim"
year = "2005"
type = "course"
level = "advanced"
access = "free"
url = "https://ocw.mit.edu/courses/6-341-discrete-time-signal-processing-fall-2005/"
link_text = "Link"
description = "Graduate DSP with lecture notes, problem sets and exams (no videos), built on Oppenheim, Schafer & Buck's *Discrete-Time Signal Processing*. Covers filter design, multirate systems, and spectral analysis in depth. Go here when Smith is no longer enough."
verified = 2026-10-13

[[groups.items]]
id = "mit-6-011-signals-systems-and-inference"
title = "MIT 6.011 Signals, Systems and Inference"
authors = "George Verghese, Alan V. Oppenheim, Peter Hagelstein"
year = "2018"
type = "course"
level = "intermediate"
access = "free"
marks = ["core"]
url = "https://ocw.mit.edu/courses/6-011-signals-systems-and-inference-spring-2018/"
link_text = "Link"
description = "Where signals meet probability: state-space models, random processes, correlation functions and power spectra, Wiener filtering, LMMSE estimation, hypothesis testing, and matched filters (notes and problem sets, no videos). The mathematics of noise and detection in instruments."
