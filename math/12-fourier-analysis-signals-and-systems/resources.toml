[[groups.items]]
id = "the-scientist-and-engineer-s-guide-to"
title = "The Scientist and Engineer's Guide to Digital Signal Processing"
authors = "Steven W. Smith"
year = "1997"
type = "book"
access = "free"
level = "beginner"
marks = ["core"]
url = "https://www.dspguide.com/"
link_text = "Link"
description = "A free, practical DSP book written for working engineers: sampling, the DFT and FFT, convolution, and FIR/IIR filter design, with a minimum of mathematics. The fastest route from theory to filters that work."
verified = 2026-10-13

[[groups.items]]
id = "stanford-ee261-the-fourier-transform-and"
title = "Stanford EE261 The Fourier Transform and its Applications"
authors = "Brad Osgood"
year = "2007"
type = "course"
level = "intermediate"
access = "free"
url = "https://see.stanford.edu/Course/EE261"
link_text = "Link"
description = "30 recorded lectures plus a free course reader. Covers Fourier series and transforms, convolution, distributions (δ and friends), sampling, and the DFT, taught to engineers with real mathematical care. The bridge between using Fourier analysis and understanding it."
verified = 2026-10-13

[[groups.items]]
