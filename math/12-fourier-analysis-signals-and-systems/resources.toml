description = "The classic signals-and-systems lecture series: LTI systems and convolution, Fourier series and transforms, sampling, modulation, and the Laplace and z-transforms. Includes video lectures, notes, and problem sets with solutions; readings follow Oppenheim & Willsky's *Signals and Systems*."
