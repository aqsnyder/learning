[[groups.items]]
id = "an-introduction-to-variational-methods"
title = "An Introduction to Variational Methods for Graphical Models"
authors = "Michael Jordan et al."
year = "1999"
type = "paper"
url = "https://people.eecs.berkeley.edu/~jordan/papers/variational-intro.pdf"
link_text = "Link"
description = "Connects information theory (KL divergence, variational bounds) to probabilistic graphical models. Bridge to modern variational inference."
