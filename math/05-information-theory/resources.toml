[[groups.items]]
id = "visual-information-theory"
title = "Visual Information Theory"
authors = "Chris Olah"
year = "2015"
type = "article"
label = "Blog Post"
access = "free"
url = "https://colah.github.io/posts/2015-09-Visual-Information/"
link_text = "Link"
description = "Gorgeous visual explanations of entropy, cross-entropy, and KL divergence. The best intuitive introduction to these concepts."
verified = 2026-10-13

[[groups.items]]
id = "information-theory-from-coding-to"
title = "Information Theory: From Coding to Learning"
authors = "Yury Polyanskiy, Yihong Wu"
year = "2025"
type = "book"
access = "free"
url = "https://people.lids.mit.edu/yp/homepage/data/itbook-export.pdf"
link_text = "Link"
description = "The modern graduate text (Cambridge University Press, 2025) by the MIT 6.441 instructor and Yihong Wu (Yale): classical coding theorems plus the information-theoretic tools now used in statistics and machine learning. A graduate-level alternative to Cover & Thomas, not a replacement for it as a first text; the authors' free draft PDF is for personal use."
verified = 2026-10-13
