[[groups]]

[[groups.items]]
id = "elements-of-information-theory"
title = "Elements of Information Theory"
authors = "Thomas Cover, Joy Thomas"
year = "2006"
type = "book"
access = "paid"
level = "intermediate"
marks = ["core"]
description = "The standard textbook. Comprehensive coverage of entropy, mutual information, channel capacity, rate-distortion theory, and connections to statistics. Clear exposition with excellent problems."

[[groups.items]]
id = "a-mathematical-theory-of-communication"
title = "A Mathematical Theory of Communication"
authors = "Claude Shannon"
year = "1948"
type = "paper"
marks = ["core"]
url = "https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf"
link_text = "Link"
description = "The founding paper of information theory. Beautifully written and surprisingly accessible. Reading Shannon in the original is a rite of passage."
verified = 2026-10-13

[[groups.items]]
id = "information-theory-inference-and"
title = "Information Theory, Inference, and Learning Algorithms"
authors = "David MacKay"
year = "2003"
type = "book"
access = "free"
level = "intermediate"
url = "https://www.inference.org.uk/itprnn/book.pdf"
link_text = "Link"
description = "A brilliant free book connecting information theory to Bayesian inference, error-correcting codes, and neural networks. Unique perspective that bridges multiple fields."

[[groups.items]]
id = "information-theory-playlist"
title = "Information Theory (playlist)"
authors = "mathematicalmonk"
