[[groups.items]]
id = "principles-of-mathematical-analysis-baby"
title = "Principles of Mathematical Analysis (Baby Rudin)"
authors = "Walter Rudin"
year = "1976"
type = "book"
access = "paid"
level = "advanced"
description = "The classic graduate analysis text. Extremely concise and demanding. Not a first book, but a benchmark for mathematical maturity."

[[groups.items]]
id = "active-calculus"
title = "Active Calculus"
authors = "Matt Boelkins"
year = "undated (checked Oct 2026)"
type = "book"
access = "free"
level = "beginner"
url = "https://activecalculus.org/"
link_text = "Link"
description = "Free, activity-based calculus texts (single-variable and multivariable, each in a 2nd edition, CC BY-SA, in HTML with PDF versions). A supplement for hands-on practice with computational techniques."
verified = 2026-10-13

[[groups.items]]
id = "vector-calculus-linear-algebra-and"
title = "Vector Calculus, Linear Algebra, and Differential Forms: A Unified Approach"
authors = "John H. Hubbard, Barbara Burke Hubbard"
year = "2015"
type = "book"
access = "paid"
level = "intermediate"
url = "https://matrixeditions.com/5thUnifiedApproach.html"
link_text = "Matrix Editions"
description = "Multivariable calculus built on linear algebra, 5th edition (Matrix Editions, 2015): vectors, matrices and derivatives (Ch. 1), Riemann and Lebesgue integration, and differential forms with the exterior derivative. Practice 4 uses its treatment of the derivative of a map between vector spaces."
verified = 2026-10-21

[[groups.items]]
id = "visual-complex-analysis"
title = "Visual Complex Analysis"
authors = "Tristan Needham"
year = "2023"
type = "book"
access = "paid"
level = "intermediate"
url = "https://global.oup.com/academic/product/visual-complex-analysis-9780192868923"
link_text = "Oxford UP"
description = "Complex analysis made geometric, 25th Anniversary Edition (Oxford University Press, 2023, with a new foreword by Roger Penrose): complex multiplication as rotation-and-scaling, conformal maps, and contour integration. This is the math under phasors, Laplace and z-transforms, and pole-zero plots, so it matters to an electrical engineer."
verified = 2026-10-21

[[groups.items]]
id = "mit-18-04-complex-variables-with"
title = "MIT 18.04 Complex Variables with Applications"
authors = "Jeremy Orloff"
year = "2018"
type = "course"
access = "free"
level = "intermediate"
url = "https://ocw.mit.edu/courses/18-04-complex-variables-with-applications-spring-2018/"
link_text = "Link"
description = "Engineering-oriented complex analysis with complete notes and solved problem sets: analytic and harmonic functions, techniques for hard integrals, Laplace and Fourier transforms, and 2D fluid flow. The structured companion to Needham."
verified = 2026-10-13
