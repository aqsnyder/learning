[[groups.items]]
id = "understanding-analysis"
title = "Understanding Analysis"
authors = "Stephen Abbott"
year = "2015"
type = "book"
access = "paid"
level = "intermediate"
marks = ["core"]
url = "https://link.springer.com/book/10.1007/978-1-4939-2712-8"
link_text = "Springer"
description = "A first course in real analysis written for self-study, 2nd edition (Springer Undergraduate Texts in Mathematics, 2015; the edition added about 150 exercises and three project sections). Covers the real numbers, sequences and series, the topology of ℝ, continuity, differentiation, sequences of functions, and integration, with historical motivation; Practice 1–3 and the mini-project cite its chapters."
verified = 2026-10-21

[[groups.items]]
id = "calculus"
title = "Calculus"
authors = "Michael Spivak"
year = "2008"
type = "book"
access = "paid"
level = "intermediate"
description = "A rigorous calculus text that doubles as an introduction to analysis. Extremely challenging problems that build deep understanding. Bridges computational calculus and proof-based analysis."

[[groups.items]]
id = "mit-18-01-single-variable-calculus"
title = "MIT 18.01SC Single Variable Calculus"
authors = "David Jerison"
year = "2010"
type = "course"
access = "free"
level = "beginner"
url = "https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/"
link_text = "MIT OCW"
description = "MIT's single-variable calculus in OCW Scholar format (Fall 2010): lecture videos with notes, recitation videos, worked examples, and problem sets and exams with solutions. For computational fluency in differentiation, integration, and series; Unit 5, Part B (Taylor series) feeds the mini-project."
verified = 2026-10-21

[[groups.items]]
id = "mit-18-02-multivariable-calculus"
title = "MIT 18.02SC Multivariable Calculus"
authors = "Denis Auroux"
year = "2010"
type = "course"
access = "free"
level = "beginner"
url = "https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/"
link_text = "MIT OCW"
description = "MIT's multivariable calculus in OCW Scholar format (Fall 2010): vectors and matrices, partial derivatives, gradients and Lagrange multipliers (Unit 2, used in Practice 4), double, triple, line and surface integrals, and Green's, Stokes' and divergence theorems. Critical for optimization and physics."
verified = 2026-10-21

[[groups.items]]
id = "multivariable-calculus"
title = "Multivariable Calculus"
