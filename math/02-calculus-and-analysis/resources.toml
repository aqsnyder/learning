[[groups.items]]
id = "understanding-analysis"
title = "Understanding Analysis"
authors = "Stephen Abbott"
year = "2015"
type = "book"
access = "paid"
level = "intermediate"
marks = ["core"]
description = "The best introduction to real analysis for self-study. Beautifully written, with historical motivation and carefully sequenced exercises. Covers sequences, series, continuity, differentiation, and integration rigorously."

[[groups.items]]
id = "calculus"
title = "Calculus"
authors = "Michael Spivak"
year = "2008"
type = "book"
access = "paid"
level = "intermediate"
description = "A rigorous calculus text that doubles as an introduction to analysis. Extremely challenging problems that build deep understanding. Bridges computational calculus and proof-based analysis."

[[groups.items]]
id = "mit-18-01-single-variable-calculus"
title = "MIT 18.01 Single Variable Calculus"
