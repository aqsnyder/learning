[[groups.items]]
id = "principles-of-mathematical-analysis-baby"
title = "Principles of Mathematical Analysis (Baby Rudin)"
authors = "Walter Rudin"
year = "1976"
type = "book"
access = "paid"
level = "advanced"
description = "The classic graduate analysis text. Extremely concise and demanding. Not a first book, but a benchmark for mathematical maturity."

[[groups.items]]
id = "active-calculus"
title = "Active Calculus"
authors = "Matt Boelkins"
type = "book"
access = "free"
url = "https://activecalculus.org/"
link_text = "Link"
description = "Free, activity-based approach to calculus. Good supplement for hands-on practice with computational techniques."
verified = 2026-10-13

[[groups.items]]
id = "vector-calculus-linear-algebra-and"
title = "Vector Calculus, Linear Algebra, and Differential Forms"
authors = "Hubbard & Hubbard"
year = "2015"
type = "book"
description = "Unified treatment connecting multivariable calculus with linear algebra and differential forms. Excellent for building a cohesive picture."

[[groups.items]]
id = "visual-complex-analysis"
title = "Visual Complex Analysis"
authors = "Tristan Needham"
year = "2023"
type = "book"
access = "paid"
level = "intermediate"
description = "Complex analysis made geometric (25th-anniversary edition of the 1997 classic): complex multiplication as rotation-and-scaling, conformal maps, and contour integration. This is the math under phasors, Laplace and z-transforms, and pole-zero plots — essential for an electrical engineer."

[[groups.items]]
id = "mit-18-04-complex-variables-with"
title = "MIT 18.04 Complex Variables with Applications"
authors = "Jeremy Orloff"
year = "2018"
type = "course"
access = "free"
url = "https://ocw.mit.edu/courses/18-04-complex-variables-with-applications-spring-2018/"
link_text = "Link"
description = "Engineering-oriented complex analysis with complete notes and solved problem sets: analytic and harmonic functions, techniques for hard integrals, Laplace and Fourier transforms, and 2D fluid flow. The structured companion to Needham."
verified = 2026-10-13
