[[groups.items]]
id = "mit-18-02-multivariable-calculus"
title = "MIT 18.02 Multivariable Calculus"
authors = "Denis Auroux"
type = "course"
access = "free"
url = "https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/"
link_text = "Link"
