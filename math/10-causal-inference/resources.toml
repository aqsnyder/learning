description = "Machine-learning-oriented treatment of causal inference. Covers causal discovery from data and connections to transfer learning. Open access: the link is the free PDF (CC BY-NC-ND 4.0) in the [OAPEN library](https://library.oapen.org/handle/20.500.12657/26040); the print edition is from [MIT Press](https://mitpress.mit.edu/9780262037310/elements-of-causal-inference/)."
