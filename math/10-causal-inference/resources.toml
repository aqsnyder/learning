[[groups.items]]
id = "applied-causal-inference-powered-by-ml"
title = "Applied Causal Inference Powered by ML and AI"
authors = "Victor Chernozhukov, Christian Hansen, Nathan Kallus, Martin Spindler, Vasilis Syrgkanis"
year = "2024"
type = "book"
access = "free"
level = "advanced"
url = "https://arxiv.org/abs/2403.02467"
link_text = "arXiv"
description = "Free book (arXiv, March 2024) on combining machine learning with causal inference: structural equation models, DAGs and structural causal models, and double/debiased machine learning for estimating effects with flexible predictors. The current reference for judging causal-ML estimation claims; read it after *What If* (Practice 3e)."
verified = 2026-10-21
