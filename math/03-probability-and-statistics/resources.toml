[[groups]]

[[groups.items]]
id = "statistics-110-probability"
title = "Statistics 110: Probability"
authors = "Joe Blitzstein"
year = "2006–"
type = "course"
access = "free"
level = "beginner"
marks = ["core"]
url = "https://stat110.hsites.harvard.edu/"
link_text = "Course site"
more_links = [{ text = "Lecture videos (YouTube)", url = "https://www.youtube.com/playlist?list=PLLVplP8OIVc8EktkrD3Q8td0GmId7DjW0" }]
description = "Joe Blitzstein's Harvard probability course (taught every year since 2006): recorded lectures, strategic practice problems with solutions, handouts, and the free textbook. Covers conditioning and Bayes' rule, random variables and expectation, the main distributions, the law of large numbers and the CLT, and Markov chains, built through stories and strategic problem-solving."
verified = 2026-10-21

[[groups.items]]
id = "all-of-statistics-a-concise-course-in"
title = "All of Statistics: A Concise Course in Statistical Inference"
authors = "Larry Wasserman"
year = "2004"
type = "book"
access = "paid"
level = "intermediate"
marks = ["core"]
description = "Covers probability, statistical inference, Bayesian methods, and nonparametric statistics in one dense but accessible volume. The ideal single reference for a mathematically mature reader."

[[groups.items]]
id = "introduction-to-probability"
title = "Introduction to Probability"
authors = "Joseph K. Blitzstein, Jessica Hwang"
year = "2019"
type = "book"
access = "free"
level = "beginner"
url = "https://probabilitybook.net"
link_text = "Free PDF"
description = "The Stat 110 textbook, 2nd edition (Chapman & Hall/CRC, 2019); the authors host the free PDF at this address (it opens a Google Drive file). Clear exposition with strategic exercises on counting, conditioning, distributions, inequalities and limit theorems, and Markov chains and MCMC, which Practice 1, 2 and 5 cite."
verified = 2026-10-21

[[groups.items]]
id = "introduction-to-probability-and"
title = "Introduction to Probability and Statistics for Engineers and Scientists"
authors = "Sheldon M. Ross"
year = "2020"
type = "book"
access = "paid"
level = "beginner"
url = "https://shop.elsevier.com/books/introduction-to-probability-and-statistics-for-engineers-and-scientists/ross/978-0-12-824346-6"
link_text = "Elsevier"
description = "Applied probability and statistics with an engineering focus, 6th edition (Elsevier, 2020). Good for building computational fluency alongside theory; Practice 3 uses it for characterizing noise."
verified = 2026-10-21

[[groups.items]]
id = "statquest"
title = "StatQuest — Statistics Fundamentals"
authors = "Josh Starmer (StatQuest)"
type = "video-series"
access = "free"
level = "beginner"
url = "https://www.youtube.com/playlist?list=PLblh5JKOoLUK0FLuzwntyYI10UQFUhsY9"
link_text = "Playlist"
more_links = [{ text = "Q–Q plots", url = "https://www.youtube.com/watch?v=okjYjClSjOg" }, { text = "Standard deviation vs standard error", url = "https://www.youtube.com/watch?v=A82brFpdr9g" }]
