[[groups.items]]
id = "bayesian-data-analysis"
title = "Bayesian Data Analysis"
authors = "Andrew Gelman et al."
year = "2013"
type = "book"
access = "free"
level = "advanced"
url = "https://sites.stat.columbia.edu/gelman/book/"
link_text = "Link"
description = "The definitive reference for applied Bayesian statistics. Covers hierarchical models, MCMC, model checking, and practical Bayesian workflow. The 3rd-edition PDF is free for non-commercial use on the book page."
verified = 2026-10-13

[[groups.items]]
id = "introduction-to-probability-models"
title = "Introduction to Probability Models"
authors = "Sheldon M. Ross"
year = "2023"
type = "book"
access = "paid"
level = "intermediate"
url = "https://shop.elsevier.com/books/introduction-to-probability-models/ross/978-0-443-18761-2"
link_text = "Elsevier"
description = "A focused treatment of stochastic processes, 13th edition (Elsevier, 2023): Markov chains, Poisson processes, queueing and renewal theory. Practice 5 uses its Markov-chain chapters; the background for MCMC and diffusion models."
verified = 2026-10-21

[[groups.items]]
id = "mit-6-041-probabilistic-systems-analysis"
title = "MIT 6.041SC Probabilistic Systems Analysis and Applied Probability"
authors = "John Tsitsiklis"
year = "2013"
type = "course"
access = "free"
level = "beginner"
url = "https://ocw.mit.edu/courses/6-041sc-probabilistic-systems-analysis-and-applied-probability-fall-2013/"
link_text = "MIT OCW"
description = "MIT's probability course in OCW Scholar format (Fall 2013): lecture videos, problem-solving videos, and problem sets and exams with solutions, in four units (discrete models, general random variables, random processes, laws of large numbers and inference). An engineering-oriented complement to Stat 110."
verified = 2026-10-21

[[groups.items]]
id = "probability-theory-the-logic-of-science"
title = "Probability Theory: The Logic of Science"
authors = "E. T. Jaynes (ed. G. Larry Bretthorst)"
year = "2003"
type = "book"
access = "paid"
level = "advanced"
url = "https://www.cambridge.org/core/books/probability-theory/9CA08E224FF30123304E6D8935CF1A99"
link_text = "Cambridge UP"
description = "Jaynes's argument for probability as extended logic, edited by G. Larry Bretthorst (Cambridge University Press, 2003). Influential and thought-provoking; read it for perspective on Bayesian reasoning, not as a first text."
verified = 2026-10-21

[[groups.items]]
id = "introduction-to-stochastic-processes"
title = "Introduction to Stochastic Processes"
authors = "Gregory F. Lawler"
year = "2006"
type = "book"
access = "paid"
level = "advanced"
url = "https://www.routledge.com/Introduction-to-Stochastic-Processes/Lawler/p/book/9781584886518"
link_text = "CRC Press"
description = "A rigorous short course, 2nd edition (Chapman & Hall/CRC Probability Series, 2006): finite, countable and continuous-time Markov chains, optimal stopping, martingales, renewal processes, reversible chains, Brownian motion and stochastic integration. The step from Ross to diffusion models and stochastic calculus."
verified = 2026-10-21

[[groups.items]]
id = "statistical-rethinking-2024-course"
title = "Statistical Rethinking (2024 course)"
authors = "Richard McElreath"
year = "2024"
type = "course"
access = "free"
level = "intermediate"
url = "https://github.com/rmcelreath/stat_rethinking_2024"
link_text = "Link"
description = "The best on-ramp to applied Bayesian modeling: causal DAGs, multilevel models, and MCMC taught through simulation, with free recorded lectures and course materials (pairs with the book's 2nd edition, CRC 2020). Do this before Gelman's BDA."
verified = 2026-10-13

[[groups.items]]
id = "kalman-and-bayesian-filters-in-python"
title = "Kalman and Bayesian Filters in Python"
authors = "Roger Labbe"
year = "2015"
type = "book"
access = "free"
level = "intermediate"
url = "https://github.com/rlabbe/Kalman-and-Bayesian-Filters-in-Python"
link_text = "Link"
description = "Free, CC-licensed Jupyter-notebook book that builds the g-h filter, Kalman, extended/unscented Kalman, and particle filters up from Bayes' rule. Bayesian inference applied to noisy sensors — directly usable for sensor fusion and measurement work on embedded systems."
verified = 2026-10-13
