[[groups.items]]
id = "topology-and-data"
title = "Topology and Data"
authors = "Gunnar Carlsson"
year = "2009"
type = "paper"
access = "free"
url = "https://doi.org/10.1090/S0273-0979-09-01249-X"
link_text = "Link"
description = "Survey paper on topological data analysis (TDA), *Bulletin of the AMS*. Connects persistent homology to practical data analysis. Bridge from theory to applications."
verified = 2026-10-13

[[groups.items]]
id = "introduction-to-topological-data-analysis"
title = "An Introduction to Topological Data Analysis: Fundamental and Practical Aspects for Data Scientists"
authors = "Frédéric Chazal, Bertrand Michel"
year = "2021"
type = "paper"
access = "free"
marks = ["core"]
url = "https://doi.org/10.3389/frai.2021.667963"
link_text = "Frontiers in AI"
more_links = [{ text = "arXiv", url = "https://arxiv.org/abs/1710.04019" }]
description = "Open-access tutorial survey written for non-experts (*Frontiers in Artificial Intelligence* 4, 2021; CC BY 4.0): simplicial complexes, persistent homology and persistence diagrams, the bottleneck distance and the stability theorem, confidence regions for telling topological signal from noise, and a practical introduction to the GUDHI Python library. The approachable core reading for Practice 4."
verified = 2026-10-21
