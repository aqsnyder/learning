[[groups.items]]
id = "a-new-kind-of-science-wolfram-physics"
title = "A New Kind of Science"
authors = "Stephen Wolfram"
year = "2002"
type = "book"
access = "free"
level = "intermediate"
url = "https://www.wolframscience.com/nks/"
link_text = "wolframscience.com"
more_links = [{ text = "Wolfram Physics Project (2020–)", url = "https://www.wolframphysics.org/" }]
description = "**Speculative — not accepted mathematics or physics; read critically.** Wolfram's book, free to read online, argues that simple programs such as cellular automata generate much of nature's complexity. For Practice 5: Ch. 2 (\"The Crucial Experiment\") and Ch. 3 for the elementary cellular automata, Rule 30 among them; Ch. 11 for universality and the Rule 110 automaton (whose universality proof is Matthew Cook's); Ch. 12 for the Principle of Computational Equivalence and \"computational irreducibility\" (many systems can't be predicted faster than by running them), which are conjectures, not theorems. The second link, the Wolfram Physics Project, proposes that spacetime and quantum mechanics emerge from hypergraph rewriting, with the \"ruliad\" as the limit of all possible computations; it has produced no experimentally confirmed prediction that distinguishes it from existing theories and remains outside mainstream physics. Read Aaronson's review alongside. Also used in physics/11 and philosophy/03."
verified = 2026-10-21

[[groups.items]]
id = "book-review-a-new-kind-of-science"
title = "Book Review: 'A New Kind of Science'"
authors = "Scott Aaronson"
year = "2002"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/quant-ph/0206089"
link_text = "arXiv"
description = "A complexity theorist's critical review of NKS, focused on computational complexity and fundamental physics: it takes up some of Wolfram's questions with standard techniques of theoretical computer science, and shows that his proposed deterministic model underlying quantum mechanics cannot be made compatible with both special relativity and Bell-inequality violations. The essential counterweight to the entry above. Also used in physics/11 and philosophy/03."
verified = 2026-10-21

[[groups.items]]
id = "mathematics-in-lean"
title = "Mathematics in Lean"
authors = "Jeremy Avigad, Patrick Massot"
year = "2025"
type = "book"
access = "free"
level = "intermediate"
url = "https://leanprover-community.github.io/mathematics_in_lean/"
link_text = "Link"
description = "The standard hands-on introduction to formalizing real mathematics in Lean 4 and its Mathlib library, from logic and sets through algebra, topology, and analysis. Continue here after the Lean material in Section 00 — machine-checked proof is where mathematics and AI now meet."
verified = 2026-10-13

[[groups.items]]
id = "mathematical-exploration-and-discovery"
title = "Mathematical Exploration and Discovery at Scale"
authors = "Bogdan Georgiev, Javier Gómez-Serrano, Terence Tao, Adam Zsolt Wagner"
year = "2025"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/2511.02864"
link_text = "Link"
description = "Mathematicians including Terence Tao test DeepMind's AlphaEvolve (LLM-guided evolutionary search) on 67 problems in analysis, combinatorics, geometry, and number theory: it matched most best-known results, improved several, and was paired with Deep Think and AlphaProof to generate proofs. A concrete, expert-written picture of what AI currently adds to mathematical research."
verified = 2026-10-13
