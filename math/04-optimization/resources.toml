[[groups.items]]
id = "introductory-lectures-on-stochastic"
title = "Introductory Lectures on Stochastic Optimization"
authors = "John C. Duchi"
year = "2018"
type = "book"
access = "free"
url = "https://web.stanford.edu/~jduchi/pcmi.html"
link_text = "Link"
description = "Lecture notes covering stochastic gradient methods with convergence analysis. Bridges theory and practice. Published in *The Mathematics of Data* (IAS/Park City Mathematics Series, AMS, 2018); the author's page has the free manuscript PDF plus the exercise data and MATLAB/Julia starter code."
verified = 2026-10-13

[[groups.items]]
id = "adam-a-method-for-stochastic"
