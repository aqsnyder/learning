authors = "Diederik Kingma, Jimmy Ba"
year = "2014"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/1412.6980"
link_text = "Link"
description = "The Adam optimizer paper — the most widely used optimizer in deep learning. Understanding its design illuminates optimization in practice."
verified = 2026-10-13

[[groups.items]]
id = "first-order-methods-in-optimization"
title = "First-Order Methods in Optimization"
authors = "Amir Beck"
year = "2017"
type = "book"
description = "Rigorous treatment of proximal methods, ADMM, and first-order algorithms. Advanced but essential for optimization research."

[[groups.items]]
id = "algorithms-for-optimization"
title = "Algorithms for Optimization"
authors = "Mykel Kochenderfer, Tim Wheeler"
year = "2019"
type = "book"
access = "free"
url = "https://algorithmsbook.com/optimization/"
link_text = "Link"
description = "Broad, code-first survey (Julia) of the methods engineers reach for when problems aren't convex or differentiable: derivative-free and stochastic search, population methods, surrogate models, multi-objective optimization, and optimization under uncertainty. Free PDF (CC BY-NC-ND). The book site also links a PDF of the 2nd edition, whose print release it lists for 5 January 2027 (checked October 2026)."
verified = 2026-10-13
