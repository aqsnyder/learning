# Resources for: Philosophy of AI
# Edit this file, then run `python tools/build.py` to regenerate README.md, PROGRESS.md and the indexes.
# Field reference: tools/README.md

[[groups]]
outro = '''
**Also used here (tracked in its home section):** Searle, "Minds, Brains, and Programs" ([Section 03](../03-computation-and-mind/README.md)) for the Chinese Room, the systems and robot replies, and Searle's claim that syntax is not sufficient for semantics — the most influential objection to strong AI (Practices 4 and 5, Check Yourself 5 and 7).

**Also used here (tracked in its home section):** Dreyfus, *What Computers Still Can't Do* ([Section 04](../04-intelligence-and-understanding/README.md)) for the phenomenological critique of AI: common-sense understanding needs embodied know-how that can't be captured in rules or representations — Dreyfus's criterion in Practice 5.

> **See also:** [Section 12 — Philosophy of Science and Scientific Reasoning](../12-philosophy-of-science/README.md), for the methodology behind this section's mini-project: what makes a prediction a real test, severe testing, and whether a benchmark measures the construct it claims to.
'''

[[groups.items]]
id = "computing-machinery-and-intelligence"
title = "Computing Machinery and Intelligence"
authors = "Alan Turing"
year = "1950"
type = "paper"
marks = ["core"]
url = "https://academic.oup.com/mind/article/LIX/236/433/986238"
link_text = "Link"
description = "*Mind* 59 (236): 433–460. The paper that asked \"Can machines think?\" and proposed the imitation game (Turing Test), with replies to nine objections and a fifty-year prediction. Still the essential starting point for philosophy of AI; every argument in this section is in dialogue with Turing. OUP's article page showed the full text when checked (October 2026); the PDF is for subscribers. Also used in ml/00."
access = "partial"
verified = 2026-10-21

[[groups.items]]
id = "the-symbol-grounding-problem"
title = "The Symbol Grounding Problem"
authors = "Stevan Harnad"
year = "1990"
type = "paper"
url = "https://doi.org/10.1016/0167-2789(90)90087-6"
link_text = "Link"
description = "How do symbols in a formal system get their meaning? Harnad argues that symbols must be grounded in sensorimotor experience — a problem AI has yet to fully solve."
verified = 2026-10-13

[[groups.items]]
id = "artificial-intelligence"
title = "Artificial Intelligence"
authors = "Selmer Bringsjord, Naveen Sundar Govindarajulu"
year = "2018"
type = "encyclopedia"
access = "free"
url = "https://plato.stanford.edu/entries/artificial-intelligence/"
link_text = "SEP"
description = "Stanford Encyclopedia of Philosophy survey of what AI is, its main approaches and their history, and the philosophy of AI: §8.1 \"Strong\" versus \"Weak\" AI (used in Practice 5), §8.2 the Chinese Room and §8.3 the Gödelian argument. First published in 2018, before today's large language models; read the LLM papers below for the current debate."
verified = 2026-10-21

[[groups.items]]
id = "the-turing-test"
title = "The Turing Test"
authors = "Graham Oppy, David Dowe"
year = "2003, rev. 2021"
type = "encyclopedia"
access = "free"
url = "https://plato.stanford.edu/entries/turing-test/"
link_text = "SEP"
description = "Stanford Encyclopedia of Philosophy entry on Turing's imitation game: how to read it, his replies to the objections, his predictions, and the later criticisms of the test. Context for Practice 1."
verified = 2026-10-21

[[groups.items]]
id = "climbing-towards-nlu-on-meaning-form-and"
title = "Climbing towards NLU: On Meaning, Form, and Understanding in the Age of Data"
authors = "Emily Bender, Alexander Koller"
year = "2020"
type = "paper"
marks = ["core"]
url = "https://doi.org/10.18653/v1/2020.acl-main.463"
link_text = "Link"
description = "ACL 2020 paper, open access in the ACL Anthology. The \"octopus test\": a system trained only on linguistic form has no way to learn meaning, understood as the relation between form and something outside language. A modern update to the symbol grounding debate, and the model for this section's mini-project. This is its home entry; [Section 08](../08-language-and-meaning/README.md) also uses it."
access = "free"
verified = 2026-10-13

[[groups.items]]
id = "on-the-dangers-of-stochastic-parrots"
title = "On the Dangers of Stochastic Parrots: Can Language Models Be Too Big?"
authors = "Emily M. Bender, Timnit Gebru, Angelina McMillan-Major, Shmargaret Shmitchell"
year = "2021"
type = "paper"
url = "https://doi.org/10.1145/3442188.3445922"
link_text = "Link"
description = "Mainly a risk paper — environmental and financial costs, biases baked into huge undocumented training sets — that also argues LMs stitch together linguistic form without reference to meaning (\"stochastic parrots\"), so fluent output invites people to ascribe understanding and intent that isn't there. Essential context for contemporary AI philosophy (and Section 06)."
verified = 2026-10-13

[[groups.items]]
id = "the-debate-over-understanding-in-ai-s"
title = "The Debate Over Understanding in AI's Large Language Models"
authors = "Melanie Mitchell, David C. Krakauer"
year = "2023"
type = "paper"
access = "free"
marks = ["core"]
url = "https://arxiv.org/abs/2210.13966"
link_text = "Link"
description = "Even-handed *PNAS* survey of both camps in the \"do LLMs understand?\" debate, arguing that we need a new science of intelligence to say what kinds of understanding different systems have. Read right after Bender & Koller for balance."
verified = 2026-10-13

[[groups.items]]
id = "the-intentional-stance"
title = "The Intentional Stance"
authors = "Daniel C. Dennett"
year = "1987"
type = "book"
description = "Dennett's view that to have beliefs and desires is to be a system whose behavior is reliably predictable by treating it as a rational agent — the intentional stance — rather than by its physical makeup or its design. The classic philosophical license, and its limits, for saying an LLM agent \"wants\" or \"believes\" something; read it before Shanahan, who urges restraint."

[[groups.items]]
id = "talking-about-large-language-models"
title = "Talking About Large Language Models"
authors = "Murray Shanahan"
year = "2022"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/2212.03551"
link_text = "Link"
description = "Argues that words like \"knows,\" \"believes,\" and \"thinks\" mislead when applied to LLMs, and urges us to keep restating what these systems actually do. A practical antidote to anthropomorphism that doesn't dismiss the systems."
verified = 2026-10-13

[[groups.items]]
id = "a-philosophical-introduction-to-language"
title = "A Philosophical Introduction to Language Models — Part I: Continuity With Classic Debates"
authors = "Raphaël Millière, Cameron Buckner"
year = "2024"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/2401.03910"
link_text = "Link"
description = "The best philosophical primer on LLMs: how they work and how their successes bear on long-standing debates about neural networks, compositionality, language acquisition, meaning, grounding, and cultural knowledge. Ties this section back to Sections 03 and 08."
verified = 2026-10-13
