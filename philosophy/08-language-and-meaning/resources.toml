# Field reference: tools/README.md

[[groups]]

[[groups.items]]
id = "philosophical-investigations-selections"
title = "Philosophical Investigations (selections)"
authors = "Ludwig Wittgenstein"
year = "1953"
type = "book"
access = "paid"
level = "advanced"
marks = ["core"]
description = "The most influential work in 20th-century philosophy of language. Introduces language games, family resemblance, and the private language argument. Read §§1-133 and §§243-315 at minimum."

[[groups.items]]
id = "climbing-towards-nlu-on-meaning-form-and"
title = "Climbing towards NLU: On Meaning, Form, and Understanding in the Age of Data"
authors = "Emily Bender, Alexander Koller"
year = "2020"
type = "paper"
marks = ["core"]
url = "https://doi.org/10.18653/v1/2020.acl-main.463"
link_text = "Link"
description = "The \"Octopus Test\" — argues that a system trained only on form (text) cannot learn meaning. Essential for evaluating LLM understanding."
verified = 2026-10-13

[[groups.items]]
id = "how-to-do-things-with-words"
title = "How to Do Things with Words"
authors = "J.L. Austin"
year = "1962"
type = "book"
description = "Introduces speech act theory: language isn't just about describing the world but performing actions (promising, requesting, asserting). Foundational for pragmatics."

[[groups.items]]
id = "logic-and-conversation"
title = "Logic and Conversation"
authors = "H.P. Grice"
year = "1975"
type = "paper"
description = "Introduces the cooperative principle and conversational implicature — how we communicate more than we literally say. Crucial for understanding how meaning exceeds syntax."

[[groups.items]]
id = "speech-acts-an-essay-in-the-philosophy"
title = "Speech Acts: An Essay in the Philosophy of Language"
authors = "John Searle"
year = "1969"
type = "book"
description = "Extends Austin's speech act theory. Relevant because Searle later uses these ideas in the Chinese Room argument."

[[groups.items]]
id = "theories-of-meaning"
title = "Theories of Meaning"
authors = "SEP"
type = "encyclopedia"
url = "https://plato.stanford.edu/entries/meaning/"
link_text = "SEP"
description = "Jeff Speaks's entry (first published 2010, revised 2024). It separates semantic theories, which say what expressions mean (theories of reference; Fregean, Russellian and possible-worlds semantics; Davidsonian, inferentialist and dynamic alternatives), from metasemantic theories of what gives expressions their meanings (the Gricean program, convention, causal origin, rules of use). SEP has no general \"Philosophy of Language\" entry; this is its broadest map of the field."
verified = 2026-10-13

[[groups.items]]
id = "sense-and-reference-uber-sinn-und"
title = "Sense and Reference (\"Über Sinn und Bedeutung\")"
authors = "Gottlob Frege"
year = "1892"
type = "paper"
url = "https://doi.org/10.2307/2181485"
link_text = "Link"
description = "The founding text of the theory of reference. Frege distinguishes an expression's sense (its mode of presentation) from its reference (what it picks out), to explain why \"the morning star is the evening star\" is informative while \"the morning star is the morning star\" is not. The link is Max Black's English translation, *The Philosophical Review* 57(3), 1948. Ask of an LLM: do its representations have reference, or only something like sense?"
verified = 2026-10-13

[[groups.items]]
id = "the-meaning-of-meaning"
title = "The Meaning of \"Meaning\""
authors = "Hilary Putnam"
year = "1975"
type = "paper"
url = "https://hdl.handle.net/11299/185225"
link_text = "Link"
description = "The Twin Earth argument: two speakers in the same internal state can mean different things by \"water\", because meaning depends on the environment and on the linguistic community (\"meanings just ain't in the head\"), and the division of linguistic labor. Content externalism in its founding form, and the background to whether a model trained on human text inherits reference from the people who wrote it (compare Coelho Mollo & Millière). *Minnesota Studies in the Philosophy of Science* 7, pp. 131–193; free PDF from the University of Minnesota Digital Conservancy."
verified = 2026-10-13

[[groups.items]]
id = "wittgenstein"
title = "Wittgenstein"
authors = "SEP"
type = "encyclopedia"
url = "https://plato.stanford.edu/entries/wittgenstein/"
link_text = "SEP"
description = "Detailed overview of Wittgenstein's philosophy — early (Tractatus) and late (Investigations)."
verified = 2026-10-13

[[groups.items]]
id = "language-models-as-agent-models"
title = "Language Models as Agent Models"
authors = "Jacob Andreas"
year = "2022"
type = "paper"
url = "https://arxiv.org/abs/2212.01681"
link_text = "Link"
description = "Argues that LMs are, in a narrow sense, models of intentional communication: to predict the next word they infer and represent properties of the agent likely to have produced the text (such as its communicative intentions), which then shape what they generate. A partial counterpoint to Bender & Koller."
verified = 2026-10-13

[[groups.items]]
id = "distributional-structure"
title = "Distributional Structure"
authors = "Zellig S. Harris"
year = "1954"
type = "paper"
url = "https://doi.org/10.1080/00437956.1954.11659520"
link_text = "Link"
description = "The founding statement of the distributional hypothesis — that differences in meaning correlate with differences in the contexts words occur in. The linguistic idea behind word embeddings and, ultimately, LLMs; essential background to whether \"form alone\" can carry meaning."
verified = 2026-10-13

[[groups.items]]
id = "the-vector-grounding-problem"
title = "The Vector Grounding Problem"
authors = "Dimitri Coelho Mollo, Raphaël Millière"
year = "2023"
type = "paper"
url = "https://arxiv.org/abs/2304.01481"
link_text = "Link"
description = "Updates Harnad's symbol grounding problem for neural networks and argues that LLMs can achieve referential grounding — internal states that refer to things in the world — through causal-informational relations and selection history, even without embodiment or multimodality. A rigorous philosophical reply to the Octopus argument."
verified = 2026-10-13
