[[groups]]

[[groups.items]]
id = "elbow-room-the-varieties-of-free-will"
title = "Elbow Room: The Varieties of Free Will Worth Wanting"
authors = "Daniel C. Dennett"
year = "1984 (new ed. 2015)"
type = "book"
access = "paid"
level = "intermediate"
marks = ["core"]
url = "https://doi.org/10.7551/mitpress/10470.001.0001"
link_text = "MIT Press"
description = "The best-known defense of compatibilism — the view that free will is compatible with determinism. Dennett (1942–2024) argues we should stop worrying about metaphysical free will and focus on the kinds of freedom that actually matter. The link is MIT Press's 2015 new edition."
verified = 2026-10-21

[[groups.items]]
id = "freedom-evolves"
title = "Freedom Evolves"
authors = "Daniel C. Dennett"
year = "2004"
type = "book"
access = "paid"
level = "intermediate"
url = "https://www.penguinrandomhouse.com/books/288114/freedom-evolves-by-daniel-c-dennett/"
link_text = "Penguin"
description = "Sequel to *Elbow Room*. Argues that free will is an evolved capacity, not a metaphysical mystery, integrating evolutionary biology with philosophy; includes the Game of Life demonstrations and the discussion of Libet used in Practice 3 and 4. The link is the Penguin Books paperback (January 2004)."
verified = 2026-10-21

[[groups.items]]
id = "time-of-conscious-intention-to-act-in"
title = "Time of Conscious Intention to Act in Relation to Onset of Cerebral Activity (Readiness-Potential): The Unconscious Initiation of a Freely Voluntary Act"
authors = "Benjamin Libet, Curtis A. Gleason, Elwood W. Wright, Dennis K. Pearl"
year = "1983"
type = "paper"
access = "paid"
url = "https://doi.org/10.1093/brain/106.3.623"
link_text = "Link"
description = "Famous experiment showing brain activity precedes conscious awareness of the decision to act. Widely cited as evidence against free will (though interpretations vary — see Schurger et al. 2012 below for the leading reinterpretation of the readiness potential). *Brain* 106(3): 623–642."
verified = 2026-10-21

[[groups.items]]
id = "alternate-possibilities-and-moral"
title = "Alternate Possibilities and Moral Responsibility"
authors = "Harry Frankfurt"
year = "1969"
type = "paper"
access = "paid"
url = "https://doi.org/10.2307/2023833"
link_text = "Link"
description = "Frankfurt cases: you can be morally responsible even if you couldn't have done otherwise. A landmark paper that reshaped the free will debate."
verified = 2026-10-13

[[groups.items]]
id = "freedom-and-resentment"
title = "Freedom and Resentment"
authors = "P. F. Strawson"
year = "1962"
type = "paper"
access = "paid"
url = "https://doi.org/10.4324/9780203882566"
link_text = "Routledge (reprint)"
description = "Moves the debate from metaphysics to practice: holding people responsible consists in the \"reactive attitudes\" (resentment, gratitude, indignation) built into ordinary relationships, and Strawson argues that no general theoretical thesis such as determinism could rationally require us to give them up. The source of the reactive-attitudes criterion in this section's mini-project. Published in *Proceedings of the British Academy* 48 (1962); the link is the title essay of Strawson's *Freedom and Resentment and Other Essays* (Routledge, 2008 edition)."
verified = 2026-10-21

[[groups.items]]
id = "determined-a-science-of-life-without"
title = "Determined: A Science of Life without Free Will"
authors = "Robert M. Sapolsky"
year = "2023"
type = "book"
access = "paid"
level = "beginner"
url = "https://www.penguinrandomhouse.com/books/592344/determined-by-robert-m-sapolsky"
link_text = "Penguin"
description = "Sapolsky argues (against Dennett) that free will is an illusion — biology, upbringing, and circumstance determine everything. The most prominent recent scientific case against free will; read it alongside Mitchell's *Free Agents* (below), a neuroscientist's opposing case. Hardcover October 2023; paperback October 2024."
verified = 2026-10-21

[[groups.items]]
id = "an-accumulator-model-for-spontaneous"
title = "An Accumulator Model for Spontaneous Neural Activity Prior to Self-Initiated Movement"
authors = "Aaron Schurger, Jacobo D. Sitt, Stanislas Dehaene"
year = "2012"
type = "paper"
access = "free"
url = "https://doi.org/10.1073/pnas.1210467109"
link_text = "Link"
description = "Shows that the readiness potential in Libet-style experiments can arise from spontaneous neural fluctuations drifting to a threshold, rather than from an unconscious \"decision.\" The key reinterpretation that undercuts the popular anti-free-will reading of Libet."
verified = 2026-10-21

[[groups.items]]
id = "free-agents-how-evolution-gave-us-free"
title = "Free Agents: How Evolution Gave Us Free Will"
authors = "Kevin J. Mitchell"
year = "2023"
type = "book"
access = "paid"
level = "intermediate"
url = "https://press.princeton.edu/books/hardcover/9780691226231/free-agents"
link_text = "Link"
description = "A neuroscientist and geneticist argues that organisms are genuine agents, tracing how evolution built the capacity for choice from the origin of life to nervous systems. The scientific counterweight to Sapolsky's *Determined*, published the same year."
verified = 2026-10-13

[[groups.items]]
id = "just-deserts-debating-free-will"
title = "Just Deserts: Debating Free Will"
authors = "Daniel C. Dennett, Gregg D. Caruso"
year = "2021"
type = "book"
access = "paid"
level = "intermediate"
url = "https://www.wiley-vch.de/en/areas-interest/humanities-social-sciences/just-deserts-978-1-5095-4575-9"
link_text = "Link"
description = "A book-length debate in three extended exchanges between a compatibilist (Dennett) and a free-will skeptic who defends hard incompatibilism (Caruso), centered on whether anyone ever deserves blame or punishment. The best single source for practicing both steelmen, in the authors' own words."
verified = 2026-10-13

[[groups.items]]
id = "free-will"
title = "Free Will"
authors = "Christopher Franklin"
year = "2002 (rev. 2022)"
type = "encyclopedia"
access = "free"
url = "https://plato.stanford.edu/entries/freewill/"
link_text = "SEP"
description = "Stanford Encyclopedia of Philosophy entry (first published 2002, substantively revised November 2022): a survey of the free will debate — libertarianism, hard determinism, compatibilism — with the Consequence Argument in §2.2, \"The Freedom to Do Otherwise\"."
verified = 2026-10-21

[[groups.items]]
id = "compatibilism"
title = "Compatibilism"
authors = "D. Justin Coates"
year = "2004 (rev. 2024)"
type = "encyclopedia"
access = "free"
url = "https://plato.stanford.edu/entries/compatibilism/"
link_text = "SEP"
description = "Stanford Encyclopedia of Philosophy entry (first published 2004, substantively revised April 2024) on the view that free will and determinism can coexist: the Consequence Argument and how powerlessness is said to transfer (§3.1), Frankfurt's challenge to the Principle of Alternate Possibilities (§3.2), and reasons-responsive compatibilism (§4.4), the criterion used in the mini-project."
verified = 2026-10-21

