# Field reference: tools/README.md

[[groups]]
outro = '''
> **See also:** [ML Section 12](../../ml/12-interpretability-and-alignment/README.md). It lists Gurnee, Sofroniew et al. (2026), *Verbalizable Representations Form a Global Workspace in Language Models*, an interpretability paper that borrows the "global workspace" framing for LLM internals. It is useful for testing how far workspace-style functional criteria (Dehaene; Butlin et al. in Section 11) carry over to machines. Keep in mind that a functional workspace is not evidence of phenomenal consciousness.

> **See also:** [Section 12 — Philosophy of Science and Scientific Reasoning](../12-philosophy-of-science/README.md), for the demarcation criteria (Popper, Kuhn, Lakatos) behind the IIT "pseudoscience" dispute and for reading the Cogitate result as a test of two research programmes.
'''

[[groups.items]]
id = "the-conscious-mind-in-search-of-a"
title = "The Conscious Mind: In Search of a Fundamental Theory"
authors = "David Chalmers"
year = "1996"
type = "book"
access = "paid"
level = "advanced"
marks = ["core"]
description = "Introduces the hard problem of consciousness and argues that consciousness cannot be reductively explained by physical science. Rigorous, systematic, and field-defining."

[[groups.items]]
id = "consciousness-explained"
title = "Consciousness Explained"
authors = "Daniel Dennett"
year = "1991"
type = "book"
access = "paid"
level = "intermediate"
marks = ["core"]
description = "Dennett's ambitious attempt to dissolve the hard problem. Argues consciousness is a \"user illusion\" generated by multiple cognitive drafts. Essential counterpoint to Chalmers."

[[groups.items]]
id = "facing-up-to-the-problem-of"
title = "Facing Up to the Problem of Consciousness"
authors = "David Chalmers"
year = "1995"
type = "paper"
url = "https://consc.net/papers/facing.html"
link_text = "Link"
description = "The paper that coined \"the hard problem\" (*Journal of Consciousness Studies* 2(3); free on Chalmers's site). Shorter and more accessible than the book — read this first."
verified = 2026-10-13

[[groups.items]]
id = "on-a-confusion-about-a-function-of"
title = "On a Confusion about a Function of Consciousness"
authors = "Ned Block"
year = "1995"
type = "paper"
url = "https://doi.org/10.1017/S0140525X00038188"
link_text = "Link"
description = "Crucial distinction between access consciousness (information available for reasoning) and phenomenal consciousness (subjective experience). Clarifies many debates."
verified = 2026-10-13

[[groups.items]]
id = "an-information-integration-theory-of"
title = "An Information Integration Theory of Consciousness"
authors = "Giulio Tononi"
year = "2004"
type = "paper"
url = "https://doi.org/10.1186/1471-2202-5-42"
link_text = "Link"
description = "Introduces Integrated Information Theory (IIT) — consciousness as integrated information (phi). A prominent but contested theory with strong philosophical implications: a 2023 open letter from 124 researchers labelled it pseudoscience, and the 2025 adversarial test (below) challenged one of its key predictions."
verified = 2026-10-13

[[groups.items]]
id = "the-feeling-of-life-itself-why"
title = "The Feeling of Life Itself: Why Consciousness Is Widespread but Can't Be Computed"
authors = "Christof Koch"
year = "2019"
type = "book"
description = "Accessible introduction to IIT from a leading neuroscientist and IIT proponent. Argues consciousness is a fundamental property of certain physical systems. Read alongside the critiques below."

[[groups.items]]
id = "consciousness"
title = "Consciousness"
authors = "SEP"
type = "encyclopedia"
access = "free"
url = "https://plato.stanford.edu/entries/consciousness/"
link_text = "SEP"
description = "Comprehensive overview of the philosophical landscape of consciousness studies."
verified = 2026-10-13

[[groups.items]]
id = "being-you-a-new-science-of-consciousness"
title = "Being You: A New Science of Consciousness"
authors = "Anil Seth"
year = "2021"
type = "book"
description = "Predictive processing account of consciousness from a leading neuroscientist. Accessible and contemporary."

[[groups.items]]
id = "the-hard-problem-of-consciousness"
title = "The Hard Problem of Consciousness"
authors = "IEP"
type = "encyclopedia"
access = "free"
url = "https://iep.utm.edu/hard-problem-of-conciousness/"
link_text = "IEP"
description = "Josh Weisberg's dedicated entry: Chalmers', Nagel's and Levine's formulations, why the problem arises, and the main responses (eliminativism, reductionism, mysterianism, dualism, panpsychism)."
verified = 2026-10-13

[[groups.items]]
id = "theories-of-consciousness"
title = "Theories of Consciousness"
authors = "Anil K. Seth, Tim Bayne"
year = "2022"
type = "paper"
marks = ["core"]
url = "https://www.nature.com/articles/s41583-022-00587-4"
link_text = "Link"
description = "*Nature Reviews Neuroscience* review comparing the four main families of scientific theories of consciousness — higher-order, global workspace, re-entry/predictive processing, and integrated information. The best single map of the science; read before the theory-specific items."
verified = 2026-10-13

[[groups.items]]
id = "consciousness-and-the-brain-deciphering"
title = "Consciousness and the Brain: Deciphering How the Brain Codes Our Thoughts"
authors = "Stanislas Dehaene"
year = "2014"
type = "book"
description = "Accessible account of global neuronal workspace theory and the experimental \"signatures\" of conscious access, from its leading proponent. IIT's main rival, and the other side of the 2025 adversarial test."

[[groups.items]]
id = "illusionism-as-a-theory-of-consciousness"
title = "Illusionism as a Theory of Consciousness"
authors = "Keith Frankish"
year = "2016"
type = "paper"
url = "https://www.ingentaconnect.com/content/imp/jcs/2016/00000023/f0020011/art00002"
link_text = "Link"
description = "Argues that phenomenal consciousness is an introspective illusion: the job is to explain why experiences *seem* to have ineffable qualitative properties (the \"illusion problem\"), not to explain those properties. The sharpest contemporary form of Dennett's position."
verified = 2026-10-13

[[groups.items]]
id = "consciousness-theory-slammed-as"
title = "Consciousness theory slammed as 'pseudoscience' — sparking uproar"
authors = "Mariana Lenharo (*Nature*)"
year = "2023"
type = "article"
url = "https://www.nature.com/articles/d41586-023-02971-1"
link_text = "Link"
description = "News account of the open letter, signed by 124 researchers, that labelled IIT \"pseudoscience,\" and the backlash it provoked. A live case study in what makes a theory of consciousness scientific."
verified = 2026-10-13

[[groups.items]]
id = "adversarial-testing-of-global-neuronal"
title = "Adversarial testing of global neuronal workspace and integrated information theories of consciousness"
authors = "Cogitate Consortium"
year = "2025"
type = "paper"
url = "https://www.nature.com/articles/s41586-025-08888-1"
link_text = "Link"
description = "Pre-registered \"adversarial collaboration\" testing rival predictions of IIT and GNWT with fMRI, MEG and intracranial EEG in 256 participants. Both theories were partly supported and both had key predictions challenged — IIT on sustained synchronization in posterior cortex, GNWT on prefrontal \"ignition.\""
verified = 2026-10-13
