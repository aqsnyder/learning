[[groups]]
outro = '''
> **See also:** [ML Section 12](../../ml/12-interpretability-and-alignment/README.md). It lists Gurnee, Sofroniew et al. (2026), *Verbalizable Representations Form a Global Workspace in Language Models*, an interpretability paper that borrows the "global workspace" framing for LLM internals. It is useful for testing how far workspace-style functional criteria (Dehaene; Butlin et al. in Section 11) carry over to machines. Keep in mind that a functional workspace is not evidence of phenomenal consciousness.

> **See also:** [Section 12 — Philosophy of Science and Scientific Reasoning](../12-philosophy-of-science/README.md), for the demarcation criteria (Popper, Kuhn, Lakatos) behind the IIT "pseudoscience" dispute and for reading the Cogitate result as a test of two research programmes.
'''

[[groups.items]]
id = "the-conscious-mind-in-search-of-a"
title = "The Conscious Mind: In Search of a Fundamental Theory"
authors = "David J. Chalmers"
year = "1996"
type = "book"
access = "paid"
level = "advanced"
marks = ["core"]
url = "https://global.oup.com/academic/product/the-conscious-mind-9780195117899"
link_text = "OUP"
description = "The full argument for the hard problem: consciousness cannot be reductively explained, as the conceivability of zombies shows, so a fundamental theory must take experience as basic. Practice 1 reconstructs its zombie argument. The link is OUP's 432-page paperback (1997) in the Philosophy of Mind series."
verified = 2026-10-21

[[groups.items]]
id = "consciousness-explained"
title = "Consciousness Explained"
authors = "Daniel C. Dennett"
year = "1991"
type = "book"
access = "paid"
level = "intermediate"
marks = ["core"]
url = "https://www.hachettebookgroup.com/titles/daniel-c-dennett/consciousness-explained/9780316439480/?lens=little-brown"
link_text = "Little, Brown"
description = "Dennett's attempt to dissolve the hard problem: there is no \"Cartesian theater\" where it all comes together, only parallel \"multiple drafts\", and the felt unity of experience is a kind of user illusion. The essential counterpoint to Chalmers; Practice 3 works through its color-phi chapter. Little, Brown's page lists the ebook and the trade paperback."
verified = 2026-10-21

[[groups.items]]
id = "facing-up-to-the-problem-of"
title = "Facing Up to the Problem of Consciousness"
authors = "David Chalmers"
year = "1995"
type = "paper"
url = "https://consc.net/papers/facing.html"
link_text = "Link"
description = "The paper that coined \"the hard problem\" (*Journal of Consciousness Studies* 2(3); free on Chalmers's site). Shorter and more accessible than the book — read this first."
access = "free"
verified = 2026-10-13

[[groups.items]]
id = "on-a-confusion-about-a-function-of"
title = "On a Confusion about a Function of Consciousness"
authors = "Ned Block"
year = "1995"
type = "paper"
url = "https://doi.org/10.1017/S0140525X00038188"
link_text = "Link"
description = "*Behavioral and Brain Sciences* 18(2). Draws the distinction between access consciousness (content poised for use in reasoning and the control of action and speech) and phenomenal consciousness (experience), and uses it to expose the \"target reasoning\" from blindsight to a function of consciousness. The source for Practice 2."
access = "paid"
verified = 2026-10-21

[[groups.items]]
id = "an-information-integration-theory-of"
title = "An Information Integration Theory of Consciousness"
authors = "Giulio Tononi"
year = "2004"
type = "paper"
url = "https://doi.org/10.1186/1471-2202-5-42"
link_text = "Link"
description = "Introduces Integrated Information Theory (IIT) — consciousness as integrated information (phi) — in open-access *BMC Neuroscience* 5. A prominent but contested theory with strong philosophical implications: a 2023 open letter from 124 researchers labelled it pseudoscience, and the 2025 adversarial test (below) challenged one of its key predictions."
access = "free"
verified = 2026-10-21

[[groups.items]]
id = "the-feeling-of-life-itself-why"
title = "The Feeling of Life Itself: Why Consciousness Is Widespread but Can't Be Computed"
authors = "Christof Koch"
year = "2019 (pb. 2020)"
type = "book"
access = "paid"
level = "beginner"
url = "https://mitpress.mit.edu/9780262539555/the-feeling-of-life-itself/"
link_text = "MIT Press"
description = "Accessible introduction to IIT from a leading neuroscientist and IIT proponent. Argues consciousness is a fundamental property of certain physical systems and that a digital simulation of a brain would not be conscious — the claim Practice 4 asks you to explain. Read alongside the critiques below. The link is the MIT Press paperback (2020, 280 pp.)."

[[groups.items]]
id = "consciousness"
title = "Consciousness"
authors = "Robert Van Gulick"
year = "2004, rev. 2014"
type = "encyclopedia"
access = "free"
url = "https://plato.stanford.edu/entries/consciousness/"
link_text = "SEP"
description = "Stanford Encyclopedia of Philosophy overview of the concepts, problems and theories of consciousness. §2.2 (\"State consciousness\") sets out access and phenomenal consciousness for Practice 2. Last substantively revised in 2014, so pair it with Seth & Bayne for the current science."
verified = 2026-10-21

[[groups.items]]
id = "being-you-a-new-science-of-consciousness"
title = "Being You: A New Science of Consciousness"
authors = "Anil Seth"
year = "2021"
type = "book"
access = "paid"
level = "beginner"
url = "https://www.penguinrandomhouse.com/books/566315/being-you-by-anil-seth/"
link_text = "Dutton"
description = "Predictive-processing account of consciousness and the self from a leading neuroscientist, co-author of the Seth & Bayne review below. Accessible and contemporary; it fills in one of the theory families in the Practice 5 matrix."
verified = 2026-10-21

[[groups.items]]
id = "the-hard-problem-of-consciousness"
title = "The Hard Problem of Consciousness"
authors = "Josh Weisberg"
type = "encyclopedia"
access = "free"
url = "https://iep.utm.edu/hard-problem-of-conciousness/"
link_text = "IEP"
description = "Internet Encyclopedia of Philosophy entry: Chalmers', Nagel's and Levine's formulations, why the problem arises, and the main responses (eliminativism, strong and weak reductionism, mysterianism, interactionist dualism, epiphenomenalism, dual-aspect theory and panpsychism). Practice 1 uses it to map replies to the zombie argument."
verified = 2026-10-21

[[groups.items]]
id = "theories-of-consciousness"
title = "Theories of Consciousness"
authors = "Anil K. Seth, Tim Bayne"
year = "2022"
type = "paper"
marks = ["core"]
url = "https://www.nature.com/articles/s41583-022-00587-4"
link_text = "Link"
description = "*Nature Reviews Neuroscience* 23(7) review comparing the four main families of scientific theories of consciousness — higher-order, global workspace, re-entry/predictive processing, and integrated information. The best single map of the science; read before the theory-specific items."
access = "paid"
verified = 2026-10-21

[[groups.items]]
id = "consciousness-and-the-brain-deciphering"
title = "Consciousness and the Brain: Deciphering How the Brain Codes Our Thoughts"
authors = "Stanislas Dehaene"
year = "2014"
type = "book"
access = "paid"
level = "beginner"
url = "https://www.penguinrandomhouse.com/books/308282/consciousness-and-the-brain-by-stanislas-dehaene/"
link_text = "Penguin"
description = "Accessible account of global neuronal workspace theory and the experimental \"signatures\" of conscious access, from its leading proponent. IIT's main rival, and the other side of the 2025 adversarial test. The link is the Penguin paperback (2014, 352 pp.)."
verified = 2026-10-21

[[groups.items]]
id = "illusionism-as-a-theory-of-consciousness"
title = "Illusionism as a Theory of Consciousness"
authors = "Keith Frankish"
year = "2016"
type = "paper"
url = "https://www.ingentaconnect.com/content/imp/jcs/2016/00000023/f0020011/art00002"
link_text = "Link"
description = "*Journal of Consciousness Studies* 23(11–12). Argues that phenomenal consciousness is an introspective illusion: the job is to explain why experiences *seem* to have ineffable qualitative properties (the \"illusion problem\"), not to explain those properties. The sharpest contemporary form of Dennett's position."
access = "paid"
verified = 2026-10-21

[[groups.items]]
id = "consciousness-theory-slammed-as"
title = "Consciousness theory slammed as 'pseudoscience' — sparking uproar"
authors = "Mariana Lenharo (*Nature*)"
year = "2023"
type = "article"
url = "https://www.nature.com/articles/d41586-023-02971-1"
link_text = "Link"
description = "News account of the open letter, signed by 124 researchers, that labelled IIT \"pseudoscience,\" and the backlash it provoked. A live case study in what makes a theory of consciousness scientific."
access = "paid"
verified = 2026-10-13

[[groups.items]]
id = "adversarial-testing-of-global-neuronal"
title = "Adversarial testing of global neuronal workspace and integrated information theories of consciousness"
authors = "Cogitate Consortium (Oscar Ferrante, Urszula Gorska-Klimowska, Simon Henin et al.)"
year = "2025"
type = "paper"
access = "free"
url = "https://www.nature.com/articles/s41586-025-08888-1"
link_text = "Link"
description = "*Nature* 642, open access. Pre-registered \"adversarial collaboration\" testing rival predictions of IIT and GNWT with fMRI, MEG and intracranial EEG in 256 participants. Both theories were partly supported and both had key predictions challenged — IIT on sustained synchronization in posterior cortex, GNWT on prefrontal \"ignition.\""
verified = 2026-10-21
