[[groups.items]]
id = "are-you-living-in-a-computer-simulation"
title = "Are You Living in a Computer Simulation?"
authors = "Nick Bostrom"
year = "2003"
type = "paper"
marks = ["core"]
url = "https://doi.org/10.1111/1467-9213.00309"
link_text = "Link"
description = "The simulation argument: at least one of three propositions must be true — civilizations go extinct before creating simulations, they choose not to, or we are almost certainly in a simulation. Elegant and unsettling."
verified = 2026-10-13

[[groups.items]]
id = "reality-virtual-worlds-and-the-problems"
title = "Reality+: Virtual Worlds and the Problems of Philosophy"
authors = "David J. Chalmers"
year = "2022"
type = "book"
access = "partial"
level = "beginner"
url = "https://consc.net/reality+/excerpt.pdf"
link_text = "Excerpt (author's site)"
description = "Chalmers argues that virtual worlds are genuine realities, not illusions, and that the simulation hypothesis is not a skeptical hypothesis: if we're in a simulation, things are still real. Published by W. W. Norton (2022); the link is the free excerpt (front matter and introduction) on the author's site."
verified = 2026-10-21

[[groups.items]]
id = "consciousness-in-artificial-intelligence"
title = "Consciousness in Artificial Intelligence: Insights from the Science of Consciousness"
authors = "Patrick Butlin, Robert Long, et al. (19 authors)"
year = "2023"
type = "paper"
access = "free"
marks = ["core"]
url = "https://arxiv.org/abs/2308.08708"
link_text = "Link"
description = "Report (August 2023) that derives \"indicator properties\" from leading scientific theories of consciousness (recurrent processing, global workspace, higher-order, predictive processing, attention schema) and assesses AI systems of the time against them: none is a strong candidate, but there are no obvious technical barriers to building systems that satisfy the indicators. A systematic, theory-by-theory treatment of AI consciousness that assumes computational functionalism as a working hypothesis."
verified = 2026-10-21

[[groups.items]]
id = "taking-ai-welfare-seriously"
title = "Taking AI Welfare Seriously"
authors = "Robert Long, Jeff Sebo, Patrick Butlin, et al. (incl. Jonathan Birch, David Chalmers)"
year = "2024"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/2411.00986"
link_text = "Link"
description = "Argues there is a realistic possibility that some AI systems will be conscious or robustly agentic in the near future, so AI companies should start now: acknowledge the issue, assess systems for welfare-relevant features, and prepare policies for treating them with appropriate moral concern. The ethical follow-on to Butlin et al."
verified = 2026-10-13

[[groups.items]]
id = "the-edge-of-sentience-risk-and"
title = "The Edge of Sentience: Risk and Precaution in Humans, Other Animals, and AI"
authors = "Jonathan Birch"
year = "2024"
type = "book"
access = "free"
level = "intermediate"
url = "https://academic.oup.com/book/57949"
link_text = "Free"
description = "A precautionary framework for evidence-based decisions under deep uncertainty about which beings are sentient: patients with severe brain injury, fetuses, lab-grown brain models, other animals, and AI systems. Free to read online (Oxford University Press). The policy companion to Butlin et al. and *Taking AI Welfare Seriously*."
verified = 2026-10-13

[[groups.items]]
id = "the-weirdness-of-the-world"
title = "The Weirdness of the World"
authors = "Eric Schwitzgebel"
year = "2024"
type = "book"
description = "Argues that reality is fundamentally strange — whether materialism or dualism is true, something deeply weird must be going on. Embraces philosophical uncertainty."

[[groups.items]]
id = "being-you-a-new-science-of-consciousness"
title = "Being You: A New Science of Consciousness"
authors = "Anil Seth"
year = "2021"
type = "book"
access = "paid"
level = "beginner"
url = "https://www.penguinrandomhouse.com/books/566315/being-you-by-anil-seth/"
link_text = "Penguin Random House"
description = "Seth's predictive-processing account of consciousness, which ties conscious experience to the living body: the \"biological view\" that Practice 3 sets against computational functionalism when asking whether a machine could be conscious."
verified = 2026-10-21

[[groups.items]]
id = "integrated-information-theory-iit-4-0"
title = "Integrated Information Theory (IIT) 4.0: Formulating the Properties of Phenomenal Existence in Physical Terms"
authors = "Larissa Albantakis, …, Giulio Tononi (16 authors)"
year = "2023"
type = "paper"
access = "free"
url = "https://doi.org/10.1371/journal.pcbi.1011465"
link_text = "PLOS Comput. Biol."
more_links = [{ text = "arXiv", url = "https://arxiv.org/abs/2212.14787" }]
description = "IIT's 2023 formulation (*PLOS Computational Biology* 19(10), October 2023; arXiv preprint December 2022): a mathematical theory of consciousness that makes specific predictions about which systems are conscious. Implications for AI consciousness (IIT implies that conventional digital computers are not conscious, whatever software they run). Contested: see the 2023 \"pseudoscience\" letter and the 2025 adversarial test in Section 02."
verified = 2026-10-21

[[groups.items]]
id = "could-a-large-language-model-be"
title = "Could a Large Language Model be Conscious?"
authors = "David Chalmers"
year = "2023"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/2303.07103"
link_text = "Link"
description = "Chalmers weighs reasons for thinking LLMs are conscious (self-reports, conversational ability, general intelligence) against reasons against (no recurrent processing, global workspace, or unified agency; doubts about embodiment and world-models), concludes current models are unlikely to be conscious, and asks what extended successors would need. Clear, short, and even-handed."
verified = 2026-10-13

[[groups.items]]
id = "life-3-0-being-human-in-the-age-of-ai"
title = "Life 3.0: Being Human in the Age of Artificial Intelligence"
authors = "Max Tegmark"
year = "2017"
type = "book"
access = "paid"
level = "beginner"
url = "https://www.penguinrandomhouse.com/books/530584/life-30-by-max-tegmark"
link_text = "Penguin Random House"
description = "Broad exploration of AI's future impact on society, consciousness, and the long-term future of life. Accessible and wide-ranging; speculative by design, so read it for the questions rather than the forecasts. First published August 2017; the link is the Vintage edition page."
verified = 2026-10-21

[[groups.items]]
id = "the-alignment-forum"
title = "AI Alignment Forum"
authors = "LessWrong team (maintainers)"
year = "2018"
type = "website"
label = "Forum"
access = "free"
url = "https://www.alignmentforum.org/"
link_text = "Link"
description = "Research forum for work on making powerful AI systems share human values, launched in 2018 and run by the LessWrong team; direct posting is limited to established researchers, and others' submissions go through review. Discussions of AI alignment, AI consciousness and the future of intelligence, written mostly from inside the AI-safety community. Also used in econ/11."
verified = 2026-10-21
