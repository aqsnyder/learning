# Resources for: Computation and Mind
# Edit this file, then run `python tools/build.py` to regenerate README.md, PROGRESS.md and the indexes.
# Field reference: tools/README.md

[[groups]]
outro = '''
> **See also:** [Section 12 — Philosophy of Science and Scientific Reasoning](../12-philosophy-of-science/README.md). Whether Wolfram's programme is science is a demarcation question, and Section 12's casebook exercise applies Popper's, Kuhn's and Lakatos's criteria to it.
'''

[[groups.items]]
id = "godel-escher-bach-an-eternal-golden"
title = "Gödel, Escher, Bach: An Eternal Golden Braid"
authors = "Douglas Hofstadter"
year = "1979"
type = "book"
access = "paid"
level = "intermediate"
marks = ["masterwork"]
description = "Pulitzer Prize-winning exploration of how self-reference and formal systems give rise to meaning, mind, and consciousness. Dense but endlessly rewarding. The single most important book in this curriculum."

[[groups.items]]
id = "minds-brains-and-programs"
title = "Minds, Brains, and Programs"
authors = "John Searle"
year = "1980"
type = "paper"
marks = ["core"]
url = "https://doi.org/10.1017/S0140525X00005756"
link_text = "Link"
description = "The Chinese Room argument: a computer manipulating symbols according to rules doesn't understand Chinese, so computation alone can't produce understanding. One of the most debated thought experiments in philosophy."
verified = 2026-10-13

[[groups.items]]
id = "on-computable-numbers-with-an"
title = "On Computable Numbers, with an Application to the Entscheidungsproblem"
authors = "Alan Turing"
year = "1936"
type = "paper"
url = "https://doi.org/10.1112/plms/s2-42.1.230"
link_text = "Link"
description = "The paper that defined computation itself. Introduces the Turing machine and proves the existence of uncomputable problems. Foundational for everything in this section."
verified = 2026-10-13

[[groups.items]]
id = "the-church-turing-thesis"
title = "The Church-Turing Thesis"
authors = "B. Jack Copeland"
year = "1997, rev. 2023"
type = "encyclopedia"
access = "free"
url = "https://plato.stanford.edu/entries/church-turing/"
link_text = "SEP"
description = "Stanford Encyclopedia of Philosophy entry on what the 1936 thesis says, the case for it, and its modern versions. §5 (\"The Church-Turing Thesis and the Limits of Machines\") and §6.3 (\"Brain simulation and the Church-Turing thesis\") are what Practice 2 asks about: what, if anything, the thesis implies about brains and minds."
verified = 2026-10-21

[[groups.items]]
id = "godel-s-incompleteness-theorems"
title = "Gödel's Incompleteness Theorems"
authors = "Panu Raatikainen"
year = "2013, rev. 2025"
type = "encyclopedia"
access = "free"
url = "https://plato.stanford.edu/entries/goedel-incompleteness/"
link_text = "SEP"
description = "What the two theorems actually say, how the proofs work, and (§6, \"Philosophical Implications—Real and Alleged\") which philosophical implications are real — including §6.3's critical assessment of the \"Gödelian\" (Lucas–Penrose) arguments that minds cannot be machines. Read before GEB and Penrose."
verified = 2026-10-21

[[groups.items]]
id = "the-emperor-s-new-mind-concerning"
title = "The Emperor's New Mind: Concerning Computers, Minds, and the Laws of Physics"
authors = "Roger Penrose"
year = "1989"
type = "book"
description = "Argues (controversially) that consciousness requires non-computable physics, using Gödel's theorems. Important for understanding the limits-of-computation argument."

[[groups.items]]
id = "i-am-a-strange-loop"
title = "I Am a Strange Loop"
authors = "Douglas Hofstadter"
year = "2007"
type = "book"
access = "paid"
level = "intermediate"
description = "Hofstadter's more focused sequel to GEB. Argues that consciousness arises from self-referential \"strange loops\" in the brain."

[[groups.items]]
id = "the-computational-theory-of-mind"
title = "The Computational Theory of Mind"
authors = "Michael Rescorla"
year = "2015, rev. 2024"
type = "encyclopedia"
access = "free"
url = "https://plato.stanford.edu/entries/computational-mind/"
link_text = "SEP"
description = "Stanford Encyclopedia of Philosophy entry on the view that cognition is computation: classical computationalism, neural networks (§4.3 on systematicity and productivity is the framing check for Practice 4), computation and representation, and §7's arguments against computationalism."
verified = 2026-10-21

[[groups.items]]
id = "connectionism-and-cognitive-architecture"
title = "Connectionism and Cognitive Architecture: A Critical Analysis"
authors = "Jerry Fodor, Zenon Pylyshyn"
year = "1988"
type = "paper"
url = "https://doi.org/10.1016/0010-0277(88)90031-5"
link_text = "Link"
description = "The classic argument that neural networks cannot explain the systematicity and compositionality of thought unless they merely implement a symbolic \"language of thought.\" The founding text of the symbolic-vs-neural debate that deep learning and LLMs have reopened."
verified = 2026-10-13

[[groups.items]]
id = "why-philosophers-should-care-about"
title = "Why Philosophers Should Care About Computational Complexity"
authors = "Scott Aaronson"
year = "2011"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/1108.1791"
link_text = "Link"
description = "Argues that the *efficiency* of computation, not just computability, matters philosophically — with sections on the strong-AI debate, computationalism, logical omniscience, the problem of induction, and quantum mechanics. The ideal bridge for a reader with a CS/math background."
verified = 2026-10-13

[[groups.items]]
id = "the-mind-s-i-fantasies-and-reflections"
title = "The Mind's I: Fantasies and Reflections on Self & Soul"
authors = "Hofstadter & Dennett (eds.)"
year = "1981"
type = "book"
access = "paid"
level = "beginner"
description = "Anthology of thought experiments and stories about minds, consciousness, and identity. Accessible entry point to many of the themes in this section."

[[groups.items]]
id = "a-new-kind-of-science-ch-12-the"
title = "A New Kind of Science (Ch. 12: The Principle of Computational Equivalence)"
authors = "Stephen Wolfram"
year = "2002"
type = "book"
url = "https://www.wolframscience.com/nks/"
link_text = "Link"
description = "Wolfram's argument that simple programs (e.g., cellular automata) generate the complexity of nature. Chapter 12 states the Principle of Computational Equivalence — the *conjecture* that almost all processes that are not obviously simple are computationally equivalent — which bears on whether minds are \"special\" computations. Treat it as a speculative thesis, not an established result: it is unproven, many reviewers criticized the book for overclaiming novelty, and its headline universality result (Rule 110) was proved by Matthew Cook. Read Aaronson's review alongside."
verified = 2026-10-13

[[groups.items]]
id = "book-review-a-new-kind-of-science"
title = "Book Review: 'A New Kind of Science'"
authors = "Scott Aaronson"
year = "2002"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/quant-ph/0206089"
link_text = "Link"
description = "A complexity theorist's critical review of NKS, focused on its claims about computation and fundamental physics — including an argument that Wolfram's deterministic model of quantum mechanics cannot be reconciled with both special relativity and Bell-inequality violations. The essential counterweight to the Wolfram entries."
verified = 2026-10-13

[[groups.items]]
id = "the-concept-of-the-ruliad-wolfram"
title = "The Concept of the Ruliad (Wolfram Physics Project)"
authors = "Stephen Wolfram"
year = "2021"
type = "website"
label = "Project"
url = "https://writings.stephenwolfram.com/2021/11/the-concept-of-the-ruliad/"
link_text = "Link"
description = "Wolfram's essay defining the \"ruliad\" — the entangled limit of all possible computations — and arguing that bounded observers embedded in it perceive coherent physical laws. **A speculative research program, not established physics:** the Physics Project (2020–) has no experimentally confirmed predictions and is not accepted by mainstream physics (Wolfram himself writes that \"we're still only at the very beginning of nailing down those technical details\"), and the step from \"physics is computation\" to claims about mind is philosophical speculation. Optional; read as a provocation about computationalism."
verified = 2026-10-13
