link_text = "MIT Press"
verified = 2026-10-21

[[groups.items]]
id = "why-buddhism-is-true-the-science-and"
title = "Why Buddhism Is True: The Science and Philosophy of Meditation and Enlightenment"
authors = "Robert Wright"
year = "2017"
type = "book"
access = "paid"
level = "beginner"
url = "https://www.simonandschuster.com/books/Why-Buddhism-is-True/Robert-Wright/9781439195475"
link_text = "Simon & Schuster"
description = "The popular case that Buddhist claims about the self, suffering and perception are borne out by modern psychology and evolutionary theory. Read it alongside Thompson's *Why I Am Not a Buddhist* in this section, which argues against treating Buddhism as uniquely scientific."
verified = 2026-10-21

[[groups.items]]
id = "why-i-am-not-a-buddhist"
title = "Why I Am Not a Buddhist"
authors = "Evan Thompson"
year = "2020"
type = "book"
access = "paid"
level = "intermediate"
description = "A critique by a co-author of *The Embodied Mind*: Thompson rejects \"Buddhist exceptionalism\" — the idea that Buddhism is uniquely rational, empirical or a \"mind science\" — argues that Buddhist modernism is philosophically unsound, and resists naturalized readings such as treating enlightenment as a brain state, while defending a cosmopolitan engagement with Buddhist ideas. The counterweight to this section's sympathetic readings."
url = "https://yalebooks.yale.edu/book/9780300264678/why-i-am-not-a-buddhist/"
link_text = "Yale University Press"
verified = 2026-10-21
