[[groups.items]]
id = "what-the-buddha-taught"
title = "What the Buddha Taught"
authors = "Walpola Rahula"
year = "1969"
type = "book"
access = "paid"
level = "beginner"
marks = ["core"]
url = "https://groveatlantic.com/book/what-the-buddha-taught/"
link_text = "Grove"
description = "A classic, widely used introduction to Buddhist philosophy. Covers the Four Noble Truths, dependent origination, and anattā (non-self) with precision and accessibility. The link is Grove Press's paperback (1969), with a foreword by Paul Demiéville and selected texts from the Suttas and the Dhammapada."
verified = 2026-10-21

[[groups.items]]
id = "buddhism-as-philosophy-an-introduction"
title = "Buddhism as Philosophy"
authors = "Mark Siderits"
year = "2007 (2nd ed. 2021)"
type = "book"
access = "paid"
level = "beginner"
description = "Presents Buddhist thought using the tools of analytic philosophy, with generous selections from the canonical texts. Bridges Eastern and Western philosophical traditions; excellent for philosophers approaching Buddhism for the first time. The link is the revised, expanded second edition (Hackett, September 2021; the 2007 first edition was subtitled *An Introduction*)."
url = "https://hackettpublishing.com/buddhism-as-philosophy-second-edition"
link_text = "Hackett"
verified = 2026-10-21

[[groups.items]]
id = "buddha"
title = "Buddha"
authors = "Mark Siderits"
year = "2011 (rev. 2023)"
type = "encyclopedia"
access = "free"
url = "https://plato.stanford.edu/entries/buddha/"
link_text = "SEP"
description = "Stanford Encyclopedia of Philosophy entry (first published 2011, substantively revised March 2023): the Buddha as philosopher, the core teachings (including the chariot and the two truths), non-self, karma and rebirth, and the Buddha's attitude toward reason."
verified = 2026-10-21

[[groups.items]]
id = "mind-in-indian-buddhist-philosophy"
title = "Mind in Indian Buddhist Philosophy"
authors = "Christian Coseru"
year = "2009 (rev. 2012)"
type = "encyclopedia"
access = "free"
url = "https://plato.stanford.edu/entries/mind-indian-buddhism/"
link_text = "SEP"
description = "Stanford Encyclopedia of Philosophy entry (first published 2009, substantively revised 2012) on Buddhist theories of mind proper: the not-self doctrine, the five aggregates, Abhidharma analyses of perception, attention and intentionality, \"repository consciousness,\" and reflexive awareness. Much closer to this curriculum's questions than the general \"Buddha\" entry."
verified = 2026-10-21

[[groups.items]]
id = "the-fundamental-wisdom-of-the-middle-way"
title = "The Fundamental Wisdom of the Middle Way: Nāgārjuna's Mūlamadhyamakakārikā"
authors = "Nāgārjuna (trans. Jay L. Garfield)"
year = "1995"
type = "book"
access = "paid"
level = "advanced"
url = "https://doi.org/10.1093/oso/9780195103175.001.0001"
link_text = "OUP"
description = "Nāgārjuna's foundational text on emptiness (śūnyatā) — the most influential work in Mahāyāna Buddhist philosophy. Garfield's translation includes a philosophical commentary."
verified = 2026-10-21

[[groups]]
title = "Indian rivals: the self in Nyāya and Advaita Vedānta"

[[groups.items]]
id = "classical-indian-philosophy-a-history-of"
title = "Classical Indian Philosophy (A History of Philosophy without any gaps, Vol. 5)"
authors = "Peter Adamson, Jonardon Ganeri"
year = "2020"
type = "book"
access = "paid"
level = "beginner"
marks = ["core"]
url = "https://global.oup.com/academic/product/classical-indian-philosophy-9780198851769"
link_text = "Link"
description = "Short, readable chapters from the Vedas and Upaniṣads through the Buddha and Jainism to the classical schools — Nyāya, Sāṃkhya, Vaiśeṣika, Yoga, Advaita Vedānta — and later Buddhist thinkers such as Nāgārjuna and Dignāga. Supplies the non-Buddhist Indian views, above all Nyāya's arguments for a self, that this section's no-self arguments need as opponents. The book version of the podcast's India series (see blogs-and-references)."
verified = 2026-10-13

[[groups.items]]
id = "nyaya-iep"
title = "Nyāya"
authors = "Matthew R. Dasti"
type = "encyclopedia"
access = "free"
url = "https://iep.utm.edu/nyaya/"
link_text = "IEP"
description = "Internet Encyclopedia of Philosophy article on the Nyāya school: its epistemology (perception, inference, testimony) and its metaphysics of substance, including the self (§2.a). There Nyāya argues that desire, cognition, pleasure, pain and volition are qualities that need a substrate, that recognition (\"that is the very man I saw a week ago\") needs a subject who lasts from one experience to the next, and that combining what different senses report needs a single experiencer: the classical case for a self against the Buddhists."
verified = 2026-10-21

[[groups.items]]
id = "advaita-vedanta-iep"
title = "Advaita Vedanta"
authors = "Sangeetha Menon"
type = "encyclopedia"
access = "free"
url = "https://iep.utm.edu/advaita-vedanta/"
link_text = "IEP"
description = "Internet Encyclopedia of Philosophy article on Advaita Vedānta: the identity of the individual self (ātman) with brahman, māyā, the states of waking, dreaming and deep sleep that point to a fourth state of pure consciousness (turīya), and superimposition (adhyāsa) as the root of error. The view that the self is consciousness itself, \"self-luminous\", not a thing that has consciousness, which sets it apart from both Nyāya and the Buddhists."
verified = 2026-10-21

[[groups]]
title = "Chinese philosophy: the heart-mind and agency"

[[groups.items]]
id = "mind-heart-mind-in-chinese-philosophy"
title = "Mind (Heart-Mind) in Chinese Philosophy"
authors = "David Wong"
year = "2023"
type = "encyclopedia"
access = "free"
marks = ["core"]
url = "https://plato.stanford.edu/entries/chinese-mind/"
link_text = "SEP"
description = "Stanford Encyclopedia of Philosophy entry (first published July 2023) on *xin*, the heart-mind that thinks, feels and intends: whether early Chinese thinkers separated mind from body, and the pictures of the person in the *Analects*, the Mohists, the *Daodejing*, the *Mengzi*, the *Zhuangzi* and the *Xunzi*, from Mencius's heart-mind that leads the person by cultivating innate moral \"sprouts\" to the *Zhuangzi*'s skilled, non-deliberative know-how."
verified = 2026-10-21

[[groups.items]]
id = "zhuangzi-sep"
title = "Zhuangzi"
authors = "Chad Hansen"
year = "2014 (rev. 2024)"
type = "encyclopedia"
access = "free"
url = "https://plato.stanford.edu/entries/zhuangzi/"
link_text = "SEP"
description = "Stanford Encyclopedia of Philosophy entry (first published 2014, substantively revised March 2024): the text, its competing interpretations, and Zhuangzi's relativism, views on language, skepticism and \"perspectives on perspectives\". Read it for the *Zhuangzi*'s challenge to any fixed point of view, including the speaker's own sense of self."
verified = 2026-10-21

[[groups]]
title = "Buddhism and the sciences of mind"

[[groups.items]]
id = "waking-dreaming-being-self-and"
title = "Waking, Dreaming, Being: Self and Consciousness in Neuroscience, Meditation, and Philosophy"
authors = "Evan Thompson"
year = "2014"
type = "book"
access = "paid"
level = "intermediate"
url = "https://doi.org/10.7312/thom13709"
link_text = "Columbia UP"
description = "Integrates neuroscience, phenomenology, and Buddhist philosophy to explore consciousness. Examines lucid dreaming, meditation, and dying as windows into the nature of awareness."
verified = 2026-10-21

[[groups.items]]
id = "the-bodhisattva-s-brain-buddhism"
title = "The Bodhisattva's Brain: Buddhism Naturalized"
authors = "Owen Flanagan"
year = "2011"
type = "book"
access = "paid"
level = "intermediate"
description = "Attempts to extract the philosophically defensible core of Buddhism, separated from supernatural elements. A naturalist philosopher engages seriously with Buddhist metaphysics and ethics."
