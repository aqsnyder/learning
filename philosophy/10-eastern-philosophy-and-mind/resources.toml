[[groups]]
title = "Buddhist philosophy of mind"
outro = '''
**Also used here (tracked in its home section):** Varela, Thompson & Rosch, *The Embodied Mind: Cognitive Science and Human Experience* ([Section 04](../04-intelligence-and-understanding/README.md)) for its integration of Buddhist mindfulness/awareness practice and the no-self analysis with cognitive science.
