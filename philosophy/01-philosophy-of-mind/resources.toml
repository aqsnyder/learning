# Field reference: tools/README.md

[[groups]]
outro = '''
**Also used here (tracked in its home section):** Descartes, *Meditations on First Philosophy* ([Section 00](../00-foundations-of-philosophy/README.md)) for Meditations II and VI — the cogito and the "real distinction" argument for substance dualism that sets this section's agenda (Practice 1, Check Yourself 1).
'''

[[groups.items]]
id = "philosophy-of-mind-3rd-edition"
title = "Philosophy of Mind (3rd Edition)"
authors = "Jaegwon Kim"
year = "2011"
type = "book"
access = "paid"
level = "beginner"
marks = ["core"]
url = "https://www.routledge.com/Philosophy-of-Mind/Kim/p/book/9780813344584"
link_text = "Routledge"
description = "The standard textbook, one position per chapter: mind as immaterial substance, behaviorism, the identity theory (\"Mind as the Brain\"), machine and causal-role functionalism, then mental causation, mental content and consciousness. Chapters 1–5 are the core path; Practices 1–4 use the chapters on dualism, behaviorism, the identity theory, mental causation and consciousness. Routledge lists the third edition as released in December 2010, copyright 2011."
verified = 2026-10-21

[[groups.items]]
id = "what-is-it-like-to-be-a-bat"
title = "What Is It Like to Be a Bat?"
authors = "Thomas Nagel"
year = "1974"
type = "paper"
access = "paid"
marks = ["core"]
url = "https://doi.org/10.2307/2183914"
link_text = "DOI"
description = "*The Philosophical Review* 83(4). Argues that consciousness has an irreducibly subjective character — there is something it is like to be a bat — that an objective, physical science must leave out. The anchor for Practice 3 and for every later question about whether a machine has a point of view. The DOI resolves to JSTOR."
verified = 2026-10-21

[[groups.items]]
id = "the-concept-of-mind-selections"
title = "The Concept of Mind (selections)"
authors = "Gilbert Ryle"
year = "1949 (60th anniversary ed. 2009)"
type = "book"
access = "paid"
level = "intermediate"
url = "https://doi.org/10.4324/9780203875858"
link_text = "Routledge"
description = "Ryle's attack on the Cartesian \"official doctrine\" of the mind as a \"ghost in the machine\": a category mistake, to be replaced by a dispositional account of mental concepts. Groundwork for behaviorism and functionalism. Practice 1 uses the category-mistake passage in the opening chapter (the visitor who asks where \"the University\" is). The link is Routledge's 60th anniversary edition."
verified = 2026-10-21

[[groups.items]]
id = "the-nature-of-mental-states"
title = "The Nature of Mental States"
authors = "Hilary Putnam"
year = "1967 (repr. 1975)"
type = "paper"
access = "paid"
marks = ["core"]
url = "https://doi.org/10.1017/CBO9780511625251.023"
link_text = "CUP"
description = "Introduces machine-state functionalism: mental states are defined by their functional roles, not their physical substrate, and the multiple realizability of pain counts against the brain-state identity theory. Foundational for the philosophy of AI and the source for Practice 2. First published in 1967 under a different title in *Art, Mind, and Religion* (eds. Capitan and Merrill); the link is the reprint in Putnam's *Mind, Language and Reality* (Cambridge University Press, 1975), pp. 429–440."
verified = 2026-10-21

[[groups.items]]
id = "epiphenomenal-qualia-mary-s-room"
title = "Epiphenomenal Qualia"
authors = "Frank Jackson"
year = "1982"
type = "paper"
access = "paid"
url = "https://doi.org/10.2307/2960077"
link_text = "DOI"
description = "*The Philosophical Quarterly* 32(127). The \"Mary's room\" paper: Mary knows every physical fact about color vision but has never seen red, so (Jackson argues) physical knowledge leaves out what experience is like. Practice 3 reconstructs it; Jackson later rejected the conclusion."
verified = 2026-10-21

[[groups.items]]
id = "functionalism"
title = "Functionalism"
authors = "Janet Levin"
year = "2004, rev. 2023"
type = "encyclopedia"
access = "free"
url = "https://plato.stanford.edu/entries/functionalism/"
link_text = "SEP"
description = "Stanford Encyclopedia of Philosophy entry on the view that mental states are constituted by their functional roles, its machine-state and causal-role versions, and the objections; §5.5.1 \"Inverted and Absent Qualia\" covers Block's \"Chinese nation\" (China brain) case used in Practice 2. The key bridge to the philosophy of AI."
verified = 2026-10-21

[[groups.items]]
id = "qualia"
title = "Qualia"
authors = "Michael Tye"
year = "1997, rev. 2025"
type = "encyclopedia"
access = "free"
url = "https://plato.stanford.edu/entries/qualia/"
link_text = "SEP"
description = "Stanford Encyclopedia of Philosophy entry on the subjective, experiential properties of mental states, the central concept of the consciousness debates. §3 (\"Are Qualia Irreducible, Non-Physical Entities?\") discusses Jackson's Mary and the physicalist replies that Practice 3 asks you to evaluate."
verified = 2026-10-21

[[groups.items]]
id = "philosophy-and-the-sciences-introduction"
title = "Philosophy and the Sciences: Introduction to the Philosophy of Cognitive Sciences"
authors = "University of Edinburgh (Michela Massimi, Alasdair Richmond, Suilin Lavelle et al.)"
type = "course"
access = "partial"
level = "beginner"
url = "https://www.coursera.org/learn/philosophy-cognitive-sciences"
link_text = "Coursera"
description = "Free-to-enroll MOOC (the certificate is paid) with modules on evolution and the mind (\"Stone-age minds in modern skulls\"), what consciousness is, intelligent machines and the human brain, and embodied cognition. A video companion for Sections 01, 02 and 04, and a review aid for Practice 3. Coursera does not show a launch date."
verified = 2026-10-21

[[groups.items]]
id = "personal-identity"
title = "Personal Identity"
authors = "Eric T. Olson"
year = "2002, rev. 2023"
type = "encyclopedia"
access = "free"
url = "https://plato.stanford.edu/entries/identity-personal/"
link_text = "SEP"
description = "What makes you the same person over time: psychological-continuity views (§4), fission (§5), and animalism (§7). The question every \"mind upload\" or \"copied AI\" scenario turns on, and the source for Practice 5."
verified = 2026-10-21

[[groups.items]]
id = "reasons-and-persons-part-iii-personal"
title = "Reasons and Persons (Part III: Personal Identity)"
authors = "Derek Parfit"
year = "1984"
type = "book"
access = "paid"
level = "advanced"
url = "https://doi.org/10.1093/019824908X.001.0001"
link_text = "Link"
description = "Parfit's teletransporter and fission cases lead to the conclusion that personal identity is not what matters — psychological continuity is. One of the most important works of 20th-century philosophy, and directly relevant to copying, forking, and uploading minds."
verified = 2026-10-13
