[[groups.items]]
id = "think-a-compelling-introduction-to"
title = "Think: A Compelling Introduction to Philosophy"
authors = "Simon Blackburn"
year = "1999"
type = "book"
access = "paid"
level = "beginner"
marks = ["core"]
url = "https://global.oup.com/academic/product/think-9780192854254"
link_text = "OUP"
description = "A single-volume introduction that works through arguments about knowledge, mind, free will, reasoning, ethics and God. The spine of this section: Practice 1 takes its arguments from the chapters on knowledge, mind and free will, and Practice 5 uses the chapter on reasoning. The link is OUP's 320-page paperback, which OUP now lists with a 2013 publication date."
verified = 2026-10-21

[[groups.items]]
id = "epistemology"
title = "Epistemology"
authors = "Matthias Steup, Ram Neta"
year = "2005, rev. 2024"
type = "encyclopedia"
access = "free"
marks = ["core"]
url = "https://plato.stanford.edu/entries/epistemology/"
link_text = "SEP"
description = "Stanford Encyclopedia of Philosophy entry on what knowledge and justification are, how knowledge is structured (foundationalism, coherentism), its sources, and its limits. Practice 2 uses §2.3 \"Knowing Facts\" (the Gettier problem); Practice 3 uses §6 \"The Limits of Cognitive Success\", including the responses to the closure argument."
verified = 2026-10-21

[[groups.items]]
id = "what-does-it-all-mean-a-very-short"
title = "What Does It All Mean? A Very Short Introduction to Philosophy"
authors = "Thomas Nagel"
year = "1987"
type = "book"
access = "paid"
level = "beginner"
url = "https://global.oup.com/academic/product/what-does-it-all-mean-9780195052169"
link_text = "OUP"
description = "A 112-page introduction in ten short chapters, from \"How Do We Know Anything?\", \"Other Minds\" and \"The Mind-Body Problem\" to free will, right and wrong, death and the meaning of life. A warm-up before Blackburn that previews Sections 01, 09 and 06."
verified = 2026-10-21

[[groups.items]]
id = "meditations-on-first-philosophy"
title = "Meditations on First Philosophy"
authors = "René Descartes"
year = "1641"
type = "book"
access = "free"
level = "intermediate"
url = "https://www.earlymoderntexts.com/assets/pdfs/descartes1641.pdf"
link_text = "Free"
description = "The foundational text of modern philosophy: radical doubt, the dream and evil-demon arguments, and the cogito. Practice 3 uses Meditations I–II; [Section 01](../01-philosophy-of-mind/README.md) uses Meditations II and VI for the argument that mind and body are distinct. The free link is Jonathan Bennett's lightly modernized translation (Early Modern Texts)."
verified = 2026-10-13

[[groups.items]]
id = "logic-and-ontology"
title = "Logic and Ontology"
authors = "Thomas Hofweber"
year = "2004, rev. 2023"
type = "encyclopedia"
access = "free"
url = "https://plato.stanford.edu/entries/logic-ontology/"
link_text = "SEP"
description = "How logic relates to ontology (the study of what exists): ontological commitment, whether logic is neutral about what there is, Carnap's rejection of ontology. An advanced metaphysics entry, not a reasoning primer — *forall x* below is the actual toolkit. Optional."
verified = 2026-10-21

[[groups.items]]
id = "introduction-to-critical-thinking"
title = "Introduction to Critical Thinking"
authors = "Wireless Philosophy (Wi-Phi)"
type = "video"
access = "free"
url = "https://www.youtube.com/playlist?list=PLtKNX4SfKpzX_bhh4LOEWEGy3pkLmFDmk"
link_text = "YouTube"
description = "35 short animated lessons from Wi-Phi on the basics of good reasoning — what arguments are and how to evaluate them. The fastest on-ramp before formal logic."
verified = 2026-10-13

[[groups.items]]
id = "forall-x-calgary-a-free-and-open"
title = "forall x: Calgary — A Free and Open Introduction to Formal Logic"
authors = "P. D. Magnus, Tim Button, Aaron Thomas-Bolduc, Richard Zach"
year = "2023"
type = "book"
access = "free"
level = "beginner"
url = "https://forallx.openlogicproject.org/"
link_text = "Free"
description = "Free, CC-licensed textbook on truth-functional and first-order logic: validity, truth tables, natural deduction, quantifiers. The formal reasoning toolkit this section promises; work through truth-functional logic and the basics of first-order logic, in parallel with later sections if needed."
verified = 2026-10-13

[[groups.items]]
id = "1000-word-philosophy-ethics-essays"
title = "1000-Word Philosophy — Ethics essays: \"Consequentialism and Utilitarianism\", \"Kantian Deontology\", \"Virtue Ethics\", \"Social Contract Theory\""
authors = "Shane Gronholz; Andrew Chapman; David Merry; David Antonini"
type = "article"
label = "Essays"
url = "https://1000wordphilosophy.com/ethics/"
link_text = "Link"
description = "Short, free introductions to the main normative theories. The curriculum otherwise has no ethics primer before Section 06 — these give you the vocabulary that AI-ethics and alignment debates assume."
access = "free"
verified = 2026-10-13

