type = "paper"
access = "free"
url = "https://arxiv.org/abs/2305.13048"
link_text = "arxiv.org/abs/2305.13048"
description = "A linear-attention RNN that trains in parallel like a transformer but runs with constant memory and compute per token at inference; scaled to 14B parameters."
verified = 2026-10-21

[[groups.items]]
id = "xlstm-extended-long-short-term-memory"
title = "xLSTM: Extended Long Short-Term Memory"
authors = "Beck et al."
year = "2024"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/2405.04517"
link_text = "arxiv.org/abs/2405.04517"
description = "Revives the LSTM with exponential gating and new memory cells (scalar sLSTM, parallelizable matrix mLSTM), stacked into residual blocks. Tests whether scaled recurrence rivals transformers."
verified = 2026-10-21

[[groups]]
title = "Agentic AI"
intro = '''
LLM-powered agents combine reasoning, tool use, memory, and retrieval to act autonomously. ReAct interleaves reasoning traces with actions, RAG grounds generation in retrieved documents (Sentence-BERT explains the sentence embeddings that semantic retrieval is built on), Tree of Thoughts explores branching reasoning paths, and Toolformer teaches models to call APIs on their own. "Building Effective Agents" distills the practical design patterns (prompt chaining, routing, orchestrator–workers, evaluator–optimizer, autonomous loops), and SWE-bench made resolving real GitHub issues a widely used test of coding agents. (Sparks of AGI is a capabilities-evaluation study of GPT-4 rather than an agents paper; it sits here for historical reasons.)
'''

[[groups.items]]
id = "react"
title = "ReAct: Synergizing Reasoning and Acting in Language Models"
authors = "Yao et al."
year = "2022"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/2210.03629"
link_text = "arxiv.org/abs/2210.03629"
description = "Interleaves reasoning traces with actions such as Wikipedia lookups, reducing chain-of-thought hallucination and error propagation. The Thought-Action-Observation loop of Practice 4."
verified = 2026-10-21

