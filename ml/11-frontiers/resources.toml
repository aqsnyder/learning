authors = "DeepSeek-AI et al."
year = "2025"
type = "paper"
access = "free"
marks = ["core"]
url = "https://arxiv.org/abs/2501.12948"
link_text = "arxiv.org/abs/2501.12948"
description = "R1-Zero gets long chain-of-thought reasoning from RL alone (GRPO, rule-based rewards); R1 adds cold-start SFT and more stages. Also published in Nature (vol. 645, 2025). The mini-project's recipe."
verified = 2026-10-21

[[groups.items]]
id = "learning-to-reason-with-llms-o1-openai"
title = "o1 — Learning to reason with LLMs"
authors = "OpenAI"
year = "2024"
type = "blog"
access = "free"
url = "https://openai.com/index/learning-to-reason-with-llms/"
link_text = "openai.com"
description = "OpenAI's announcement of o1 (12 September 2024): RL-trained chain-of-thought whose performance improves with both train-time RL and test-time thinking compute. Introduces the paradigm; few technical details. As of October 2026 the page marks o1 itself as deprecated: read it for the idea, not the model."
