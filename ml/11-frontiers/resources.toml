link_text = "arxiv.org/abs/1803.10122"
description = "Learns a compressed latent model of an environment (VAE plus mixture-density RNN) and trains a small controller, even entirely inside the model's own 'dream'."
verified = 2026-10-13

[[groups.items]]
id = "0-a-vision-language-action-flow-model"
