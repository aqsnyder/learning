[[groups]]
title = "Self-Supervised Learning"
intro = '''
Self-supervised learning extracts rich representations from unlabeled data, dramatically reducing the need for labeled datasets. Contrastive methods (SimCLR, MoCo) learn by comparing augmented views, self-distillation (DINO) learns without negative pairs, and masked prediction (MAE, JEPA) reconstructs missing information. These objectives let a vision backbone learn from unlabeled images, so downstream tasks need far fewer labels.
'''

[[groups.items]]
id = "simclr"
title = "SimCLR — A Simple Framework for Contrastive Learning of Visual Representations"
authors = "Chen et al."
year = "2020"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/2002.05709"
link_text = "arxiv.org/abs/2002.05709"
description = "Contrastive learning between two augmented views of each image. Shows that the augmentation mix, a nonlinear projection head and large batches all matter."
verified = 2026-10-21

