[[groups]]
title = "Alternative Architectures"
intro = '''
The transformer's quadratic attention cost has spurred a wave of subquadratic alternatives. State space models (S4, Mamba) achieve linear-time sequence modeling, while RWKV and xLSTM revisit recurrence with modern training tricks. These architectures are particularly compelling for long-context and real-time applications.
'''

[[groups.items]]
id = "s4-efficiently-modeling-long-sequences"
title = "S4 — Efficiently Modeling Long Sequences with Structured State Spaces"
authors = "Gu, Goel & Ré"
year = "2021"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/2111.00396"
link_text = "arxiv.org/abs/2111.00396"
description = "Makes long-range state-space models practical with a structured (normal plus low-rank) parameterization; first to solve LRA's Path-X. Source for Practice 1's recurrence/convolution duality. Also used in math/07."
verified = 2026-10-21

[[groups.items]]
id = "mamba-linear-time-sequence-modeling-with"
title = "Mamba: Linear-Time Sequence Modeling with Selective State Spaces"
authors = "Gu & Dao"
year = "2023"
type = "paper"
access = "free"
marks = ["core"]
url = "https://arxiv.org/abs/2312.00752"
link_text = "arxiv.org/abs/2312.00752"
description = "Makes SSM parameters input-dependent ('selection'), giving up the convolution view for a hardware-aware parallel scan. Linear-time and competitive with transformers on language."
verified = 2026-10-21

[[groups.items]]
id = "rwkv-reinventing-rnns-for-the"
title = "RWKV: Reinventing RNNs for the Transformer Era"
