year = "2023"
type = "paper"
url = "https://arxiv.org/abs/2307.15818"
link_text = "arxiv.org/abs/2307.15818"
description = "Co-fine-tunes a vision-language model on web data and robot trajectories, emitting actions as text tokens. Names the class: vision-language-action (VLA) models."
verified = 2026-10-13

