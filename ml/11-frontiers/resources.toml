[[groups]]
title = "Reasoning and Test-Time Compute"
outro = '''
Reasoning models are trained with large-scale reinforcement learning to think in long chains of thought, and their accuracy keeps improving as they are allowed more inference-time compute. OpenAI's o1 announcement introduced the paradigm. Snell et al. formalizes when test-time compute scaling beats simply training a larger model. DeepSeek-R1 openly demonstrated reinforcement-learning-driven chain-of-thought at scale (for the RL recipes behind it — GRPO and RL with verifiable rewards, plus the process-reward alternative it did not adopt — see [Section 10](../10-reinforcement-learning/README.md)).
'''

[[groups.items]]
id = "scaling-llm-test-time-compute"
title = "Scaling LLM Test-Time Compute"
authors = "Snell et al."
year = "2024"
type = "paper"
marks = ["core"]
url = "https://arxiv.org/abs/2408.03314"
link_text = "arxiv.org/abs/2408.03314"
description = "Compares two uses of inference compute, search against process-reward verifiers and sequential revision, and shows when they beat a bigger model. Basis for Practice 3."
verified = 2026-10-13

[[groups.items]]
id = "deepseek-r1-2025"
title = "DeepSeek-R1 (2025)"
year = "2025"
type = "paper"
marks = ["core"]
url = "https://arxiv.org/abs/2501.12948"
link_text = "arxiv.org/abs/2501.12948"
description = "R1-Zero gets long chain-of-thought reasoning from RL alone (GRPO, rule-based rewards); R1 adds cold-start SFT and more stages. The mini-project's recipe."
verified = 2026-10-13

[[groups.items]]
id = "learning-to-reason-with-llms-o1-openai"
title = "Learning to Reason with LLMs (o1) – OpenAI (2024)"
year = "2024"
type = "blog"
url = "https://openai.com/index/learning-to-reason-with-llms/"
link_text = "openai.com"
description = "OpenAI's announcement of o1: RL-trained chain-of-thought whose performance improves with both train-time RL and test-time thinking compute. Introduces the paradigm; few technical details."
verified = 2026-10-13

[[groups]]
title = "Multimodal Models"
outro = '''
Multimodal models unify vision, language, and other modalities into a single architecture. CLIP pioneered contrastive image-text pretraining, SAM brought foundation-model thinking to segmentation, LLaVA showed the simple open recipe (vision encoder + projection + LLM, trained on visual instruction data) that most open vision-language models still follow, and Gemini represented the natively multimodal frontier at its 2023 release.
'''

