[[groups]]
title = "Alternative Architectures"
intro = '''
The transformer's quadratic attention cost has spurred a wave of subquadratic alternatives. State space models (S4, Mamba) achieve linear-time sequence modeling, while RWKV and xLSTM revisit recurrence with modern training tricks. These architectures are particularly compelling for long-context and real-time applications.
'''

[[groups.items]]
id = "s4-efficiently-modeling-long-sequences"
title = "S4 — Efficiently Modeling Long Sequences with Structured State Spaces"
authors = "Gu, Goel & Ré"
year = "2021"
type = "paper"
url = "https://arxiv.org/abs/2111.00396"
link_text = "arxiv.org/abs/2111.00396"
description = "Makes long-range state-space models practical with a structured (normal plus low-rank) parameterization; first to solve LRA's Path-X. Source for Practice 1's recurrence/convolution duality."
verified = 2026-10-13

[[groups.items]]
id = "mamba-linear-time-sequence-modeling-with"
title = "Mamba — Linear-Time Sequence Modeling with Selective State Spaces"
authors = "Gu & Dao"
year = "2023"
type = "paper"
marks = ["core"]
url = "https://arxiv.org/abs/2312.00752"
link_text = "arxiv.org/abs/2312.00752"
description = "Makes SSM parameters input-dependent ('selection'), giving up the convolution view for a hardware-aware parallel scan. Linear-time and competitive with transformers on language."
verified = 2026-10-13

[[groups.items]]
id = "rwkv-reinventing-rnns-for-the"
title = "RWKV — Reinventing RNNs for the Transformer Era"
authors = "Peng et al."
year = "2023"
type = "paper"
url = "https://arxiv.org/abs/2305.13048"
link_text = "arxiv.org/abs/2305.13048"
description = "A linear-attention RNN that trains in parallel like a transformer but runs with constant memory and compute per token at inference; scaled to 14B parameters."
verified = 2026-10-13

[[groups.items]]
id = "xlstm-extended-long-short-term-memory"
title = "xLSTM — Extended Long Short-Term Memory"
authors = "Beck et al."
year = "2024"
type = "paper"
url = "https://arxiv.org/abs/2405.04517"
link_text = "arxiv.org/abs/2405.04517"
description = "Revives the LSTM with exponential gating and new memory cells (scalar sLSTM, parallelizable matrix mLSTM), stacked into residual blocks. Tests whether scaled recurrence rivals transformers."
verified = 2026-10-13

[[groups]]
title = "Agentic AI"
intro = '''
LLM-powered agents combine reasoning, tool use, memory, and retrieval to act autonomously. ReAct interleaves reasoning traces with actions, RAG grounds generation in retrieved documents (Sentence-BERT explains the sentence embeddings that semantic retrieval is built on), Tree of Thoughts explores branching reasoning paths, and Toolformer teaches models to call APIs on their own. "Building Effective Agents" distills the practical design patterns (prompt chaining, routing, orchestrator–workers, evaluator–optimizer, autonomous loops), and SWE-bench is the benchmark that made real-world software engineering the standard test of agent capability. (Sparks of AGI is a capabilities-evaluation study of GPT-4 rather than an agents paper; it sits here for historical reasons.)
'''

[[groups.items]]
