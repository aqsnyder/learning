[[groups]]
title = "Self-Supervised Learning"
intro = '''
Self-supervised learning extracts rich representations from unlabeled data, dramatically reducing the need for labeled datasets. Contrastive methods (SimCLR, MoCo) learn by comparing augmented views, self-distillation (DINO) learns without negative pairs, and masked prediction (MAE, JEPA) reconstructs missing information. These methods now provide the default initialization for most vision systems.
'''

[[groups.items]]
id = "simclr"
title = "SimCLR"
authors = "Chen et al."
year = "2020"
type = "paper"
url = "https://arxiv.org/abs/2002.05709"
link_text = "arxiv.org/abs/2002.05709"
description = "Contrastive learning between two augmented views of each image. Shows that the augmentation mix, a nonlinear projection head and large batches all matter."
verified = 2026-10-13

[[groups.items]]
id = "moco-v2"
title = "MoCo v2"
authors = "Chen et al."
year = "2020"
type = "paper"
url = "https://arxiv.org/abs/2003.04297"
link_text = "arxiv.org/abs/2003.04297"
description = "Short note adding SimCLR's MLP projection head and stronger augmentation to MoCo's momentum encoder and negative queue; it outperforms SimCLR without large batches."
verified = 2026-10-13

[[groups.items]]
