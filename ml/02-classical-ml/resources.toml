[[groups]]

[[groups.items]]
id = "machine-learning-specialization"
title = "Machine Learning Specialization"
authors = "Andrew Ng"
year = "2022"
type = "course"
label = "Online Course"
marks = ["core"]
url = "https://www.coursera.org/specializations/machine-learning-introduction"
link_text = "Link"
description = "The most popular ML course ever made, now updated. Covers supervised learning, unsupervised learning, and recommender systems with hands-on labs. The ideal starting point."
verified = 2026-10-13

[[groups.items]]
id = "stanford-cs229-machine-learning"
title = "Stanford CS229: Machine Learning"
authors = "Andrew Ng"
year = "2018"
type = "video-series"
label = "Video Lectures"
marks = ["core"]
url = "https://www.youtube.com/playlist?list=PLoROMvodv4rMiGQp3WXShtMGgzqpfVfbU"
link_text = "Link"
description = "The full Stanford graduate-level course (the Autumn 2018 lectures on Stanford Online's YouTube channel). More mathematically rigorous than the Coursera specialization — great for deepening understanding."
verified = 2026-10-13

[[groups.items]]
id = "an-introduction-to-statistical-learning"
title = "An Introduction to Statistical Learning (ISLR 2nd ed. / ISLP Python ed.)"
authors = "Gareth James, Daniela Witten, Trevor Hastie, Robert Tibshirani (+ Jonathan Taylor for ISLP)"
year = "2021 / 2023"
type = "book"
access = "free"
level = "beginner"
marks = ["core"]
url = "https://www.statlearning.com/"
link_text = "Link"
description = "The most accessible statistics/ML textbook. Covers regression, classification, resampling, regularization, tree methods, SVMs, and unsupervised learning. Free PDFs of both the R edition (2nd ed., 2021) and the Python edition (ISLP, 2023) — use ISLP's Python labs."
verified = 2026-10-13

[[groups.items]]
id = "pattern-recognition-and-machine-learning"
title = "Pattern Recognition and Machine Learning (PRML)"
authors = "Christopher Bishop"
year = "2006"
type = "book"
access = "free"
level = "advanced"
url = "https://www.microsoft.com/en-us/research/publication/pattern-recognition-machine-learning/"
link_text = "Link"
description = "A comprehensive, mathematically rigorous treatment of probabilistic ML. Excellent reference for Bayesian methods, graphical models, and EM. More advanced than ISLR. Now a free PDF from Microsoft Research."
verified = 2026-10-13

[[groups.items]]
id = "gaussian-processes-for-machine-learning"
title = "Gaussian Processes for Machine Learning"
authors = "Carl Edward Rasmussen, Christopher K. I. Williams"
year = "2006"
type = "book"
access = "free"
level = "advanced"
url = "https://gaussianprocess.org/gpml/"
link_text = "Link"
description = "The standard text on Gaussian processes — Bayesian non-parametric regression and classification with calibrated uncertainty, and the clearest route into kernel methods. Full PDF free from the authors."
verified = 2026-10-13

[[groups.items]]
id = "a-few-useful-things-to-know-about"
title = "A Few Useful Things to Know About Machine Learning"
authors = "Pedro Domingos"
year = "2012"
type = "paper"
url = "https://homes.cs.washington.edu/~pedrod/papers/cacm12.pdf"
link_text = "Link"
description = "Twelve hard-won lessons in one short article: generalization is what counts, overfitting has many faces, intuition fails in high dimensions, feature engineering is key, more data beats a cleverer algorithm. Practical wisdom no textbook chapter gives you."
verified = 2026-10-13

[[groups.items]]
id = "xgboost-a-scalable-tree-boosting-system"
title = "XGBoost: A Scalable Tree Boosting System"
authors = "Tianqi Chen, Carlos Guestrin"
year = "2016"
type = "paper"
url = "https://arxiv.org/abs/1603.02754"
link_text = "Link"
description = "Gradient-boosted decision trees made fast and scalable. Boosted trees remain the strong default on tabular data, although on small datasets tabular foundation models such as TabPFN (below) now compete with them; read after the ISLR chapter on tree-based methods."
verified = 2026-10-13

[[groups.items]]
id = "why-do-tree-based-models-still"
title = "Why Do Tree-Based Models Still Outperform Deep Learning on Tabular Data?"
authors = "Léo Grinsztajn, Edouard Oyallon, Gaël Varoquaux"
year = "2022"
type = "paper"
url = "https://arxiv.org/abs/2207.08815"
link_text = "Link"
description = "A careful benchmark showing tree ensembles beat neural nets on medium-sized tabular datasets, and explaining why. Read before reaching for a neural net on sensor logs or spreadsheet-style data."
verified = 2026-10-13

[[groups.items]]
id = "accurate-predictions-on-small-data-with"
title = "Accurate Predictions on Small Data with a Tabular Foundation Model (TabPFN)"
authors = "Noah Hollmann et al."
year = "2025"
type = "paper"
url = "https://doi.org/10.1038/s41586-024-08328-6"
link_text = "Link"
description = "A transformer pretrained on millions of synthetic datasets that makes predictions on a new small table in seconds (*Nature*, 2025). On datasets of up to 10,000 samples it outperforms previous methods; in classification it beats an ensemble of strong baselines tuned for four hours. The serious challenger to \"start with boosted trees\" when your dataset is small — its claims stop at 10,000 samples."
verified = 2026-10-13

[[groups.items]]
id = "the-elements-of-statistical-learning-esl"
title = "The Elements of Statistical Learning (ESL)"
authors = "Trevor Hastie, Robert Tibshirani, Jerome Friedman"
year = "2009"
type = "book"
access = "free"
level = "advanced"
url = "https://hastie.su.domains/ElemStatLearn/"
link_text = "Link"
description = "The graduate-level companion to ISLR. Covers the same topics in much greater mathematical depth. Best used as a reference once you've worked through ISLR."

[[groups.items]]
id = "scikit-learn-user-guide"
title = "Scikit-learn User Guide"
authors = "Scikit-learn developers"
type = "docs"
label = "Documentation"
url = "https://scikit-learn.org/"
link_text = "Link"
description = "The go-to Python library for classical ML. The documentation doubles as an excellent learning resource with clear explanations, examples, and algorithm guides."
verified = 2026-10-13

[[groups.items]]
id = "google-machine-learning-crash-course"
title = "Google Machine Learning Crash Course"
authors = "Google"
type = "course"
label = "Online Course"
url = "https://developers.google.com/machine-learning/crash-course"
link_text = "Link"
description = "A fast-paced, practical introduction to ML concepts with TensorFlow exercises. Good for a quick overview or as a supplement."
verified = 2026-10-13
