[[groups.items]]
id = "colah-s-blog"
title = "Calculus on Computational Graphs: Backpropagation"
authors = "Christopher Olah"
year = "2015"
type = "blog"
label = "Blog post"
access = "free"
url = "https://colah.github.io/posts/2015-08-Backprop/"
link_text = "colah.github.io"
more_links = [{ text = "Blog index", url = "https://colah.github.io/" }]
description = "Derivatives as sums over paths in a computational graph, and why reverse-mode differentiation (backpropagation) gets the derivative of one output with respect to every input in a single backward pass, where forward mode needs a pass per input. The picture behind micrograd's backward pass (objective 1, Practice 1). His LSTM post is core in Section 05."
verified = 2026-10-21
short = "Olah — Calculus on Computational Graphs: Backpropagation"

[[groups.items]]
id = "keeping-neural-networks-simple-by"
title = "Keeping Neural Networks Simple by Minimizing the Description Length of the Weights"
authors = "Geoffrey Hinton, Drew van Camp"
year = "1993"
type = "paper"
access = "free"
marks = ["canon"]
url = "https://www.cs.toronto.edu/~hinton/absps/colt93.pdf"
link_text = "Link"
description = "From the Ilya Sutskever reading list. Connects MDL theory to neural network training — the idea that simpler weight configurations generalize better. Foundational for understanding regularization and compression in deep learning."
verified = 2026-10-13

