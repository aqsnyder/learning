[[groups.items]]
id = "gpt-2"
title = "GPT-2 — Language Models are Unsupervised Multitask Learners"
authors = "Radford et al."
year = "2019"
type = "paper"
access = "free"
url = "https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf"
link_text = "openai.com"
description = "Shows a 1.5B-parameter language model trained on WebText performing tasks zero-shot, with gains growing log-linearly in size. Also read its byte-level BPE rationale."
verified = 2026-10-13

[[groups.items]]
id = "gpt-3"
title = "GPT-3 — Language Models are Few-Shot Learners"
authors = "Brown et al."
year = "2020"
type = "paper"
access = "free"
marks = ["core"]
url = "https://arxiv.org/abs/2005.14165"
link_text = "arxiv.org/abs/2005.14165"
description = "175B-parameter model doing tasks from a few in-prompt examples, with no gradient updates. The core paper on in-context learning and its dependence on scale."
verified = 2026-10-21

[[groups.items]]
id = "t5"
title = "T5 — Exploring the Limits of Transfer Learning with a Unified Text-to-Text Transformer"
authors = "Raffel et al."
year = "2019"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/1910.10683"
link_text = "arxiv.org/abs/1910.10683"
description = "Casts every NLP task as text-to-text and systematically compares pre-training objectives, architectures and datasets, introducing the C4 corpus. The encoder–decoder contrast to GPT."
verified = 2026-10-21

[[groups.items]]
id = "instructgpt-rlhf"
