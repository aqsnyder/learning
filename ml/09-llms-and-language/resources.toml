access = "free"
url = "https://arxiv.org/abs/2201.11903"
link_text = "arxiv.org/abs/2201.11903"
description = "Few-shot exemplars with intermediate reasoning steps improve arithmetic, commonsense and symbolic reasoning in sufficiently large models. Practice 4 tests that scale dependence."
