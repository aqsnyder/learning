[[groups]]
title = "Compression, Complexity, and Intelligence (Ilya list theory cluster)"
intro = '''
These ⭐ items share one idea: learning is compression, and the simplest description that explains the data generalizes best. They are optional theory, best read after you have trained a few models (Sections 03–06). Hinton & van Camp's MDL paper in [Section 03](../03-neural-network-fundamentals/README.md) belongs to the same cluster.
'''

[[groups.items]]
id = "the-first-law-of-complexodynamics"
title = "The First Law of Complexodynamics"
authors = "Scott Aaronson"
year = "2011"
type = "article"
label = "Blog Post"
marks = ["canon"]
url = "https://scottaaronson.blog/?p=762"
link_text = "Link"
description = "From the Ilya Sutskever reading list. Why does the \"interestingness\" of a closed system (cream mixing into coffee) rise and then fall while entropy only increases? Proposes \"complextropy\" via resource-bounded Kolmogorov complexity."
verified = 2026-10-13

[[groups.items]]
id = "quantifying-the-rise-and-fall-of"
title = "Quantifying the Rise and Fall of Complexity in Closed Systems: The Coffee Automaton"
authors = "Scott Aaronson, Sean M. Carroll, Lauren Ouellette"
year = "2014"
type = "paper"
access = "free"
marks = ["canon"]
url = "https://arxiv.org/abs/1405.6903"
link_text = "Link"
description = "From the Ilya Sutskever reading list. The follow-up paper: a simple automaton model of cream mixing into coffee, used to test quantitatively whether complexity rises and then falls as the blog post conjectured."
verified = 2026-10-13

[[groups.items]]
id = "a-tutorial-introduction-to-the-minimum"
title = "A Tutorial Introduction to the Minimum Description Length Principle"
authors = "Peter Grünwald"
year = "2004"
type = "tutorial"
access = "free"
marks = ["canon"]
url = "https://arxiv.org/abs/math/0406077"
link_text = "Link"
description = "From the Ilya Sutskever reading list. Formalizes Occam's Razor mathematically — the best model is the one that compresses the data most. Grünwald's 2007 MIT Press book *The Minimum Description Length Principle* is the full-length follow-up."
verified = 2026-10-13

[[groups.items]]
id = "kolmogorov-complexity-and-algorithmic"
title = "Kolmogorov Complexity and Algorithmic Randomness"
authors = "A. Shen, V. A. Uspensky, N. Vereshchagin"
year = "2017"
type = "book"
marks = ["canon"]
url = "https://www.lirmm.fr/~ashen/kolmbook-eng-scan.pdf"
link_text = "Link"
description = "From the Ilya Sutskever reading list (AMS, free scan on Shen's homepage). Rigorous text on algorithmic information theory — the theoretical underpinning of compression, learning, and generalization. Li & Vitányi's *An Introduction to Kolmogorov Complexity and Its Applications* is the classic alternative reference."
verified = 2026-10-13

[[groups.items]]
id = "machine-super-intelligence"
title = "Machine Super Intelligence"
authors = "Shane Legg"
year = "2008"
type = "paper"
label = "Thesis"
marks = ["canon"]
url = "https://pdf.stafforini.com/legg-2008-machine-super-intelligence.pdf"
link_text = "Link"
description = "From the Ilya Sutskever reading list. Legg's PhD thesis (University of Lugano, supervised by Marcus Hutter): surveys definitions and tests of machine intelligence, studies Hutter's AIXI model of an optimal universal agent (Solomonoff induction + sequential decision theory), relates achievable performance to Kolmogorov complexity, and ends with speculation about future highly intelligent machines."
verified = 2026-10-13
