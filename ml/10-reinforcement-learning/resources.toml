[[groups.items]]
id = "star-self-taught-reasoner"
title = "STaR: Bootstrapping Reasoning With Reasoning"
authors = "Zelikman et al."
year = "2022"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/2203.14465"
link_text = "arxiv.org/abs/2203.14465"
description = "Bootstraps reasoning: generate rationales, retry failures given the correct answer, fine-tune on rationales that reach correct answers, repeat. Needs only a few rationales plus answers."
verified = 2026-10-21

[[groups.items]]
