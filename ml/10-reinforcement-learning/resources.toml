[[groups]]
title = "RL for Language Models"
intro = '''
Reinforcement learning has become central to aligning large language models with human preferences — and, since 2024, to teaching them to reason. RLHF (via PPO) was the key technique behind ChatGPT's behavior, while DPO simplifies the pipeline by eliminating the separate reward model. RL with verifiable rewards (checking answers to math and code problems automatically, often optimized with GRPO) is the recipe behind reasoning models such as DeepSeek-R1 ([Section 11](../11-frontiers/README.md)); process supervision (rewarding each reasoning step) is the main alternative studied, though the R1 report lists process reward models among its unsuccessful attempts. Self-play and self-taught reasoning push the boundaries further.
'''

[[groups.items]]
id = "deep-rl-from-human-preferences"
title = "Deep reinforcement learning from human preferences"
authors = "Christiano et al."
year = "2017"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/1706.03741"
link_text = "arxiv.org/abs/1706.03741"
description = "Fits a reward model to human comparisons of trajectory-segment pairs, then trains RL agents on it with feedback on under 1% of interactions. RLHF's foundation."
verified = 2026-10-21

[[groups.items]]
id = "direct-preference-optimization-dpo"
title = "Direct Preference Optimization: Your Language Model is Secretly a Reward Model"
authors = "Rafailov et al."
year = "2023"
type = "paper"
access = "free"
marks = ["core"]
url = "https://arxiv.org/abs/2305.18290"
link_text = "arxiv.org/abs/2305.18290"
description = "Gets the KL-constrained RLHF optimum in closed form, so preference tuning becomes a classification loss with no separate reward model or sampling. Derive it yourself."
verified = 2026-10-21

[[groups.items]]
id = "self-play-fine-tuning-spin"
