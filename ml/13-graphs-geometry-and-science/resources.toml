link_text = "arxiv.org/abs/2006.10503"
description = "Self-attention for 3D point clouds and graphs that is equivariant to rotations and translations, built on spherical-harmonic (tensor field) features. The heavier alternative to EGNN."
verified = 2026-10-13

[[groups]]
title = "AI for Science"
intro = '''
Deep learning now contributes to several sciences, and each headline claim below is worth auditing (Practice 5). AlphaFold 2 predicted protein structures with accuracy competitive with experiment in most CASP14 cases, on a problem open for more than 50 years; AlphaFold 3 extends prediction to complexes with nucleic acids, small molecules and ions. GraphCast produces 10-day global weather forecasts in under a minute, GNoME identified 2.2 million crystal structures below the known stability convex hull (381,000 of them new stable entries; 736 already independently synthesized), RFdiffusion generates novel proteins, AlphaGeometry and AlphaProof reached olympiad-level mathematical reasoning, and AlphaEvolve turns an LLM coding agent plus evolutionary search into a tool for discovering new algorithms.
'''

