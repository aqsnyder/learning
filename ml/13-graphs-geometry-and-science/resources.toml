[[groups]]
title = "Equivariant & Geometric Networks"
intro = '''
Standard neural networks ignore the symmetries of physical systems. Equivariant networks build in rotation, translation, and reflection symmetries by construction — crucial for molecular dynamics, protein modeling, and any domain where the laws of physics don't depend on your coordinate system.
'''

[[groups.items]]
id = "e-n-equivariant-graph-neural-networks"
title = "E(n) Equivariant Graph Neural Networks"
authors = "Satorras et al."
year = "2021"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/2102.09844"
link_text = "arxiv.org/abs/2102.09844"
description = "A graph network equivariant to rotations, translations, reflections and permutations, without costly higher-order (spherical-harmonic) features. Simple enough to implement in Practice 3. Also used in physics/11."
verified = 2026-10-21

[[groups.items]]
id = "se-3-transformers-3d-roto-translation"
