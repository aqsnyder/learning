# Resources for: CNNs and Computer Vision
# Edit this file, then run `python tools/build.py` to regenerate README.md, PROGRESS.md and the indexes.
# Field reference: tools/README.md

[[groups]]

[[groups.items]]
id = "gradient-based-learning-applied-to"
title = "Gradient-Based Learning Applied to Document Recognition (LeNet-5)"
authors = "LeCun, Bottou, Bengio, Haffner"
year = "1998"
type = "paper"
access = "paid"
url = "https://doi.org/10.1109/5.726791"
link_text = "Paper"
description = "The canonical early CNN: stacked convolution and subsampling layers trained end-to-end with backprop, deployed commercially to read bank cheques. Almost every idea in AlexNet is already recognizable here."
verified = 2026-10-13

[[groups.items]]
id = "imagenet-classification-with-deep"
title = "ImageNet Classification with Deep Convolutional Neural Networks (AlexNet)"
authors = "Krizhevsky, Sutskever, Hinton"
year = "2012"
type = "paper"
access = "free"
marks = ["canon"]
url = "https://papers.nips.cc/paper/4824-imagenet-classification-with-deep-convolutional-neural-networks"
link_text = "Paper"
description = "The paper that launched the deep learning revolution. Won ImageNet 2012 by a massive margin using ReLU, dropout, GPU training, and data augmentation."
verified = 2026-10-13

[[groups.items]]
id = "deep-residual-learning-for-image"
title = "Deep Residual Learning for Image Recognition (ResNet)"
authors = "He, Zhang, Ren, Sun"
year = "2015"
type = "paper"
access = "free"
marks = ["core", "canon"]
url = "https://arxiv.org/abs/1512.03385"
link_text = "Paper"
description = "Introduced skip connections enabling training of 100+ layer networks. Residual learning is now a universal design pattern across all of deep learning."
verified = 2026-10-13

[[groups.items]]
id = "identity-mappings-in-deep-residual"
title = "Identity Mappings in Deep Residual Networks"
authors = "He, Zhang, Ren, Sun"
year = "2016"
type = "paper"
access = "free"
marks = ["canon"]
url = "https://arxiv.org/abs/1603.05027"
link_text = "Paper"
description = "The ResNet follow-up: analyzes why clean identity shortcuts let signals propagate through 1000-layer networks and introduces the \"pre-activation\" residual block — the same idea as the pre-norm blocks in modern transformers."
verified = 2026-10-13

[[groups.items]]
id = "stanford-cs231n-cnns-for-visual"
title = "Stanford CS231n: CNNs for Visual Recognition"
authors = "Fei-Fei Li, Justin Johnson, Serena Yeung"
year = "2017"
type = "course"
access = "free"
level = "intermediate"
marks = ["core", "canon"]
url = "https://www.youtube.com/playlist?list=PL3FW7Lu3i5JvHM8ljYj-zLfQRF3EO8sYv"
link_text = "YouTube"
description = "Stanford's course on CNNs for vision (the Spring 2017 lectures; also on the Ilya Sutskever reading list): backprop, convolutions, architectures, detection, segmentation and generative models. Lectures 1–9 carry this section's core path."
verified = 2026-10-13

[[groups.items]]
id = "very-deep-convolutional-networks-for"
title = "Very Deep Convolutional Networks for Large-Scale Image Recognition (VGGNet)"
authors = "Simonyan, Zisserman"
year = "2014"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/1409.1556"
link_text = "Paper"
description = "Showed that network depth with small 3×3 filters is critical for good performance. Simple, elegant architecture still used as a feature extractor."
verified = 2026-10-13

[[groups.items]]
id = "going-deeper-with-convolutions-googlenet"
title = "Going Deeper with Convolutions (GoogLeNet / Inception)"
authors = "Szegedy et al."
year = "2014"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/1409.4842"
link_text = "Paper"
description = "Introduced the Inception module with parallel convolutions at multiple scales and 1×1 convolutions for dimensionality reduction."
verified = 2026-10-13

[[groups.items]]
id = "network-in-network"
title = "Network In Network"
authors = "Lin, Chen, Yan"
year = "2013"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/1312.4400"
link_text = "Paper"
description = "Pioneered 1×1 convolutions and global average pooling — ideas adopted by nearly every subsequent architecture."
verified = 2026-10-13

[[groups.items]]
id = "multi-scale-context-aggregation-by"
title = "Multi-Scale Context Aggregation by Dilated Convolutions"
authors = "Yu, Koltun"
year = "2015"
type = "paper"
access = "free"
marks = ["canon"]
url = "https://arxiv.org/abs/1511.07122"
link_text = "Paper"
description = "Introduced dilated (atrous) convolutions to systematically aggregate multi-scale context without losing resolution. Key for dense prediction tasks."
verified = 2026-10-13

[[groups.items]]
id = "u-net-convolutional-networks-for"
title = "U-Net: Convolutional Networks for Biomedical Image Segmentation"
authors = "Ronneberger, Fischer, Brox"
year = "2015"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/1505.04597"
link_text = "Paper"
description = "Encoder–decoder CNN with skip connections between matching resolutions, producing per-pixel segmentations from few training images. Still the default segmentation architecture, and the denoising backbone of DDPM and Stable Diffusion (Section 07)."
verified = 2026-10-13

[[groups.items]]
id = "feature-visualization"
title = "Feature Visualization"
authors = "Olah et al."
year = "2017"
type = "article"
access = "free"
url = "https://distill.pub/2017/feature-visualization/"
link_text = "Distill"
description = "Beautiful interactive exploration of what neural network neurons learn to detect. Makes CNN internals tangible and intuitive."
verified = 2026-10-13

[[groups.items]]
id = "the-building-blocks-of-interpretability"
title = "The Building Blocks of Interpretability"
authors = "Olah et al."
year = "2018"
type = "article"
access = "free"
url = "https://distill.pub/2018/building-blocks/"
link_text = "Distill"
description = "Builds on feature visualization to show how network components combine into interpretable explanations of model behavior."
verified = 2026-10-13

[[groups]]
title = "Vision Transformers (and the CNN response)"
intro = '''
The last row, ConvNeXt, is a CNN. It sits here because it answers ViT: it modernizes a ResNet until it matches Swin, so read it after the transformer papers.
'''

[[groups.items]]
id = "an-image-is-worth-16x16-words"
title = "An Image is Worth 16x16 Words: Transformers for Image Recognition at Scale (ViT)"
authors = "Dosovitskiy et al."
year = "2020"
type = "paper"
access = "free"
marks = ["core"]
url = "https://arxiv.org/abs/2010.11929"
link_text = "Paper"
description = "Showed that a plain transformer applied to 16×16 image patches, treated as tokens, matches or beats CNNs on image classification when pre-trained on enough data. The anchor paper for objective 4 and Practice 4."
verified = 2026-10-13

[[groups.items]]
id = "training-data-efficient-image"
title = "Training Data-Efficient Image Transformers (DeiT)"
authors = "Touvron et al."
year = "2021"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/2012.12877"
link_text = "Paper"
description = "Showed how to train ViTs without massive datasets using knowledge distillation and strong data augmentation."
verified = 2026-10-13

[[groups.items]]
id = "swin-transformer-hierarchical-vision"
title = "Swin Transformer: Hierarchical Vision Transformer using Shifted Windows"
authors = "Liu et al."
year = "2021"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/2103.14030"
link_text = "Paper"
description = "Hierarchical vision transformer with shifted windows — efficient multi-scale feature extraction for dense prediction."
verified = 2026-10-13

[[groups.items]]
id = "end-to-end-object-detection-with"
title = "End-to-End Object Detection with Transformers (DETR)"
authors = "Carion et al."
year = "2020"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/2005.12872"
link_text = "Paper"
description = "Eliminated hand-designed components (anchors, NMS) in object detection by framing it as a set prediction problem."
verified = 2026-10-13

[[groups.items]]
id = "a-convnet-for-the-2020s-convnext"
title = "A ConvNet for the 2020s (ConvNeXt)"
authors = "Liu, Mao, Wu, Feichtenhofer, Darrell, Xie"
year = "2022"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/2201.03545"
link_text = "Paper"
description = "Modernizes a plain ResNet step by step with transformer-era design and training choices until it matches Swin. The counterpoint to ViT: much of the gap was recipe, not attention — and CNNs remain the practical choice on constrained hardware."
verified = 2026-10-13
