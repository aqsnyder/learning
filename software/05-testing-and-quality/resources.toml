type = "concept"
description = "Unit, integration, end-to-end — know the right ratio and why most projects get it wrong."

[[groups.items]]
id = "test-driven-development-by-example"
title = "Test Driven Development: By Example"
authors = "Kent Beck"
year = "2002"
type = "book"
description = "TDD philosophy and practice. The red-green-refactor cycle and thinking through tests first."

[[groups.items]]
id = "working-effectively-with-legacy-code"
title = "Working Effectively with Legacy Code"
authors = "Michael Feathers"
year = "2004"
type = "book"
description = "Adding tests to untested code — a skill that's increasingly relevant when reviewing and integrating AI-generated output."

[[groups.items]]
id = "review-ai-generated-tests"
title = "Review AI-generated tests"
type = "practice"
marks = ["ai"]
description = "Critical skill: Do they test behavior or implementation? Do they cover edge cases? Are assertions meaningful? Or are they just making the coverage number go up?"

