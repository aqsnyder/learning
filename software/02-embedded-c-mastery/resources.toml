[[groups]]

[[groups.items]]
id = "the-c-programming-language-k-r-2nd-ed"
title = "*The C Programming Language* (K&R, 2nd ed)"
authors = "Brian W. Kernighan and Dennis M. Ritchie"
year = "1988"
type = "book"
access = "paid"
level = "beginner"
url = "https://www.cs.princeton.edu/~bwk/cbook.html"
link_text = "Kernighan's page"
description = "The classic: short, precise, still worth reading. It covers ANSI C (C89) only, so pair it with *Modern C* or *Effective C* for C99 through C23"
verified = 2026-10-21

[[groups.items]]
id = "expert-c-programming-deep-secrets"
title = "*Expert C Programming*"
authors = "Peter van der Linden"
year = "1994"
type = "book"
access = "paid"
level = "intermediate"
url = "https://www.oreilly.com/library/view/expert-c-programming/0131774298/"
link_text = "oreilly.com"
description = "Linking, memory and the dark corners of C, for programmers who already know the language (Prentice Hall, 1994). Ch. 3 \"Unscrambling Declarations in C\", ch. 5 \"Thinking of Linking\" and ch. 6 \"Poetry in Motion: Runtime Data Structures\" serve exercises 1 and 2. Pre-C99: read it for the mental models, not for current syntax."
verified = 2026-10-21

[[groups.items]]
id = "making-embedded-systems-2nd-ed"
title = "*Making Embedded Systems* (2nd ed)"
authors = "Elecia White"
year = "2024"
type = "book"
access = "paid"
level = "beginner"
marks = ["core"]
url = "https://www.oreilly.com/library/view/making-embedded-systems/9781098151539/"
link_text = "oreilly.com"
description = "Embedded architecture and design patterns from a working engineer (O'Reilly, March 2024). Ch. 4 \"Inputs, Outputs, and Timers\" and ch. 5 \"Interrupts\" back exercises 3 and 4; ch. 2 \"Creating a System Architecture\" frames the mini-project's layering."
verified = 2026-10-21

[[groups.items]]
id = "embedded-software-design"
title = "*Embedded Software Design: A Practical Approach to Architecture, Processes, and Coding Techniques*"
authors = "Jacob Beningo"
year = "2022"
type = "book"
access = "paid"
level = "intermediate"
url = "https://doi.org/10.1007/978-1-4842-8279-3"
link_text = "Apress"
description = "Modern firmware architecture, process and coding techniques (Apress, 2022). The chapters \"Interfaces, Contracts, and Assertions\" and \"Comms, Command Processing, and Telemetry Techniques\" map onto the mini-project's HAL and command shell."
verified = 2026-10-21

[[groups.items]]
id = "embedded-c-coding-standard"
title = "*Embedded C Coding Standard*"
authors = "Barr Group"
type = "book"
access = "free"
level = "beginner"
url = "https://barrgroup.com/embedded-systems/books/embedded-c-coding-standard"
link_text = "barrgroup.com"
description = "Barr Group's free coding standard (print, PDF and HTML), written to minimize bugs and improve portability. Adopt it as your house style; exercises 2 and 4 and the mini-project check code against it."
verified = 2026-10-13

