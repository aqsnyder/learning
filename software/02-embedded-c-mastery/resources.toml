[[groups.items]]
id = "misra-c-2025-misra"
title = "MISRA C:2025 — Guidelines for the use of the C language in critical systems"
authors = "MISRA (The MISRA Consortium Limited)"
year = "2025"
type = "standard"
access = "paid"
url = "https://misra.org.uk/product/misra-c2025/"
link_text = "misra.org.uk"
description = "The safety-critical C subset most embedded static analyzers check against. It supersedes every earlier edition (1998, 2004, 2012, 2019 and 2023) and is the current version as of October 2026; sold as a single-user, on-screen document. Even if you never certify, the rules and their rationale sharpen embedded code review."
verified = 2026-10-21

[[groups]]
title = "Key Concepts"
intro = '''
| Concept | Why It Matters |
|---------|---------------|
| Pointers, memory layout, and stack vs heap | Read C code without confusion |
| `volatile`, `const`, and `static` qualifiers | Critical for embedded correctness |
| Register manipulation and memory-mapped I/O | Hardware-software interface |
| Interrupt handling and ISR design | Real-time responsiveness |
| HAL (Hardware Abstraction Layer) design | Decoupling hardware from logic |
'''
