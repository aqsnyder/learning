[[groups.items]]
id = "embedded-artistry"
title = "A General Overview of What Happens Before main()"
authors = "Phillip Johnston (Embedded Artistry)"
year = "2019"
type = "article"
access = "free"
url = "https://embeddedartistry.com/blog/2019/04/08/a-general-overview-of-what-happens-before-main/"
link_text = "embeddedartistry.com"
more_links = [{ text = "Abstraction Layer (field manual)", url = "https://embeddedartistry.com/fieldmanual-terms/abstraction-layer/" }]
description = "What runs between reset and main(): the entry point, zeroing .bss, global constructors, and the bare-metal, bootloader and OS paths (last updated August 2022). Read it with exercise 1 and Quantum Leaps #13–#15. The site's free field-manual entry on abstraction layers gives the vocabulary for the mini-project's HAL."
verified = 2026-10-21

[[groups.items]]
id = "jacob-beningo"
title = "How to Write Epic Hardware Abstraction Layers (HAL) in C"
authors = "Jacob Beningo"
year = "2023"
type = "article"
access = "free"
url = "https://www.beningo.com/how-to-write-epic-hardware-abstraction-layers-hal-in-c/"
link_text = "beningo.com"
description = "A HAL as a struct of function pointers handed to the application, which never touches registers, so the same application builds for the target and runs on a PC against fakes. The pattern for the mini-project's HAL (last updated July 2026)."
verified = 2026-10-21

[[groups.items]]
