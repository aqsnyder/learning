[[groups]]
outro = '''**Also used here (tracked in its home section):** *Professional CMake* ([Section 12](../12-firmware-toolchain-debug-and-observability/README.md)) for the cross-compilation toolchain file and presets that the mini-project builds with.'''

[[groups.items]]
id = "making-embedded-systems-2nd-ed"
title = "Making Embedded Systems (2nd ed)"
authors = "Elecia White"
year = "2024"
type = "book"
access = "paid"
level = "beginner"
url = "https://www.oreilly.com/library/view/making-embedded-systems/9781098151539/"
link_text = "O'Reilly"
description = "Architecture and design patterns for embedded systems: hardware/software interfaces, interrupts, state machines (ch. 6 \"Managing the Flow of Activity\"), fault handling (ch. 9 \"Getting into Trouble\"), connected devices and firmware updates (ch. 10), and power."
verified = 2026-10-21

[[groups.items]]
id = "modern-embedded-systems-programming"
title = "Modern Embedded Systems Programming: the RTOS (#22–28), event-driven and state-machine (#33–42) and real-time active-object (#43–44) lessons"
authors = "Miro Samek (Quantum Leaps, LLC)"
type = "video-series"
label = "YouTube"
access = "free"
level = "intermediate"
marks = ["core"]
url = "https://www.youtube.com/watch?v=TEq3-p0GWGI&list=PLPW8O6W-1chwyTzI3BHwBLbGQoPFxPAPM"
link_text = "#22 RTOS Part-1"
more_links = [{ text = "#33 Event-Driven Part-1", url = "https://www.youtube.com/watch?v=rfb2JI1GGIc&list=PLPW8O6W-1chwyTzI3BHwBLbGQoPFxPAPM" }, { text = "#35 State Machines Part-1", url = "https://www.youtube.com/watch?v=EBSxZKjgBXI&list=PLPW8O6W-1chwyTzI3BHwBLbGQoPFxPAPM" }, { text = "Lesson index", url = "https://www.state-machine.com/video-course" }]
description = "The part of the course this section uses, with board demos: building an RTOS from a context switch up (#22–28, through mutual exclusion), then event-driven programming and active objects (#33–34), state machines up to hierarchical-state-machine semantics (#35–42), and run-to-completion with RMS/RMA (#43–44). Lessons #54–57 run active objects on the QV and QK kernels, Zephyr (#56) and Linux. The earlier, bare-metal C lessons belong to Section 02."
verified = 2026-10-21

[[groups.items]]
id = "freertos"
title = "FreeRTOS"
authors = "Amazon Web Services (maintainer)"
type = "tool"
label = "RTOS"
access = "free"
marks = ["core"]
url = "https://www.freertos.org/Documentation/02-Kernel/02-Kernel-features/00-Developer-docs"
link_text = "Kernel docs"
more_links = [{ text = "freertos.org", url = "https://www.freertos.org/" }]
description = "The RTOS kernel that exercises 1–3 run on: tasks, queues, semaphores and mutexes, software timers, event groups and task notifications, MIT-licensed and maintained by AWS. Read the kernel source (`tasks.c`, `queue.c`, the Cortex-M33 port) as well as the docs. As of October 2026 the current long-term-support release is 202604.00-LTS."
verified = 2026-10-21

[[groups.items]]
