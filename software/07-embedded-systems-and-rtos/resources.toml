[[groups.items]]
id = "task-scheduling"
title = "Introduction to Embedded Systems: A Cyber-Physical Systems Approach (2nd ed)"
authors = "Edward A. Lee, Sanjit A. Seshia"
year = "2017"
type = "book"
access = "free"
level = "intermediate"
url = "https://ptolemy.berkeley.edu/books/leeseshia/"
link_text = "Book page"
more_links = [{ text = "Free PDF (v2.2)", url = "https://ptolemy.org/books/leeseshia/releases/LeeSeshia_DigitalV2_2.pdf" }]
description = "MIT Press textbook whose authors host a free PDF (CC BY-NC-ND 4.0). Read ch. 11 \"Multitasking\" (threads, processes and message passing) and ch. 12 \"Scheduling\" (rate-monotonic scheduling, earliest deadline first, scheduling and mutual exclusion) for the theory behind exercises 2 and 3; exercise 3 adds exact response-time analysis by iteration."
verified = 2026-10-21

[[groups.items]]
id = "dma-interrupts-and-peripheral-drivers"
title = "A Practical guide to ARM Cortex-M Exception Handling"
authors = "Chris Coleman (Memfault)"
year = "2019"
type = "article"
access = "free"
url = "https://interrupt.memfault.com/blog/arm-cortex-m-exceptions-and-nvic"
link_text = "Interrupt"
description = "The Cortex-M exception model in practice: NVIC priority registers and priority grouping (AIRCR), exception entry and exit, tail-chaining, late-arriving preemption and lazy floating-point state, with code that pends PendSV and nests NVIC interrupts. DMA and driver layering aren't covered; the mini-project practises them against your part's reference manual."
verified = 2026-10-21

[[groups.items]]
id = "cortex-m-rtos-context-switching"
title = "ARM Cortex-M RTOS Context Switching"
authors = "Chris Coleman (Memfault)"
year = "2019"
type = "article"
access = "free"
url = "https://interrupt.memfault.com/blog/cortex-m-rtos-context-switching"
link_text = "Interrupt"
description = "Walks through FreeRTOS's context switch under GDB: which registers the core stacks on exception entry, which the port saves in PendSV, how SysTick pends a switch, how SVC starts the first task, and lazy floating-point stacking. It uses the Cortex-M4F port; exercise 1 does the same trace on the Cortex-M33 port, which adds stack-limit registers."
verified = 2026-10-21

[[groups.items]]
id = "bootloaders-and-ota-updates"
title = "Device Firmware Update Cookbook"
authors = "François Baldassari (Memfault)"
year = "2020"
type = "article"
access = "free"
url = "https://interrupt.memfault.com/blog/device-firmware-update-cookbook"
link_text = "Interrupt"
description = "Architecture and recipes for field updates that can't brick the device: a small immutable bootloader, an updatable loader kept separate from the application, image metadata with a CRC, writing and committing images, and boot-stability counters. It leaves security out on purpose: Section 08 covers signing and the threat model, Section 12 covers MCUboot's slots."
verified = 2026-10-21

[[groups.items]]
id = "debugging-embedded-systems"
title = "A Deep Dive into ARM Cortex-M Debug Interfaces"
authors = "Chris Coleman (Memfault)"
year = "2019"
type = "article"
access = "free"
url = "https://interrupt.memfault.com/blog/a-deep-dive-into-arm-cortex-m-debug-interfaces"
link_text = "Interrupt"
description = "The debugger stack from GDB down to the pins: JTAG and SWD debug ports, the debug access port, J-Link, ST-LINK and CMSIS-DAP probes, and GDB servers such as OpenOCD and pyOCD, ending with a logic-analyzer capture of one SWD transaction. Section 12 goes on to SWO, RTT and tracing."
verified = 2026-10-21

[[groups.items]]
id = "embedded-artistry"
title = "Embedded Artistry — FreeRTOS Task Notifications: A Lightweight Method for Waking Threads"
authors = "Phillip Johnston"
year = "2018"
type = "blog"
access = "free"
url = "https://embeddedartistry.com/blog/2018/05/28/freertos-task-notifications-a-lightweight-method-for-waking-threads/"
link_text = "Task notifications"
more_links = [{ text = "Technique: Selecting Thread Priorities", url = "https://embeddedartistry.com/fieldatlas/technique-selecting-thread-priorities/" }]
description = "Two short Embedded Artistry pieces for exercises 2 and 3. The 2018 article explains when a task notification can replace a binary semaphore (faster and smaller, but it wakes only one task). \"Technique: Selecting Thread Priorities\" (2020, updated 2023) argues for as few priority levels as possible, with unique priorities only where latency matters more than throughput."
verified = 2026-10-21

[[groups.items]]
id = "interrupt-memfault"
title = "Interrupt (Memfault)"
authors = "Memfault team"
type = "blog"
access = "free"
url = "https://interrupt.memfault.com/"
link_text = "Link"
description = "Professional firmware engineering articles covering debugging, RTOS internals, OTA, fault handling, and embedded best practices. Several are listed individually in this section and in Section 12; follow the rest to stay current."
verified = 2026-10-13

[[groups.items]]
id = "gdb-for-embedded"
title = "Advanced GDB Usage"
authors = "Tyler Hoffman (Memfault)"
year = "2020"
type = "article"
access = "free"
url = "https://interrupt.memfault.com/blog/advanced-gdb"
link_text = "Interrupt"
description = "GDB beyond breakpoints, for firmware: printing registers, examining memory with `x`, conditional breakpoints and watchpoints, backtraces for all threads, pretty printers, RTOS thread awareness and SVD peripheral registers. Use it in exercise 5 to decode the fault registers; Section 12 covers connecting through OpenOCD."
verified = 2026-10-21

[[groups.items]]
id = "definitive-guide-to-arm-cortex-m23-and"
title = "Definitive Guide to Arm Cortex-M23 and Cortex-M33 Processors"
authors = "Joseph Yiu"
year = "2020"
type = "book"
access = "paid"
level = "advanced"
marks = ["core"]
