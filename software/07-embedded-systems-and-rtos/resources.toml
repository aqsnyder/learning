title = "Mutexes, semaphores, and queues"
type = "concept"
description = "Inter-task communication and synchronization primitives. Understand when to use each and the pitfalls (deadlocks, priority inversion)."

[[groups.items]]
id = "state-machines-and-event-driven-firmware"
