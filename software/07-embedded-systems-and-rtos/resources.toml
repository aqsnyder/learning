link_text = "Link"
description = "The official FreeRTOS tutorial book, maintained openly on GitHub (text CC BY-SA 4.0). It is also this section's source on choosing synchronization primitives: ch. 5 \"Queue Management\", §7.4 binary semaphores used from interrupts, §8.3 \"Mutexes (and Binary Semaphores)\" with priority inversion, priority inheritance and deadlock, and ch. 10 \"Task Notifications\"."
