# Resources for: Agentic AI Development Workflows
# Edit this file, then run `python tools/build.py` to regenerate README.md, PROGRESS.md and the indexes.
# Field reference: tools/README.md

[[groups]]

[[groups.items]]
id = "the-human-in-the-loop-model"
title = "The human-in-the-loop model"
type = "concept"
marks = ["ai"]
description = "You are the architect, AI is the junior developer. Never blindly accept. Define the *what* and *why*, let AI handle the *how*."

[[groups.items]]
id = "prompt-engineering-for-code"
title = "Prompt engineering for code"
type = "concept"
marks = ["ai"]
description = "Clear context, constraints, and iterative refinement. Specify architecture, not implementation. Better prompts and context mean less rework, not less review."

[[groups.items]]
id = "reviewing-ai-generated-code"
title = "Reviewing AI-generated code"
type = "concept"
marks = ["ai"]
description = "Three-layer review: logic correctness, security, architectural alignment. AI code passes syntax checks but fails design intent — learn to catch that."

[[groups.items]]
id = "ai-assisted-code-review-workflow"
title = "AI-assisted code review workflow"
type = "concept"
marks = ["ai"]
description = "Use AI to review AI output (meta-review), then apply human judgment. The human reviews the *review*, not just the code."

[[groups.items]]
id = "project-context-and-constraints-files"
title = "Project context and constraints files"
type = "concept"
marks = ["ai"]
description = "`AGENTS.md`, rules files, skills — teaching AI your project's conventions. The better the context, the fewer corrections needed."

[[groups.items]]
id = "task-decomposition-for-agents"
title = "Task decomposition for agents"
type = "concept"
marks = ["ai"]
description = "Break complex features into atomic, verifiable tasks. Each task should have a clear input, output, and success criteria."

[[groups.items]]
id = "testing-ai-output"
title = "Testing AI output"
type = "concept"
marks = ["ai"]
description = "AI writes code, you write (or review) the tests. Tests are the specification. If the agent can't pass them, check the spec, the tests, and the task size; and when it does pass, check it didn't weaken, skip, or special-case a test to get there."

[[groups.items]]
id = "avoiding-the-tower-of-babel"
title = "Avoiding the \"Tower of Babel\""
type = "concept"
marks = ["ai"]
description = "Maintaining style consistency when multiple agents generate code. Enforce linting, formatting, and naming conventions ruthlessly."

