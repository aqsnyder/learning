[[groups.items]]
id = "what-s-new-in-python-3-13-3-15"
title = "What's New in Python (3.13 → 3.15)"
type = "docs"
access = "free"
url = "https://docs.python.org/3/whatsnew/index.html"
link_text = "What's New in Python"
description = "Read the notes for every version you ship on. 3.13 (Oct 2024) added an experimental free-threaded (no-GIL) build and a basic JIT, off by default; 3.14 (Oct 2025) made free-threading officially supported (PEP 779) and annotations lazily evaluated (PEP 649/749); 3.15 (9 Oct 2026) adds explicit lazy imports (PEP 810), a `profiling` package with a sampling profiler (PEP 799) and a stable ABI for free-threaded builds (PEP 803). The JIT is still labelled experimental in 3.15. Pair with the [free-threading HOWTO](https://docs.python.org/3/howto/free-threading-python.html) before trusting C extensions under threads"
verified = 2026-10-13

