title = "Key Concepts"
intro = '''
| Concept | Why It Matters |
|---------|---------------|
| Big-O complexity analysis | Read code and assess performance without running it |
| Data structures recognition | Arrays, hash maps, trees, graphs, heaps — know when code uses the wrong one |
| Recursion and dynamic programming | Pattern recognition in code review |
