[[groups.items]]
id = "ground-plane-splits"
title = "Ground Plane Splits"
type = "concept"
description = "When and why to split ground planes (usually: don't). Understand the consequences before you cut a plane."

[[groups.items]]
id = "mt-031-grounding-data-converters-and"
title = "MT-031: Grounding Data Converters and Solving the Mystery of \"AGND\" and \"DGND\" (2008)"
authors = "Walt Kester, James Bryant, Mike Byrne (Analog Devices)"
year = "2008"
type = "app-note"
url = "https://www.analog.com/media/en/training-seminars/tutorials/mt-031.pdf"
link_text = "PDF"
description = "The canonical answer to \"what do I do with AGND and DGND?\". For converters with low digital currents, tie both pins to the analog ground plane right at the part. Read it before splitting any plane on a mixed-signal board."
verified = 2026-10-13

[[groups.items]]
id = "an-136-pcb-layout-considerations-for-non"
title = "AN-136: PCB Layout Considerations for Non-Isolated Switching Power Supplies"
authors = "Henry Zhang (Analog Devices)"
type = "app-note"
url = "https://www.analog.com/en/resources/app-notes/an-136.html"
link_text = "App note"
description = "The standard reference for buck/boost converter layout: power-stage placement, the high-di/dt \"hot loop\", and grounding of the power and control sections."
verified = 2026-10-13

[[groups.items]]
id = "fasthenry2"
title = "FastHenry2"
authors = "Mattan Kamon (MIT, original FastHenry); FastFieldSolvers S.R.L. (Windows port)"
type = "tool"
url = "https://www.fastfieldsolvers.com/software.htm"
link_text = "fastfieldsolvers.com"
description = "Free, open-source 3D inductance extractor. It computes the frequency-dependent self and mutual inductance and resistance of an arbitrary conductor geometry (magnetoquasistatic) and can export a SPICE equivalent circuit. Use it to check hand estimates of capacitor-mounting, via and plane-pair loop inductance (Practice 3). The FastFieldSolvers build is a Windows port; binaries and source are on its download page."
verified = 2026-10-13
