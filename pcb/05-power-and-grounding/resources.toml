[[groups.items]]
id = "saturn-pcb-design-toolkit"
title = "Saturn PCB Design Toolkit"
authors = "Saturn PCB Design, Inc."
type = "tool"
access = "free"
url = "https://saturnpcb.com/saturn-pcb-toolkit/"
link_text = "Website"
description = "Free (Windows) calculator suite. This section uses two of its calculators: the conductor-current calculator, which follows IPC-2152 (the vendor notes that calculators built on the old IPC-2221 formula are obsolete), to size traces and planes for current, and the via calculator for Practice 3's via inductance. Section 08 lists the same toolkit for its impedance calculators."
verified = 2026-10-21

[[groups.items]]
id = "ipc-2152-standard-for-determining"
title = "IPC-2152 — Standard for Determining Current-Carrying Capacity in Printed Board Design (2009)"
authors = "IPC"
year = "2009"
type = "standard"
access = "paid"
url = "https://pcdandf.com/pcdesign/index.php/editorial/menu-new-indust-prod/5545-ipc-releases-ipc-2152-standard"
link_text = "PCD&F release note"
description = "Replaced the IPC-2221 conductor-sizing charts (which date to 1956) with new test data for internal and external conductors, in air and in vacuum. IPC sells the standard (the link is PCD&F's release announcement); you can apply it for free through Saturn's conductor-current calculator whenever you size traces or planes for current."
verified = 2026-10-13

[[groups.items]]
id = "mt-101-decoupling-techniques-2009"
