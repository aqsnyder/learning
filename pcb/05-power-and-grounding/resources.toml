authors = "Henry Zhang (Analog Devices)"
type = "app-note"
access = "free"
url = "https://www.analog.com/en/resources/app-notes/an-136.html"
link_text = "App note"
description = "The standard reference for buck/boost converter layout: power-stage placement, the high-di/dt \"hot loop\", and grounding of the power and control sections."
verified = 2026-10-21
year = "2012"

[[groups.items]]
id = "fasthenry2"
title = "FastHenry2"
authors = "Mattan Kamon (MIT, original FastHenry); FastFieldSolvers S.R.L. (Windows port)"
type = "tool"
access = "free"
url = "https://www.fastfieldsolvers.com/software.htm"
link_text = "fastfieldsolvers.com"
description = "Free, open-source 3D inductance extractor. It computes the frequency-dependent self and mutual inductance and resistance of an arbitrary conductor geometry (magnetoquasistatic) and can export a SPICE equivalent circuit. Use it to check hand estimates of capacitor-mounting, via and plane-pair loop inductance (Practice 3). The FastFieldSolvers build is a Windows port; binaries and source are on its download page."
verified = 2026-10-13
