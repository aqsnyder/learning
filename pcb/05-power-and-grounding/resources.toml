[[groups.items]]
id = "mt-031-grounding-data-converters-and"
title = "MT-031: Grounding Data Converters and Solving the Mystery of \"AGND\" and \"DGND\" (2008)"
authors = "Walt Kester, James Bryant, Mike Byrne (Analog Devices)"
year = "2008"
type = "app-note"
access = "free"
url = "https://www.analog.com/media/en/training-seminars/tutorials/mt-031.pdf"
link_text = "PDF"
description = "The canonical answer to \"what do I do with AGND and DGND?\". For converters with low digital currents, tie both pins to the analog ground plane right at the part. Read it, with Hartley's grounding talk, before splitting any plane on a mixed-signal board: a split is rarely the answer."
verified = 2026-10-13

[[groups.items]]
id = "an-136-pcb-layout-considerations-for-non"
