[[groups.items]]
id = "saturn-pcb-design-toolkit"
title = "Saturn PCB Design Toolkit"
type = "tool"
url = "https://saturnpcb.com/saturn-pcb-toolkit/"
link_text = "Website"
description = "Free (Windows) calculators for trace width, via current, impedance, thermal resistance, and more. Its conductor-current calculator follows IPC-2152, and the vendor notes that calculators built on the old IPC-2221 formula are obsolete. Essential desktop tool."
verified = 2026-10-13

[[groups.items]]
id = "ipc-2152-standard-for-determining"
title = "IPC-2152 — Standard for Determining Current-Carrying Capacity in Printed Board Design (2009)"
authors = "IPC"
year = "2009"
type = "standard"
url = "https://pcdandf.com/pcdesign/index.php/editorial/menu-new-indust-prod/5545-ipc-releases-ipc-2152-standard"
link_text = "PCD&F release note"
description = "Replaced the IPC-2221 conductor-sizing charts (which date to 1956) with new test data for internal and external conductors, in air and in vacuum. Use it, for example through Saturn, whenever you size traces or planes for current."
verified = 2026-10-13

[[groups.items]]
id = "decoupling-capacitor-placement-and"
title = "Decoupling Capacitor Placement and Selection"
