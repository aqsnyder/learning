type = "docs"
label = "Reference"
access = "paid"
url = "https://shop.electronics.org/ipc-2221/ipc-2221-standard-only/Revision-c/english"
link_text = "IPC store (Rev C)"
description = "The design-side rules fabrication depends on (annular rings, hole/land sizes, clearances, test coupons). IPC-2221 is a design standard; fabricated-board acceptance is covered by IPC-6012 / IPC-A-600. Section numbers here follow Rev A (2003); the current revision is IPC-2221C (2023)"
verified = 2026-10-21

