access = "free"
url = "https://resources.altium.com/p/using-an-ipc-2221-calculator-for-high-voltage-design"
link_text = "resources.altium.com"
description = "A free route to IPC-2221's conductor-spacing table (Table 6-1 in Rev A; the article shows it as an image): the categories for internal, external uncoated, coated and assembled conductors, the per-volt rule above 500 V with a worked example, and the column definitions in Rev B and Rev C (2023), with a calculator. Use it for Practice 2's high-voltage netclass, and remember that it is a design guideline, not a safety rating."
verified = 2026-10-21

