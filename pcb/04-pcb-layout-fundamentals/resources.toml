[[groups.items]]
id = "an2867-guidelines-for-oscillator-design"
title = "AN2867 — Guidelines for oscillator design on STM8 and STM32 MCUs/MPUs (Rev 24)"
authors = "STMicroelectronics"
year = "2026"
type = "app-note"
access = "free"
url = "https://www.st.com/resource/en/application_note/an2867-guidelines-for-oscillator-design-on-stm8afals-and-stm32-mcusmpus-stmicroelectronics.pdf"
link_text = "PDF"
description = "Crystal selection (gain margin, load capacitors) plus PCB layout rules for the oscillator: a compact loop, guard ring and separated ground (Section 7). A crystal that won't start is a classic bring-up failure, and good layout prevents it."
