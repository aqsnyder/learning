[[groups]]
outro = '''
**Also used here (tracked in their home sections):** KiCad Calculator Tools ([Section 01](../01-pcb-anatomy-and-materials/README.md)) for Practice 1 (coplanar waveguide with ground) and Practice 2 (electrical spacing); Saturn PCB Toolkit's impedance calculator ([Section 08](../08-multi-layer-and-stackup/README.md)) as a cross-check in Practice 1; the JLCPCB capabilities page ([Section 09](../09-dfm-and-fabrication/README.md)) and IPC-2221 ([Section 01](../01-pcb-anatomy-and-materials/README.md); Table 6-1 in Rev A, paid) for Practice 2; AN-136's hot-loop placement ([Section 05](../05-power-and-grounding/README.md)) for Practice 3; for guarding, leakage and Kelvin connections (Practice 4 and the mini-project), *The Art of Electronics* Ch. 5 ([Section 00](../00-electronics-fundamentals/README.md)) and the precision-measurement resources of [Section 12](../12-analog-mixed-signal-and-precision-measurement/README.md).
'''

