# Resources for: Signal Integrity
# Edit this file, then run `python tools/build.py` to regenerate README.md, PROGRESS.md and the indexes.
# Field reference: tools/README.md

[[groups]]
outro = '''
**Also used here (tracked in their home sections):** LTspice ([Section 00](../00-electronics-fundamentals/README.md)) for Practices 1 and 3; KiCad Calculator Tools ([Section 01](../01-pcb-anatomy-and-materials/README.md)) and Saturn PCB Toolkit's impedance and crosstalk calculators ([Section 08](../08-multi-layer-and-stackup/README.md)) for Practices 2–4; the differential-pair and length-tuning chapters of the KiCad 10 PCB Editor manual ([Section 04](../04-pcb-layout-fundamentals/README.md)) for Practice 4; Rick Hartley's *How to Achieve Proper Grounding* ([Section 05](../05-power-and-grounding/README.md)) for return paths and reference planes; impedance-controlled stackups ([Section 08](../08-multi-layer-and-stackup/README.md)); Dr. EMC's electromagnetics videos ([Section 07](../07-emc-and-compliance/README.md)) as optional field intuition.
'''

