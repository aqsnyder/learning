id = "commaai-hardware"
title = "CommaAI hardware"
type = "tool"
label = "Open Source"
url = "https://github.com/commaai"
link_text = "GitHub"
description = "Small vehicle-interface boards, not current automotive designs. comma.ai's published board files are older Eagle-format CAN-interface and harness boards (e.g., the pedal interceptor and giraffe). The [panda](https://github.com/commaai/panda) repo (an STM32H7 CAN/CAN FD interface) holds firmware and software only. Useful for studying input protection and CAN interfacing in a vehicle environment"
verified = 2026-10-13

