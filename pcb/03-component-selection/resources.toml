[[groups.items]]
id = "temperature-and-voltage-variation-of"
title = "Temperature and Voltage Variation of Ceramic Capacitors, or Why Your 4.7µF Capacitor Becomes a 0.33µF Capacitor (Maxim AN5527, 2012)"
authors = "Maxim Integrated (now Analog Devices)"
year = "2012"
type = "app-note"
access = "free"
marks = ["core"]
url = "https://www.analog.com/en/resources/technical-articles/temperature-and-voltage-variation-ceramic-capacitor.html"
link_text = "analog.com"
description = "Measured DC-bias and temperature derating of real MLCCs. A 4.7 µF, 16 V, 0805 X7R keeps about 1.5 µF (33 %) at 12 V; in the same test a 1206 kept 73 % and a 1210 about 88 %, with no further gain from larger cases. A 4.7 µF, 6.3 V, 0603 Y5V falls to 0.33 µF at 5 V. The key point: X7R/X5R codes specify temperature behaviour only, with no voltage-coefficient limit, so specify manufacturer part numbers from their bias curves, not dielectric codes. Now hosted by Analog Devices; the page names no author."
verified = 2026-10-13

[[groups.items]]
id = "j-std-048a-notification-standard-for"
title = "J-STD-048A Notification Standard for Product Discontinuance · J-STD-046A Customer Notification Standard for Product/Process Changes by Electronic Product Suppliers (both 2025)"
authors = "JEDEC (J-STD-048A jointly with ECIA and IPC)"
year = "2025"
type = "standard"
access = "free"
marks = ["core"]
url = "https://www.jedec.org/node/8470"
link_text = "J-STD-048A"
more_links = [{ text = "J-STD-046A", url = "https://www.jedec.org/node/8587" }]
description = "The joint industry standards (048A is JEDEC/ECIA/IPC) that define what an end-of-life notice and a product/process change notice (PCN) must tell you. 048A supersedes JESD48; its predecessor JESD48C (2011) required at least 6 months from notice for final orders and 12 months for final shipments, so check 048A's current windows. Free from JEDEC with registration. Use them to set your last-time-buy and redesign triggers."
verified = 2026-10-13

