[[groups.items]]
id = "ipc-2221-generic-standard-on-printed"
title = "IPC-2221 Generic Standard on Printed Board Design"
authors = "IPC"
year = "2023"
type = "standard"
access = "paid"
url = "https://shop.electronics.org/ipc-2221/ipc-2221-standard-only/Revision-c/english"
link_text = "IPC store (Rev C)"
description = "THE foundational IPC design standard, sold by IPC (current revision C, 2023; earlier: B, 2012, and A, 2003). Section, table and figure numbers in this curriculum follow Rev A; in a later revision, find the same topic by name. Its conductor current charts (Fig. 6-4) date from a 1956 NBS report, and the internal-layer curve was never tested (it is just half the external one; see Appendix B of Rev A). IPC-2152 (2009) replaced those charts, so size traces for current with IPC-2152 (Section 05), not Fig. 6-4"
verified = 2026-10-21

