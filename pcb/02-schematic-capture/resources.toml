description = "The official KiCad 10 tutorial: one project taken from schematic through circuit board to fabrication outputs, then custom symbols and footprints. KiCad 10.0 was released on 20 March 2026 and is the current version (10.0.7 as of October 2026); it adds design variants (several versions of one project), a graphical design-rule editor and time-domain tuning constraints, and extends design blocks (introduced in 9.0) to the PCB editor."
