[[groups.items]]
id = "fcc-ce-compliance-testing-overview"
title = "FCC/CE Compliance Testing Overview"
type = "concept"
description = "What the test process looks like, what standards apply, and how to design for compliance from the start. Test-and-measurement and lab equipment has its own product standards: IEC 61326-1 (EMC for measurement, control and laboratory equipment; current edition 2020) and [IEC 61010-1](https://webstore.iec.ch/en/publication/4279) (safety, including spacing requirements; edition 3.0, 2010, with Amendment 1, 2016). Identify which ones apply before the first layout, not after."
