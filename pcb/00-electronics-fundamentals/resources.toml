year = "2015"
type = "book"
access = "paid"
level = "beginner"
marks = ["core"]
url = "https://artofelectronics.net/"
link_text = "artofelectronics.net"
description = "Horowitz and Hill's reference on practical circuit design; this section uses Ch. 1, 4, 5 and 8, and the rest is reference. Its advanced companion, *The Art of Electronics: The x-Chapters*, gets an expanded 2nd edition in 2026 that adds a 100+ page chapter on sensors ([x.artofelectronics.net](https://x.artofelectronics.net/); as of October 2026)"
verified = 2026-10-13

[[groups.items]]
id = "learning-the-art-of-electronics"
title = "*Learning the Art of Electronics: A Hands-On Lab Course* (2nd ed.)"
authors = "Thomas C. Hayes & David Abrams"
type = "book"
label = "Book (Lab Companion)"
access = "paid"
level = "beginner"
marks = ["core"]
url = "https://learningtheartofelectronics.com/"
link_text = "Book site"
description = "The hands-on lab course that accompanies *The Art of Electronics*: do its labs alongside the AoE chapters. A paid Cambridge University Press book; the second edition (2025) covers analog circuits, then digital ones through Verilog on programmable logic and an ARM microcontroller running an RTOS. The book site has the table of contents, online chapters, parts lists and errata."
verified = 2026-10-21
year = "2025"
more_links = [{ text = "Cambridge University Press", url = "https://www.cambridge.org/us/universitypress/subjects/physics/electronics-physicists/learning-art-electronics-hands-lab-course-2nd-edition" }]

