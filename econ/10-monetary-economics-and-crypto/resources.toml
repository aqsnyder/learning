year = "2008"
type = "paper"
access = "free"
url = "https://bitcoin.org/bitcoin.pdf"
link_text = "bitcoin.pdf"
description = "The Bitcoin whitepaper, announced on 31 October 2008: electronic cash with no trusted third party, in which a peer-to-peer network prevents double-spending and the proof-of-work that creates new coins also secures the ledger. Practice 2 reproduces its attacker calculation. Also used in btc/00."
verified = 2026-10-13

