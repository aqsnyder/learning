title = "Money: The Unauthorized Biography"
authors = "Felix Martin"
year = "2013"
type = "book"
description = "Engaging history of money from Babylonian clay tablets to modern financial systems. Challenges conventional narratives."

[[groups.items]]
id = "denationalisation-of-money-the-argument"
title = "Denationalisation of Money: The Argument Refined"
authors = "F.A. Hayek"
year = "1976 (2nd ed. 1978)"
type = "book"
url = "https://mises.org/library/denationalisation-money-argument-refined"
link_text = "Link"
description = "Hayek's prescient argument for competing private currencies. Intellectual precursor to cryptocurrency. The 1976 first edition was subtitled *An Analysis of the Theory and Practice of Concurrent Currencies*; the link is the expanded *Argument Refined* text (Institute of Economic Affairs, 3rd ed., 1990), hosted by the Mises Institute, an advocacy site."
verified = 2026-10-13

