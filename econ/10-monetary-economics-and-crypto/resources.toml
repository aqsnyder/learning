[[groups.items]]
id = "the-bitcoin-standard"
title = "The Bitcoin Standard"
authors = "Saifedean Ammous"
year = "2018"
type = "book"
access = "paid"
level = "beginner"
url = "https://saifedean.com/thebitcoinstandard/"
link_text = "Link"
description = "Accessible case for Bitcoin as sound money, grounded in Austrian monetary economics. Covers the history of money, monetary policy failures, and Bitcoin's economic design. An advocacy book from a heterodox school: read it as a thesis to test against the mainstream sources in this section, not as settled economics."
verified = 2026-10-13

[[groups.items]]
