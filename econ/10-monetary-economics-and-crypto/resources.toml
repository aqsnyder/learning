[[groups.items]]
id = "taming-wildcat-stablecoins"
title = "Taming Wildcat Stablecoins"
authors = "Gary B. Gorton & Jeffery Y. Zhang"
year = "2023"
type = "paper"
access = "free"
url = "https://repository.law.umich.edu/articles/2896"
link_text = "Link"
description = "*University of Chicago Law Review* 90(3): 909–972 (2023). Banking history applied to crypto: stablecoins are a return of the private banknotes of the 1800s, money that is not always accepted at face value, from issuers prone to destabilizing runs. Reviews how existing law treats them and three policy responses: issuance only through banks, one-for-one backing with safe assets, or sovereign digital money instead. An argument, not a neutral survey; read it with the BIS chapter before Practice 5."
verified = 2026-10-21

[[groups.items]]
id = "anatomy-of-a-run-the-terra-luna-crash"
title = "Anatomy of a Run: The Terra Luna Crash"
authors = "Jiageng Liu, Igor Makarov & Antoinette Schoar"
year = "2023"
type = "paper"
access = "free"
url = "https://www.nber.org/papers/w31160"
link_text = "Link"
description = "NBER WP 31160 (April 2023; published in the *Journal of Financial Economics* 184, 2026). Terra's collapse in May 2022 erased about $50 billion within three days, centered on a run on UST deposits in the Anchor protocol. Large, sophisticated holders ran first and lost less; public blockchain records let investors watch one another, which sped up the run. The empirical counterpart to Practice 5."
verified = 2026-10-21

