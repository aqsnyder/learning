[[groups.items]]
id = "anatomy-of-a-run-the-terra-luna-crash"
title = "Anatomy of a Run: The Terra Luna Crash"
authors = "Jiageng Liu, Igor Makarov & Antoinette Schoar"
year = "2023"
type = "paper"
access = "free"
url = "https://www.nber.org/papers/w31160"
link_text = "Link"
description = "NBER WP 31160 (published in the *Journal of Financial Economics*, 2026). Terra's collapse in May 2022 erased about $50 billion within three days, centered on a run on UST deposits in the Anchor protocol. Large, sophisticated holders ran first and lost less; public blockchain records let investors watch one another, which sped up the run. The empirical counterpart to Practice 5."
verified = 2026-10-13

[[groups.items]]
id = "iii-the-next-generation-monetary-and"
title = "III. The next-generation monetary and financial system (BIS Annual Economic Report 2025)"
authors = "Bank for International Settlements"
year = "2025"
type = "report"
url = "https://www.bis.org/publ/arpdf/ar2025e3.htm"
link_text = "Link"
description = "The central banks' view. Stablecoins fall short of the requirements to be the mainstay of the monetary system: they fail the tests of singleness, elasticity and integrity. The chapter proposes a unified ledger of tokenised central-bank reserves, commercial-bank money and government bonds instead. Read it as one side of the argument, not the last word."
verified = 2026-10-13
