outro = '''
> **Also used here:** Eric Budish, *The Economic Limits of Bitcoin and the Blockchain* (2018; published in the *QJE* in 2025 as "Trust at Scale"). Its home is [btc/09](../../btc/09-economics-and-game-theory/README.md), where it is linked and tracked; objective 4 and Practice 3 in this section build on it.
