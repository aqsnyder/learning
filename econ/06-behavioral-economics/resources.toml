[[groups]]

[[groups.items]]
id = "misbehaving-the-making-of-behavioral"
title = "Misbehaving: The Making of Behavioral Economics"
authors = "Richard H. Thaler"
year = "2015 (paperback 2016)"
type = "book"
access = "paid"
level = "beginner"
marks = ["core"]
url = "https://wwnorton.com/books/misbehaving/"
link_text = "Norton"
description = "The autobiographical account of behavioral economics by one of its founders. Covers mental accounting, the endowment effect, fairness, and nudges through engaging stories. ⚠️ Some findings it recounts are contested, notably the mug endowment effect (see the Anomalies row below)."
verified = 2026-10-21

[[groups.items]]
id = "nudge-improving-decisions-about-health"
title = "Nudge: Improving Decisions About Health, Wealth, and Happiness"
authors = "Richard Thaler & Cass Sunstein"
year = "2008 (Final Edition 2021)"
type = "book"
access = "paid"
level = "beginner"
marks = ["core"]
url = "https://www.penguinrandomhouse.com/books/304634/nudge-by-richard-h-thaler-and-cass-r-sunstein/"
link_text = "Link"
description = "The influential book on choice architecture and libertarian paternalism; the link is the 2021 Final Edition. ⚠️ Nudge effects at scale are far smaller than in the headline studies: DellaVigna & Linos (below) find about 1.4 percentage points in nudge-unit trials versus 8.7 in published papers, so treat the book's examples as hypotheses (Practice 4)."

[[groups.items]]
id = "mental-accounting-matters"
title = "Mental Accounting Matters"
authors = "Richard Thaler"
year = "1999"
type = "paper"
access = "paid"
url = "https://doi.org/10.1002/(SICI)1099-0771(199909)12:3%3C183::AID-BDM318%3E3.0.CO;2-F"
link_text = "Link"
description = "How people mentally categorize and track money, leading to systematic deviations from rational behavior."
verified = 2026-10-13

[[groups.items]]
id = "anomalies-series"
title = "Anomalies (column series in the *Journal of Economic Perspectives*)"
authors = "Richard H. Thaler, with Daniel Kahneman, Jack L. Knetsch & George Loewenstein"
year = "1987–1991"
type = "paper"
access = "free"
url = "https://www.aeaweb.org/articles?id=10.1257/jep.5.1.193"
link_text = "Endowment effect (1991)"
more_links = [{ text = "Intertemporal choice (1989)", url = "https://www.aeaweb.org/articles?id=10.1257/jep.3.4.181" }, { text = "The January effect (1987, the first column)", url = "https://www.aeaweb.org/articles?id=10.1257/jep.1.1.197" }]
description = "Thaler's column documenting violations of standard economic theory, free on the AEA site. Read the two columns this section uses: Kahneman, Knetsch & Thaler, \"The Endowment Effect, Loss Aversion, and Status Quo Bias\" (1991; Check Yourself 2) and Loewenstein & Thaler, \"Intertemporal Choice\" (1989; Practice 2). ⚠️ The mug endowment effect is contested: Plott & Zeiler ([*AER* 2005](https://www.aeaweb.org/articles?id=10.1257/0002828054201387)) found no gap between willingness to accept and willingness to pay for mugs or lotteries once subjects were trained on the elicitation procedure, and argued such gaps are not evidence of loss aversion."
verified = 2026-10-21

[[groups.items]]
id = "libertarian-paternalism"
title = "Libertarian Paternalism"
authors = "Richard Thaler & Cass Sunstein"
year = "2003"
type = "paper"
access = "paid"
url = "https://www.aeaweb.org/articles?id=10.1257/000282803321947001"
