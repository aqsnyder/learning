[[groups.items]]
id = "noise-a-flaw-in-human-judgment"
title = "Noise: A Flaw in Human Judgment"
authors = "Daniel Kahneman, Olivier Sibony & Cass R. Sunstein"
year = "2021"
type = "book"
access = "paid"
level = "beginner"
url = "https://www.hachettebookgroup.com/titles/daniel-kahneman/noise/9780316451406/?lens=little-brown"
link_text = "Little, Brown Spark"
description = "Companion to *Thinking, Fast and Slow*, focusing on variability (noise) rather than bias in human judgments: system, level and pattern noise, noise audits, and decision hygiene. The method behind Practice 3."
verified = 2026-10-21

