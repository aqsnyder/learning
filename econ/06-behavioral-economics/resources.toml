authors = "Richard Thaler & Cass Sunstein"
year = "2008 (Final Edition 2021)"
type = "book"
marks = ["core"]
url = "https://www.penguinrandomhouse.com/books/304634/nudge-by-richard-h-thaler-and-cass-r-sunstein/"
link_text = "Link"
description = "The influential book on choice architecture and libertarian paternalism. Shaped public policy worldwide."

