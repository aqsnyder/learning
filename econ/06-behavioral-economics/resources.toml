[[groups.items]]
id = "behavioral-scientist"
title = "Behavioral Scientist"
authors = "Behavioral Scientist (magazine)"
type = "blog"
access = "partial"
url = "https://behavioralscientist.org/"
link_text = "Link"
description = "Online magazine on behavioral science research and its applications, with paid print, digital and event subscription tiers. Use its coverage of nudge replication for Practice 4, and check the underlying studies before trusting a headline effect."
