[[groups]]

[[groups.items]]
id = "misbehaving-the-making-of-behavioral"
title = "Misbehaving: The Making of Behavioral Economics"
authors = "Richard Thaler"
year = "2015"
type = "book"
marks = ["core"]
description = "The autobiographical account of behavioral economics by one of its founders. Covers mental accounting, endowment effect, fairness, and nudges through engaging stories. Essential."

[[groups.items]]
id = "nudge-improving-decisions-about-health"
