[[groups.items]]
id = "psychology-and-economics-evidence-from"
title = "Psychology and Economics: Evidence from the Field"
authors = "Stefano DellaVigna"
year = "2009"
type = "paper"
url = "https://www.aeaweb.org/articles?id=10.1257/jel.47.2.315"
link_text = "Link"
description = "The standard survey of behavioral economics in the field, organized by nonstandard preferences (self-control, reference dependence, social preferences), beliefs, and decision-making — plus how firms, employers, and markets respond. The rigorous backbone that the popular books lack."
verified = 2026-10-13

[[groups.items]]
id = "rcts-to-scale-comprehensive-evidence"
title = "RCTs to Scale: Comprehensive Evidence from Two Nudge Units"
authors = "Stefano DellaVigna & Elizabeth Linos"
year = "2022"
type = "paper"
url = "https://www.nber.org/papers/w27594"
link_text = "Link"
description = "126 RCTs covering 23 million people from two U.S. Nudge Units: average effect 1.4 percentage points (8%) versus 8.7 points (33%) in academic journals, largely due to selective publication. The essential calibration for *Nudge*."
verified = 2026-10-13

[[groups.items]]
id = "behavioral-game-theory-experiments-in"
title = "Behavioral Game Theory: Experiments in Strategic Interaction"
authors = "Colin Camerer"
year = "2003"
type = "book"
url = "https://press.princeton.edu/books/hardcover/9780691090399/behavioral-game-theory"
link_text = "Link"
description = "How real people play games in the lab (ultimatum and trust games, limited strategic reasoning, learning) and the models built to fit them. Bridges Sections 02 and 06, and is directly relevant to modeling humans in multi-agent AI."
verified = 2026-10-13
