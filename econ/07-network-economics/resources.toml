[[groups.items]]
id = "platform-revolution"
title = "Platform Revolution: How Networked Markets Are Transforming the Economy and How to Make Them Work for You"
authors = "Geoffrey G. Parker, Marshall W. Van Alstyne & Sangeet Paul Choudary"
year = "2016 (paperback 2017)"
type = "book"
access = "paid"
