[[groups.items]]
id = "networks-crowds-and-markets"
title = "Networks, Crowds, and Markets"
authors = "David Easley & Jon Kleinberg"
year = "2010"
type = "book"
access = "free"
level = "intermediate"
marks = ["core"]
url = "https://www.cs.cornell.edu/home/kleinber/networks-book/"
