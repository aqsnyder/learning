[[groups.items]]
id = "metcalfe-s-law-is-wrong"
title = "Metcalfe's Law is Wrong"
authors = "Bob Briscoe, Andrew Odlyzko & Benjamin Tilly"
year = "2006"
type = "article"
access = "free"
url = "https://spectrum.ieee.org/metcalfes-law-is-wrong"
link_text = "Link"
description = "Argues a network's value grows roughly like n·log(n), not n², because not all connections are equally valuable — so Metcalfe's law overstates the value of large networks. A needed corrective to n² claims common in crypto valuation arguments (compare btc Section 09)."
verified = 2026-10-13
