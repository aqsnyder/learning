[[groups.items]]
id = "the-use-of-knowledge-in-society"
title = "The Use of Knowledge in Society"
authors = "F.A. Hayek"
year = "1945"
type = "paper"
access = "free"
url = "https://www.econlib.org/library/Essays/hykKnw.html"
link_text = "Link"
description = "Foundational essay on the price system as a mechanism for information aggregation. Essential for understanding why markets work."
verified = 2026-10-13

[[groups.items]]
id = "allocative-efficiency-of-markets-with"
title = "Allocative Efficiency of Markets with Zero-Intelligence Traders: Market as a Partial Substitute for Individual Rationality"
authors = "Dhananjay K. Gode & Shyam Sunder"
year = "1993"
type = "paper"
access = "paid"
url = "https://doi.org/10.1086/261868"
link_text = "Link"
description = "Double-auction experiments (*Journal of Political Economy*) in which budget-constrained traders who bid at random reach high allocative efficiency while unconstrained random traders do not: the market's rules, not the traders' intelligence, do much of the work. The model the mini-project rebuilds to probe Hayek."
verified = 2026-10-21

[[groups.items]]
id = "the-problem-of-social-cost"
title = "The Problem of Social Cost"
authors = "Ronald Coase"
year = "1960"
type = "paper"
access = "free"
url = "https://www.law.uchicago.edu/files/file/coase-problem.pdf"
link_text = "Link"
description = "Introduced the Coase theorem — foundational for law and economics. Shows how property rights and bargaining resolve externalities."
verified = 2026-10-13

[[groups.items]]
id = "beyond-markets-and-states-polycentric"
title = "Beyond Markets and States: Polycentric Governance of Complex Economic Systems"
authors = "Elinor Ostrom"
year = "2009"
type = "paper"
access = "free"
url = "https://www.nobelprize.org/prizes/economics/2009/ostrom/lecture/"
link_text = "Link"
description = "Ostrom's Nobel lecture: field evidence that communities often manage shared resources (fisheries, forests, irrigation) well without either privatization or state control — the empirical answer to the \"tragedy of the commons.\" Summarizes the work behind her book *Governing the Commons* (1990) and fills this section's gap on public goods and common-pool resources."
verified = 2026-10-13

[[groups.items]]
id = "models-in-microeconomic-theory"
title = "Models in Microeconomic Theory"
authors = "Martin J. Osborne & Ariel Rubinstein"
year = "2020"
type = "book"
access = "free"
level = "intermediate"
url = "https://www.openbookpublishers.com/books/10.11647/obp.0204"
link_text = "Link"
description = "Free, concise, mathematically careful micro text from the authors of *A Course in Game Theory*. A good free bridge between Varian and MWG; an expanded second edition is also available from the publisher."
verified = 2026-10-13
