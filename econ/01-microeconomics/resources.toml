[[groups.items]]
id = "microeconomic-theory"
title = "Microeconomic Theory"
authors = "Andreu Mas-Colell, Michael D. Whinston & Jerry R. Green"
year = "1995"
type = "book"
access = "paid"
level = "advanced"
url = "https://global.oup.com/ushe/product/microeconomic-theory-9780195073409"
link_text = "Oxford University Press"
description = "The standard graduate reference for microeconomics (\"MWG\"; 1,008 pages), with rigorous proofs of duality, general equilibrium and the welfare theorems. Not for a first pass: use it after Varian and Osborne & Rubinstein, e.g. for the optional duality part of Practice 1."
verified = 2026-10-21

[[groups.items]]
id = "price-theory"
title = "Price Theory"
authors = "David Friedman"
year = "1990"
type = "book"
access = "free"
level = "intermediate"
url = "http://www.daviddfriedman.com/Academic/Price_Theory/PThy_ToC.html"
link_text = "Link"
