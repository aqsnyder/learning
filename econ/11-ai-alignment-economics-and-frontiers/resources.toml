# Resources for: AI Alignment through an Economic Lens
# Edit this file, then run `python tools/build.py` to regenerate README.md, PROGRESS.md and the indexes.
# Field reference: tools/README.md

[[groups]]

[[groups.items]]
id = "categorizing-variants-of-goodhart-s-law"
title = "Categorizing Variants of Goodhart's Law"
authors = "David Manheim & Scott Garrabrant"
year = "2018"
type = "paper"
access = "free"
marks = ["core"]
url = "https://arxiv.org/abs/1803.04585"
link_text = "Link"
description = "Sorts Goodhart's Law failures into four variants (regressional, causal, extremal, adversarial), each with its own mechanism. The taxonomy that Practices 1 and 3 and the mini-project use to classify metric failures."
verified = 2026-10-13

[[groups.items]]
id = "open-problems-in-cooperative-ai"
title = "Open Problems in Cooperative AI"
authors = "Allan Dafoe, Edward Hughes, Yoram Bachrach et al."
year = "2020"
type = "paper"
access = "free"
marks = ["core"]
url = "https://arxiv.org/abs/2012.08630"
link_text = "Link"
description = "Sets out cooperative AI as a research agenda: AI systems that cooperate with humans and with each other, organized around four capabilities (understanding, communication, commitment, institutions) and drawing on game theory, mechanism design and social choice. Practice 5 uses its framing."
verified = 2026-10-13

[[groups.items]]
id = "the-off-switch-game"
title = "The Off-Switch Game"
authors = "Dylan Hadfield-Menell, Anca Dragan, Pieter Abbeel & Stuart Russell"
year = "2016 (rev. 2017)"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/1611.08219"
link_text = "Link"
description = "Game-theoretic analysis of the shutdown problem: a robot that is uncertain about the human's objective, and treats the human's choice to switch it off as information, has an incentive to defer; the incentive shrinks as the robot grows more certain or the human less rational. Practice 2 reproduces the core result. arXiv, November 2016; revised June 2017."
verified = 2026-10-21

[[groups.items]]
id = "incomplete-contracting-and-ai-alignment"
title = "Incomplete Contracting and AI Alignment"
authors = "Dylan Hadfield-Menell & Gillian K. Hadfield"
year = "2019"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/1804.04268"
link_text = "Link"
description = "*Proceedings of the 2019 AAAI/ACM Conference on AI, Ethics, and Society* (arXiv 2018). Proposes the law-and-economics analysis of incomplete contracting as a framework for alignment. Human contracts work because external structure (culture, law, institutions) supplies the implied terms that fill their gaps; the paper sets out a research agenda for AI that can draw on that structure. The bridge from Section 05's contract theory to alignment."
verified = 2026-10-13

[[groups.items]]
id = "concrete-problems-in-ai-safety"
title = "Concrete Problems in AI Safety"
authors = "Dario Amodei, Chris Olah, Jacob Steinhardt, Paul Christiano, John Schulman, Dan Mané"
year = "2016"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/1606.06565"
link_text = "Link"
description = "Five practical research problems in AI safety: avoiding side effects, avoiding reward hacking, scalable supervision, safe exploration, and robustness to distributional shift. Reward hacking is Goodhart's Law applied to reinforcement learning; Practice 3 recasts these problems as incentive problems. Also used in philosophy/07."
verified = 2026-10-21

[[groups.items]]
id = "the-alignment-problem"
title = "The Alignment Problem"
authors = "Brian Christian"
year = "2020"
type = "book"
access = "paid"
level = "beginner"
description = "Accessible narrative covering the AI alignment problem. Connects incentive design, value learning, and fairness."

[[groups.items]]
id = "multi-principal-assistance-games"
title = "Multi-Principal Assistance Games"
authors = "Arnaud Fickinger, Simon Zhuang, Dylan Hadfield-Menell & Stuart Russell"
year = "2020"
type = "paper"
access = "free"
url = "https://arxiv.org/abs/2007.09540"
link_text = "Link"
description = "Extends cooperative AI to settings with multiple human principals who have conflicting preferences. Connects to social choice theory."
verified = 2026-10-13

[[groups.items]]
id = "bluedot-impact-ai-safety-courses"
title = "Online AI safety courses and project sprints"
authors = "BlueDot Impact"
year = "2026"
type = "course"
access = "free"
level = "beginner"
url = "https://bluedot.org/courses"
link_text = "BlueDot"
description = "Course catalog of BlueDot Impact (formerly \"AI Safety Fundamentals\"). As of October 2026 it runs from a free, two-hour self-paced introduction, *The Future of AI*, to multi-week courses and project sprints on AI safety and governance. Structured background for Practice 5. Also used in philosophy/07."
verified = 2026-10-21

[[groups.items]]
id = "ai-alignment-forum"
title = "AI Alignment Forum"
authors = "LessWrong team (maintainers)"
year = "2018"
type = "website"
label = "Forum"
access = "free"
url = "https://www.alignmentforum.org/"
link_text = "Link"
description = "Research forum on AI alignment, launched in 2018 and run by the LessWrong team; direct posting is limited to established researchers, and others' submissions go through review. Much of the discussion is about incentives, mechanism design and game theory; the mini-project draws on its posts on mild optimization. Also used in philosophy/11."
verified = 2026-10-21

