[[groups.items]]
id = "the-foundations-of-statistics"
title = "The Foundations of Statistics (2nd rev. ed.)"
authors = "Leonard J. Savage"
year = "1954 (2nd rev. ed. 1972)"
type = "book"
access = "paid"
level = "advanced"
url = "https://store.doverpublications.com/products/9780486623498"
link_text = "Dover"
description = "The foundational axiomatization of subjective expected utility theory, including the sure-thing principle that the Ellsberg urn violates. Dense but historically essential; the Dover paperback is the 1972 second revised edition."
verified = 2026-10-21

[[groups.items]]
id = "risk-uncertainty-and-profit"
title = "Risk, Uncertainty and Profit"
authors = "Frank Knight"
year = "1921"
type = "book"
access = "free"
level = "intermediate"
url = "https://oll.libertyfund.org/titles/knight-risk-uncertainty-and-profit"
link_text = "Link"
description = "Introduced the crucial distinction between measurable risk and unmeasurable uncertainty (\"Knightian uncertainty\")."
verified = 2026-10-13

[[groups.items]]
id = "theory-of-games-and-economic-behavior-ch"
title = "Theory of Games and Economic Behavior: 60th Anniversary Commemorative Edition (Ch. 1 & Appendix)"
authors = "John von Neumann & Oskar Morgenstern"
year = "1944 (commemorative ed. 2004, paperback 2007)"
type = "book"
access = "paid"
level = "advanced"
url = "https://press.princeton.edu/books/paperback/9780691130613/theory-of-games-and-economic-behavior"
link_text = "Princeton University Press"
description = "The book that founded game theory. Ch. 1 argues for numerical utility; the axiomatic derivation of expected utility was added as an appendix in the 1947 second edition. Read that appendix (\"The Axiomatic Treatment of Utility\" in the linked Princeton edition, which adds an introduction by Harold W. Kuhn and an afterword by Ariel Rubinstein) for the normative starting point."
verified = 2026-10-21

[[groups.items]]
id = "decision-theory-stanford-encyclopedia-of"
title = "Decision Theory (Stanford Encyclopedia of Philosophy)"
authors = "Katie Steele & H. Orri Stefánsson"
year = "2015 (rev. 2025)"
type = "article"
access = "free"
marks = ["core"]
url = "https://plato.stanford.edu/entries/decision-theory/"
link_text = "Link"
description = "Free, authoritative overview of normative decision theory: preferences and utility, the von Neumann–Morgenstern and Savage representation theorems, Jeffrey's theory, and challenges such as Allais-type risk attitudes and unawareness. The normative counterweight to this section's mostly behavioral readings."
verified = 2026-10-13

[[groups.items]]
id = "rational-choice-in-an-uncertain-world"
title = "Rational Choice in an Uncertain World: The Psychology of Judgment and Decision Making (2nd ed.)"
authors = "Reid Hastie & Robyn M. Dawes"
year = "2009"
type = "book"
access = "paid"
level = "intermediate"
url = "https://collegepublishing.sagepub.com/products/rational-choice-in-an-uncertain-world-2-231783"
link_text = "SAGE"
description = "Clear textbook on the psychology of judgment and decision-making, more formal than Kahneman. Used for Bayesian reasoning and decision analysis in Practices 2 and 4."
verified = 2026-10-21

[[groups.items]]
id = "predictably-irrational"
title = "Predictably Irrational: The Hidden Forces That Shape Our Decisions"
authors = "Dan Ariely"
year = "2008"
type = "book"
access = "paid"
level = "beginner"
url = "https://danariely.com/books/"
link_text = "Author's page"
verified = 2026-10-21
description = "Accessible popular introduction to behavioral anomalies in decision-making. ⚠️ Read critically: a 2012 *PNAS* honesty study Ariely co-authored was retracted in 2021 after evidence its field data were fabricated, and the \"Ten Commandments\" honesty result described in the book failed a 25-lab preregistered replication (2018). In August–September 2026 a failed replication and Data Colada's forensic analysis ([Part 1](https://datacolada.org/138), [Part 2](https://datacolada.org/139)) reported evidence of fabricated or altered data in Ariely & Wertenbroch's 2002 study of self-imposed deadlines, which the book's chapter on procrastination describes; as of September 2026 Wertenbroch had asked *Psychological Science* to retract it."
