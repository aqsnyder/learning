[[groups]]

[[groups.items]]
id = "thinking-fast-and-slow"
title = "Thinking, Fast and Slow"
authors = "Daniel Kahneman"
year = "2011"
type = "book"
access = "paid"
level = "beginner"
marks = ["core"]
url = "https://www.penguin.co.uk/books/56314/thinking-fast-and-slow-by-kahneman-daniel/9780141033570"
link_text = "Penguin"
verified = 2026-10-21
description = "Kahneman's popular account of decades of research on judgment and decision-making: heuristics, biases, prospect theory, and two-systems thinking. ⚠️ Some studies it relies on have not survived replication, notably the social-priming results (Ch. 4) and ego depletion (Ch. 3); Kahneman later conceded he \"placed too much faith in underpowered studies.\" Its treatment of the basketball \"hot hand\" as an illusion is contested too: Miller & Sanjurjo, \"Surprised by the Hot Hand Fallacy?\" ([*Econometrica* 2018](https://doi.org/10.3982/ECTA14943)), found a bias in the original test (Practice 5). The core heuristics-and-biases and prospect-theory findings have held up much better."

[[groups.items]]
id = "reconstruction-of-a-train-wreck-how"
title = "Reconstruction of a Train Wreck: How Priming Research Went off the Rails"
authors = "Ulrich Schimmack, Moritz Heene & Kamini Kesavan"
year = "2017"
type = "article"
access = "free"
url = "https://replicationindex.com/2017/02/02/reconstruction-of-a-train-wreck-how-priming-research-went-of-the-rails/"
link_text = "Link"
description = "Statistical audit of the priming studies cited in Ch. 4 of *Thinking, Fast and Slow*, showing they were too underpowered to be credible; Kahneman's reply in the comments accepts the critique. Read right after Kahneman as a lesson in judging evidence."
verified = 2026-10-13

[[groups.items]]
id = "prospect-theory-an-analysis-of-decision"
title = "Prospect Theory: An Analysis of Decision under Risk"
authors = "Daniel Kahneman & Amos Tversky"
year = "1979"
type = "paper"
access = "paid"
marks = ["core"]
url = "https://www.jstor.org/stable/1914185"
link_text = "Link"
description = "The most-cited paper in economics. Introduced loss aversion, reference dependence, and probability weighting. Foundational."
verified = 2026-10-13

