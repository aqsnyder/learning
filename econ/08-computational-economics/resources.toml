[[groups.items]]
id = "quantecon-lectures-quantitative"
title = "QuantEcon Lectures (Quantitative Economics with Python)"
authors = "Thomas J. Sargent & John Stachurski"
type = "book"
access = "free"
url = "https://quantecon.org/lectures/"
link_text = "Link"
description = "Free, continuously updated lecture series on computational economics in Python: dynamic programming, job search, Markov dynamics, optimal savings, asset pricing. Start with \"A First Course in Quantitative Economics with Python.\" The canonical numerical-methods side of computational economics."
verified = 2026-10-13

[[groups.items]]
id = "large-language-models-as-simulated"
title = "Large Language Models as Simulated Economic Agents: What Can We Learn from Homo Silicus?"
authors = "John J. Horton, Apostolos Filippas & Benjamin S. Manning"
year = "2023 (rev. 2026)"
type = "paper"
access = "free"
url = "https://www.nber.org/papers/w31122"
link_text = "Link"
description = "Treats LLMs as simulated economic agents — given endowments, information, and preferences — and re-runs classic behavioral experiments on them. The starting point for LLM-based economic simulation; read skeptically about how far \"silicon subjects\" generalize to people."
verified = 2026-10-13

[[groups.items]]
id = "artificial-intelligence-algorithmic"
title = "Artificial Intelligence, Algorithmic Pricing, and Collusion"
authors = "Emilio Calvano, Giacomo Calzolari, Vincenzo Denicolò & Sergio Pastorello"
year = "2020"
type = "paper"
url = "https://doi.org/10.1257/aer.20190623"
link_text = "Link"
description = "*American Economic Review* 110(10). In a standard repeated price-competition oligopoly, Q-learning pricing algorithms consistently learn to charge supracompetitive prices without communicating with one another, sustained by a finite phase of punishment followed by a gradual return to cooperation. The experiment behind this section's mini-project; [Section 15](../15-industrial-organization-and-strategy/README.md) takes up the antitrust question."
verified = 2026-10-13

[[groups.items]]
id = "mesa-3-agent-based-modeling-with-python"
title = "Mesa 3: Agent-Based Modeling with Python in 2025"
authors = "Ewout ter Hoeven, Jan Kwakkel et al."
year = "2025"
type = "paper"
url = "https://joss.theoj.org/papers/10.21105/joss.07668"
link_text = "Link"
description = "Paper describing Mesa, the main open-source Python framework for agent-based models; its documentation (mesa.readthedocs.io) has tutorials and example models. Use it to see market and social outcomes emerge from simple agent rules where closed-form equilibria don't exist."
verified = 2026-10-13
