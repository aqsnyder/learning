[[groups]]

[[groups.items]]
id = "an-introduction-to-the-theory-of"
title = "An Introduction to the Theory of Mechanism Design"
authors = "Tilman Börgers"
year = "2015"
type = "book"
access = "paid"
level = "intermediate"
marks = ["core"]
url = "https://global.oup.com/academic/product/an-introduction-to-the-theory-of-mechanism-design-9780199734023"
link_text = "Link"
description = "A clear modern textbook on mechanism design: social choice, incentive compatibility, VCG, revenue-maximizing auctions, and bilateral trade (Myerson–Satterthwaite). Backs Practices 3–5."
verified = 2026-10-13

[[groups.items]]
id = "counterspeculation-auctions-and"
title = "Counterspeculation, Auctions, and Competitive Sealed Tenders"
authors = "William Vickrey"
year = "1961"
type = "paper"
access = "paid"
marks = ["core"]
url = "https://doi.org/10.1111/j.1540-6261.1961.tb02789.x"
link_text = "Link"
description = "Introduced the Vickrey (second-price) auction, in which bidding your true value is a dominant strategy (published in the *Journal of Finance*). Foundation of modern auction theory and the starting point for Practice 1. Nobel Prize work."
verified = 2026-10-21

[[groups.items]]
id = "incentive-compatibility-and-the"
title = "Incentive Compatibility and the Bargaining Problem"
authors = "Roger Myerson"
year = "1979"
type = "paper"
access = "paid"
url = "https://doi.org/10.2307/1912346"
link_text = "Link"
description = "The revelation principle paper (*Econometrica*): any equilibrium outcome of any mechanism can be reproduced by a direct mechanism in which telling the truth is optimal, so a designer can restrict attention to incentive-compatible mechanisms. Used for Practice 5 and Check Yourself 1."
verified = 2026-10-21

[[groups.items]]
id = "auction-theory"
title = "Auction Theory (2nd ed.)"
authors = "Vijay Krishna"
year = "2009"
type = "book"
access = "paid"
level = "advanced"
url = "https://shop.elsevier.com/books/auction-theory/krishna/978-0-12-374507-1"
link_text = "Link"
description = "The standard graduate textbook on auction theory: independent private values, revenue equivalence, risk aversion, common values and the winner's curse, optimal auctions, and multi-unit auctions. Used in Practices 1–3 and the mini-project's pay-as-bid bids."
verified = 2026-10-21

[[groups.items]]
id = "optimal-auction-design"
title = "Optimal Auction Design"
authors = "Roger Myerson"
year = "1981"
type = "paper"
access = "paid"
url = "https://doi.org/10.1287/moor.6.1.58"
link_text = "Link"
description = "Showed how to design revenue-maximizing auctions (*Mathematics of Operations Research*): virtual valuations, the optimal reserve price, and revenue equivalence in general form. The source for Practice 3."
verified = 2026-10-21

[[groups.items]]
id = "the-lovely-but-lonely-vickrey-auction"
title = "The Lovely but Lonely Vickrey Auction"
authors = "Lawrence Ausubel & Paul Milgrom"
year = "2006"
type = "paper"
access = "free"
url = "https://siepr.stanford.edu/publications/working-paper/lovely-lonely-vickrey-auction"
link_text = "Link"
description = "Why Vickrey auctions are theoretically beautiful but rarely used in practice. Bridges theory and practice. The link is Stanford SIEPR's page for the free August 2004 working-paper version."
verified = 2026-10-13

[[groups.items]]
id = "nobel-prize-lecture-paul-milgrom"
title = "Nobel Prize Lecture — Paul Milgrom"
authors = "Paul Milgrom"
year = "2020"
type = "video"
access = "free"
level = "intermediate"
url = "https://www.nobelprize.org/prizes/economic-sciences/2020/milgrom/lecture/"
link_text = "Link"
description = "Milgrom's Nobel lecture on improvements to auction theory and new auction formats."
verified = 2026-10-13

[[groups.items]]
id = "scientific-background-mechanism-design"
title = "Scientific Background: Mechanism Design Theory"
authors = "Royal Swedish Academy of Sciences"
year = "2007"
type = "article"
access = "free"
url = "https://www.nobelprize.org/prizes/economic-sciences/2007/advanced-information/"
link_text = "Link"
description = "Free survey written for the 2007 prize to Hurwicz, Maskin, and Myerson: incentive compatibility, the revelation principle, and implementation theory, with their history. A compact map of the field to read before or alongside Börgers."
verified = 2026-10-13

[[groups.items]]
id = "stable-matching-theory-evidence-and"
title = "Stable Matching: Theory, Evidence, and Practical Design"
authors = "Royal Swedish Academy of Sciences"
year = "2012"
type = "article"
access = "free"
url = "https://www.nobelprize.org/prizes/economic-sciences/2012/popular-information/"
link_text = "Link"
description = "Accessible background for the 2012 prize to Shapley and Roth: Gale–Shapley deferred acceptance and stability, and Roth's redesigns of the U.S. medical residency match, New York City school choice, and kidney exchange. Covers market design without prices, which the auction-focused readings here leave out."
verified = 2026-10-13
