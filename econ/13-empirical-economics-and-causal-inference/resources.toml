[[groups]]

[[groups.items]]
id = "mastering-metrics-the-path-from-cause-to"
title = "Mastering 'Metrics: The Path from Cause to Effect"
authors = "Joshua D. Angrist & Jörn-Steffen Pischke"
year = "2014"
type = "book"
access = "paid"
level = "beginner"
marks = ["core"]
url = "https://press.princeton.edu/books/paperback/9780691152844/mastering-metrics"
link_text = "Link"
description = "The gentlest rigorous introduction, one chapter per tool: randomized trials, regression, instrumental variables, regression discontinuity, differences-in-differences, then the returns to schooling as a case study. Princeton UP lists it as December 2014 (©2015)."
verified = 2026-10-13

[[groups.items]]
id = "mastering-econometrics"
title = "Mastering Econometrics"
authors = "Joshua Angrist (MRU)"
type = "course"
url = "https://learn.mru.org/courses/mastering-econometrics"
link_text = "Link"
description = "Free video companion to *Mastering 'Metrics* from Marginal Revolution University: units on randomized trials, regression, IV, RD and DiD, plus bonus material on the 2021 Nobel."
verified = 2026-10-13

[[groups.items]]
id = "causal-inference-the-mixtape"
title = "Causal Inference: The Mixtape"
authors = "Scott Cunningham"
year = "2021"
type = "book"
access = "free"
level = "intermediate"
url = "https://mixtape.scunning.com/"
link_text = "Link"
description = "Yale University Press, 2021. The free online edition has been updated as *Causal Inference: The Remix*: DAGs and potential outcomes, unconfoundedness and matching, RD, IV, and panel designs including complex difference-in-differences and synthetic control. R and Stata code; the data are in `causaldata`."
verified = 2026-10-13

[[groups.items]]
id = "the-effect-an-introduction-to-research"
title = "The Effect: An Introduction to Research Design and Causality (2nd ed.)"
authors = "Nick Huntington-Klein"
year = "2025"
type = "book"
access = "free"
level = "beginner"
url = "https://theeffectbook.net/"
link_text = "Link"
description = "Chapman & Hall, 2nd ed. 2025, free to read online. Strongest on research design and causal diagrams before it opens the toolbox: regression, matching, fixed effects, event studies, DiD, IV, RD, partial identification. Code in R, Stata and Python."
verified = 2026-10-13

