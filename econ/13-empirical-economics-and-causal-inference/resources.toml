[[groups.items]]
id = "natural-experiments-help-answer"
title = "Natural experiments help answer important questions (Nobel 2021 popular background)"
authors = "Royal Swedish Academy of Sciences"
year = "2021"
type = "article"
url = "https://www.nobelprize.org/prizes/economic-sciences/2021/popular-information/"
link_text = "Link"
description = "The credibility revolution in plain language. Card and Krueger's New Jersey–Pennsylvania minimum-wage comparison; quarter of birth as an instrument for schooling (about 9% per extra year, against 7% from the raw correlation); LATE; the Mariel boatlift."
verified = 2026-10-13

[[groups.items]]
id = "evaluating-replicability-of-laboratory"
title = "Evaluating replicability of laboratory experiments in economics"
authors = "Colin F. Camerer, Anna Dreber, Eskil Forsell et al."
year = "2016"
type = "paper"
url = "https://doi.org/10.1126/science.aaf0918"
link_text = "Link"
description = "*Science* 351(6280). A coordinated replication of published economics lab experiments: the calibration point for \"how often does this replicate?\", next to the multi-lab replications in Section 06."
verified = 2026-10-13

[[groups.items]]
id = "star-wars-the-empirics-strike-back"
title = "Star Wars: The Empirics Strike Back"
authors = "Abel Brodeur, Mathias Lé, Marc Sangnier & Yanos Zylberberg"
year = "2016"
type = "paper"
url = "https://doi.org/10.1257/app.20150044"
link_text = "Link"
description = "*AEJ: Applied Economics* 8(1). About 50,000 test statistics from the *AER*, *JPE* and *QJE* form a \"two-humped camel\": p-values missing between 0.25 and 0.10 reappear just past 0.05. The authors estimate that 10–20% of marginally significant results are inflated by specification choices."
verified = 2026-10-13

[[groups.items]]
id = "causaldata"
title = "causaldata"
authors = "Nick Huntington-Klein"
year = "2024"
type = "tool"
url = "https://pypi.org/project/causaldata/"
link_text = "Link"
description = "Example datasets for causal inference in Python, R and Stata, from *The Effect* and *The Mixtape*: NSW/CPS job training, Card's college proximity, close U.S. House elections, castle-doctrine laws, organ-donor registration and more. Every exercise below uses it (v0.1.5, MIT licence)."
