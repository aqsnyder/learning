authors = "Royal Swedish Academy of Sciences"
year = "2014"
type = "paper"
url = "https://www.nobelprize.org/prizes/economic-sciences/2014/advanced-information/"
link_text = "Link"
description = "The technical companion to the popular background (PDF)."
verified = 2026-10-13

[[groups.items]]
id = "industrial-organization-markets-and"
title = "Industrial Organization: Markets and Strategies (2nd ed.)"
authors = "Paul Belleflamme & Martin Peitz"
