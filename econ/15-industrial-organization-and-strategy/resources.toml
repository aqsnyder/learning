[[groups]]

[[groups.items]]
id = "introduction-to-industrial-organization"
title = "Introduction to Industrial Organization (2nd ed.)"
authors = "Luis Cabral"
year = "2017"
type = "book"
access = "paid"
level = "intermediate"
marks = ["core"]
url = "https://mitpress.mit.edu/9780262035941/introduction-to-industrial-organization/"
link_text = "Link"
description = "A concise, applied undergraduate text covering the core of IO with many real-world examples; rigorous without being heavily technical. The best first IO book for a practitioner (MIT Press)."
verified = 2026-10-13

[[groups.items]]
id = "market-power-and-regulation-nobel-2014"
title = "Market power and regulation (Nobel 2014 popular background)"
authors = "Royal Swedish Academy of Sciences"
year = "2014"
type = "article"
marks = ["core"]
url = "https://www.nobelprize.org/prizes/economic-sciences/2014/popular-information/"
link_text = "Link"
description = "Tirole's work in plain language. Simple rules such as price caps or bans on below-cost pricing help in some markets and harm in others. It covers regulating firms whose costs the regulator can't see (menus of contracts), vertical relations, and two-sided platforms. The conclusion: good competition policy differs from market to market."
verified = 2026-10-13

[[groups.items]]
