[[groups.items]]
id = "the-five-competitive-forces-that-shape"
title = "The Five Competitive Forces That Shape Strategy"
authors = "Michael E. Porter"
year = "2008"
type = "article"
url = "https://hbr.org/2008/01/the-five-competitive-forces-that-shape-strategy"
link_text = "Link"
description = "*Harvard Business Review*, January 2008. Porter's restatement of the five forces: rivalry among competitors, the power of suppliers and of customers, the threat of new entrants, and the threat of substitutes. The management-school bridge from IO to strategy."
verified = 2026-10-13

[[groups.items]]
id = "amazon-s-antitrust-paradox"
title = "Amazon's Antitrust Paradox"
authors = "Lina M. Khan"
year = "2017"
type = "paper"
url = "https://www.yalelawjournal.org/note/amazons-antitrust-paradox"
link_text = "Link"
description = "*Yale Law Journal* 126. The structural critique: a consumer-welfare standard focused on short-run prices misses platform power built through below-cost pricing and vertical integration. One side of a live, contested debate. Read it with Shapiro."
verified = 2026-10-13

[[groups.items]]
id = "antitrust-in-a-time-of-populism"
title = "Antitrust in a time of populism"
authors = "Carl Shapiro"
year = "2018"
type = "paper"
url = "https://doi.org/10.1016/j.ijindorg.2018.01.001"
link_text = "Link"
description = "*International Journal of Industrial Organization* 61. Argues for tougher merger enforcement and close scrutiny of the largest firms' specific conduct, but holds that antitrust is \"ill suited\" to address large firms' political power, inequality or job creation directly. The other side."
verified = 2026-10-13

[[groups.items]]
